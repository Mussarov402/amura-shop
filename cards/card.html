<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css">
<!-- Карточка товара AMURA (docs/CARDS.md), 1086×1448, без ИИ. make.py открывает её с ?d=<JSON> и снимает PNG.
     Фон рисуется CSS/SVG; если рядом лежит bg.jpg (фото магазина AMURA) — make.py передаёт bg и фото встаёт вместо нарисованного. -->
<style>
:root{--brown:#5A2E14;--beige:#EAD9C3;--gold:#C9A063;--blue:#1E6FE8;--ink:#141414}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1086px;height:1448px;overflow:hidden}
body{position:relative;font-family:'Roboto Condensed',sans-serif;color:var(--ink);background:#EFE2CF}
.ab{position:absolute}

/* ---------- фон: магазин ---------- */
#store{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 42%,#FFF8EE 0%,#F4E7D3 45%,#E3CBA9 100%)}
#photo{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(6px) saturate(.9) brightness(1.05)}
#photo+#veil{position:absolute;inset:0;background:radial-gradient(70% 55% at 50% 45%,rgba(255,248,238,.78),rgba(244,231,211,.45) 60%,rgba(227,203,169,.25))}
.shelf{position:absolute;top:120px;width:250px;height:880px;filter:blur(2.2px);opacity:.9}
.shelf.l{left:-20px}.shelf.r{right:-20px;transform:scaleX(-1)}
#floor{position:absolute;left:0;right:0;top:1000px;bottom:0}

/* ---------- верх ---------- */
#sign{left:0;right:0;top:34px;text-align:center}
#sign .w{font:900 96px/1 Montserrat;letter-spacing:.14em;padding-left:.14em;background:linear-gradient(180deg,#FFF1C9 0%,#E9C987 32%,#C9A063 55%,#8C6430 78%,#D8B475 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #7A5426) drop-shadow(0 4px 2px rgba(90,46,20,.35)) drop-shadow(0 0 22px rgba(255,214,140,.85))}
#sign .c{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:6px;font:600 28px 'Roboto Condensed';letter-spacing:.42em;padding-left:.42em;color:#9A7440}
#sign .c i{display:block;width:90px;height:2px;background:linear-gradient(90deg,transparent,#C9A063)}
#sign .c i:last-child{transform:scaleX(-1)}
#orig{right:34px;top:40px;display:flex;align-items:center;gap:10px}
#orig .b{width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#5A9BFF,#1E6FE8 60%,#1350B0);box-shadow:0 6px 16px rgba(30,111,232,.4),inset 0 0 0 4px rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center}
#orig .t{font:700 22px/1.05 'Roboto Condensed';color:var(--blue);letter-spacing:.02em}
#orig .t b{display:block;font:900 30px/1 Montserrat}

/* ---------- заголовок ---------- */
#title{left:60px;right:60px;top:184px;text-align:center}
#title .br{font:700 24px 'Roboto Condensed';letter-spacing:.5em;padding-left:.5em;color:#6B5A48}
#title .n1{margin-top:6px;font:900 54px/1.04 Montserrat;color:var(--ink);text-transform:uppercase}
#title .n2{margin-top:4px;font:400 40px/1.1 'Roboto Condensed';color:#2A2A2A}
#title .sp{margin-top:6px;font:700 34px 'Roboto Condensed';color:var(--blue);letter-spacing:.03em}
#title .pill{display:inline-block;margin-top:12px;background:var(--beige);color:var(--brown);border-radius:999px;padding:9px 34px;font:700 28px 'Roboto Condensed';box-shadow:0 4px 12px rgba(90,46,20,.12),inset 0 0 0 2px rgba(201,160,99,.45)}

/* ---------- товар и подиум ---------- */
#podium{left:420px;top:930px;width:600px;height:210px}
#prod{position:absolute;background-repeat:no-repeat;background-size:contain;background-position:center bottom;filter:drop-shadow(0 26px 30px rgba(90,46,20,.32))}
#frame{position:absolute;border-radius:28px;background:#fff;padding:16px;box-shadow:0 20px 50px rgba(90,46,20,.25),inset 0 0 0 3px #EAD9C3}
#frame div{width:100%;height:100%;border-radius:18px;background-size:cover;background-position:center}

/* ---------- преимущества ---------- */
#ben{left:30px;top:470px;width:380px;display:flex;flex-direction:column;gap:14px}
.bf{display:flex;gap:14px;align-items:flex-start;background:rgba(255,251,245,.88);border-radius:22px;padding:16px 16px 16px 14px;box-shadow:0 6px 18px rgba(90,46,20,.10),inset 0 0 0 1.5px rgba(201,160,99,.35)}
.bf .ic{flex:none;width:64px;height:64px;border-radius:50%;border:2.5px solid var(--brown);display:flex;align-items:center;justify-content:center;background:#FBF3E8}
.bf .tx b{display:block;font:700 26px/1.08 'Roboto Condensed';color:var(--brown);text-transform:uppercase}
.bf .tx span{display:block;margin-top:5px;font:400 21px/1.22 'Roboto Condensed';color:#4A3A2E}

/* ---------- цены ---------- */
#price{left:30px;right:30px;top:1150px;display:flex;gap:20px}
.pr{flex:1;height:150px;border-radius:28px;background:linear-gradient(180deg,#FBF4EA,#EAD9C3);box-shadow:0 10px 26px rgba(90,46,20,.18),inset 0 0 0 2px rgba(201,160,99,.6);display:flex;align-items:center;gap:16px;padding:0 24px}
.pr .ic{flex:none;width:78px;height:78px;border-radius:50%;background:var(--brown);display:flex;align-items:center;justify-content:center}
.pr .l{font:700 26px 'Roboto Condensed';letter-spacing:.16em;color:#8A6A4A}
.pr .v{font:900 66px/1 Montserrat;color:var(--brown);letter-spacing:-.01em;white-space:nowrap}
.pr .v small{font-size:52px;margin-left:6px}

/* ---------- низ ---------- */
#foot{left:30px;right:30px;top:1326px;height:96px;border-radius:24px;background:rgba(255,251,245,.9);box-shadow:inset 0 0 0 1.5px rgba(201,160,99,.4);display:flex;align-items:center}
#foot .it{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;font:700 23px/1.1 'Roboto Condensed';color:var(--brown)}
#foot .sep{width:2px;height:54px;background:rgba(201,160,99,.6)}
</style></head><body>
<div id="store"></div>
<script>
const D = JSON.parse(new URLSearchParams(location.search).get('d'));
const $ = (h, p = document.body) => { const t = document.createElement('template'); t.innerHTML = h.trim(); const n = t.content.firstChild; p.appendChild(n); return n; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = n => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

/* Линейные иконки 40×40, коричневые (stroke = currentColor) */
const ICON = {
  drop: '<path d="M20 5 C 13 14, 9 19, 9 25 a11 11 0 0 0 22 0 c0-6-4-11-11-20Z"/><path d="M14 26 a6 6 0 0 0 5 5"/>',
  shield: '<path d="M20 4 L33 9 V19 C33 28 27 33 20 36 C13 33 7 28 7 19 V9 Z"/><path d="M14 20 l4 4 8-9"/>',
  leaf: '<path d="M8 32 C 8 14, 18 7, 33 7 C 33 22, 26 32, 8 32Z"/><path d="M8 32 L24 16"/>',
  layers: '<path d="M20 6 L34 13 L20 20 L6 13 Z"/><path d="M6 20 L20 27 L34 20"/><path d="M6 27 L20 34 L34 27"/>',
  milk: '<path d="M14 5 h12 v6 l4 6 v17 a2 2 0 0 1-2 2 H12 a2 2 0 0 1-2-2 V17 l4-6Z"/><path d="M10 22 c5 -3 15 3 20 0"/>',
  sparkle: '<path d="M20 5 L23 17 L35 20 L23 23 L20 35 L17 23 L5 20 L17 17Z"/>',
  feather: '<path d="M31 9 C 22 6, 11 14, 11 27 L11 32 L16 32 C 29 32, 34 19, 31 9Z"/><path d="M8 35 L24 17"/>',
  heart: '<path d="M20 33 C 6 24, 5 15, 10 10 C 14 6, 19 8, 20 12 C 21 8, 26 6, 30 10 C 35 15, 34 24, 20 33Z"/>',
  eye: '<path d="M4 20 C 10 11, 30 11, 36 20 C 30 29, 10 29, 4 20Z"/><circle cx="20" cy="20" r="5"/>',
  lash: '<path d="M5 22 C 12 16, 28 16, 35 22"/><path d="M10 18 L7 11 M15 16 L14 9 M20 15.5 V8 M25 16 L26 9 M30 18 L33 11"/>',
  curl: '<path d="M8 30 C 8 16, 20 10, 30 12"/><path d="M12 24 l-4 -4 M17 18 l-3 -5 M23 14 l-1 -5 M29 12 l1 -5"/>',
  water: '<path d="M5 15 c5-4 10 4 15 0 s10 4 15 0"/><path d="M5 23 c5-4 10 4 15 0 s10 4 15 0"/><path d="M5 31 c5-4 10 4 15 0 s10 4 15 0"/>',
  sun: '<circle cx="20" cy="20" r="7"/><path d="M20 4v5M20 31v5M4 20h5M31 20h5M8.7 8.7l3.5 3.5M27.8 27.8l3.5 3.5M8.7 31.3l3.5-3.5M27.8 12.2l3.5-3.5"/>',
  clock: '<circle cx="20" cy="20" r="14"/><path d="M20 11 V20 L26 24"/>',
  hand: '<path d="M13 34 C 9 30, 8 25, 8 20 V12 a2.5 2.5 0 0 1 5 0 V19 V8 a2.5 2.5 0 0 1 5 0 V18 V7 a2.5 2.5 0 0 1 5 0 V19 V10 a2.5 2.5 0 0 1 5 0 V24 C 28 30, 25 34, 20 34Z"/>',
  check: '<circle cx="20" cy="20" r="14"/><path d="M13 20 l5 5 9-10"/>',
  flask: '<path d="M16 5 h8 M17 5 v10 L8 31 a3 3 0 0 0 3 4 h18 a3 3 0 0 0 3-4 L23 15 V5"/><path d="M12 25 h16"/>',
};
const ic = (k, size = 40, color = 'var(--brown)', sw = 2.4) => `<svg width="${size}" height="${size}" viewBox="0 0 40 40" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" style="color:${color}">${ICON[k] || ICON.check}</svg>`;

/* ---------- фон ---------- */
if (D.bg) { $(`<div id="photo" style="background-image:url(${D.bg})"></div>`); $('<div id="veil"></div>'); }
else {
  // полка: светящиеся планки + силуэты флаконов (каждый раз одинаковые — «случайность» от номера)
  const rnd = (k => () => (k = (k * 9301 + 49297) % 233280) / 233280)(7);
  const shelf = side => { let s = `<svg class="shelf ${side}" viewBox="0 0 250 880"><defs><linearGradient id="gl${side}" x1="0" x2="1"><stop offset="0" stop-color="#FFE7B8" stop-opacity=".95"/><stop offset="1" stop-color="#FFF6E0" stop-opacity=".2"/></linearGradient></defs>`;
    s += '<rect x="0" y="0" width="250" height="880" fill="rgba(214,186,146,.35)"/>';
    for (let r = 0; r < 5; r++) { const y = 70 + r * 175;
      let x = 14; while (x < 225) { const w = 18 + rnd() * 26, h = 60 + rnd() * 70, c = ['#F8EEDF', '#E9D3B3', '#D7B88C', '#FFFFFF', '#C9A57A'][Math.floor(rnd() * 5)];
        s += `<rect x="${x}" y="${y + 100 - h}" width="${w}" height="${h}" rx="${w / 3}" fill="${c}" opacity=".85"/><rect x="${x + w * .25}" y="${y + 92 - h}" width="${w * .5}" height="12" rx="3" fill="${c}" opacity=".9"/>`; x += w + 6 + rnd() * 6; }
      s += `<rect x="0" y="${y + 100}" width="250" height="12" fill="url(#gl${side})"/><rect x="0" y="${y + 112}" width="250" height="26" fill="rgba(255,226,170,.35)"/>`; }
    return s + '</svg>'; };
  $(shelf('l')); $(shelf('r'));
  $(`<svg id="floor" viewBox="0 0 1086 448" preserveAspectRatio="none"><defs>
    <filter id="mb" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".006 .02" numOctaves="4" seed="3"/><feColorMatrix values="0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .38  0 0 -2.2 0 1.25"/></filter>
    <linearGradient id="fl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6EBDD"/><stop offset="1" stop-color="#E7D6C0"/></linearGradient></defs>
    <rect width="1086" height="448" fill="url(#fl)"/><rect width="1086" height="448" filter="url(#mb)" opacity=".55"/>
    <rect width="1086" height="60" fill="rgba(255,236,200,.55)"/></svg>`);
}

/* ---------- вывеска и значок ---------- */
$('<div id="sign" class="ab"><div class="w">AMURA</div><div class="c"><i></i>Cosmetics<i></i></div></div>');
$(`<div id="orig" class="ab"><div class="b">${ic('check', 46, '#fff', 3.4).replace('<circle cx="20" cy="20" r="14"/>', '')}</div><div class="t"><b>100%</b>ОРИГИНАЛ</div></div>`);

/* ---------- заголовок ---------- */
$(`<div id="title" class="ab"><div class="br">${esc(D.brand)}</div><div class="n1">${esc(D.title[0])}</div>${D.title[1] ? `<div class="n2">${esc(D.title[1])}</div>` : ''}${D.spec ? `<div class="sp">${esc(D.spec)}</div>` : ''}${D.type ? `<div class="pill">${esc(D.type)}</div>` : ''}</div>`);

/* ---------- подиум: мраморный шестигранник ---------- */
$(`<svg id="podium" class="ab" viewBox="0 0 600 210"><defs>
  <filter id="pm"><feTurbulence type="fractalNoise" baseFrequency=".012 .05" numOctaves="4" seed="9"/><feColorMatrix values="0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .36  0 0 -2.4 0 1.3"/><feComposite in2="SourceGraphic" operator="in"/></filter>
  <linearGradient id="ps" x1="0" x2="1"><stop offset="0" stop-color="#CDB79A"/><stop offset=".22" stop-color="#E8DACA"/><stop offset=".5" stop-color="#F7EFE4"/><stop offset=".78" stop-color="#E2D2BE"/><stop offset="1" stop-color="#BFA585"/></linearGradient>
  <radialGradient id="pt" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#EFE4D6"/></radialGradient></defs>
  <ellipse cx="300" cy="186" rx="300" ry="24" fill="rgba(90,46,20,.22)"/>
  <path d="M30 78 L130 120 L470 120 L570 78 L570 150 L470 192 L130 192 L30 150Z" fill="url(#ps)"/>
  <path d="M30 78 L130 120 L470 120 L570 78 L570 150 L470 192 L130 192 L30 150Z" fill="#000" filter="url(#pm)" opacity=".45"/>
  <path d="M130 120 V192 M470 120 V192" stroke="rgba(150,120,90,.45)" stroke-width="2"/><path d="M30 150 L130 192 L470 192 L570 150" fill="none" stroke="#B88E55" stroke-width="4"/>
  <path d="M30 78 L130 36 L470 36 L570 78 L470 120 L130 120Z" fill="url(#pt)"/>
  <path d="M30 78 L130 36 L470 36 L570 78 L470 120 L130 120Z" fill="#000" filter="url(#pm)" opacity=".35"/>
  <path d="M30 78 L130 36 L470 36 L570 78 L470 120 L130 120Z" fill="none" stroke="#D2B07A" stroke-width="3"/>
  <path d="M30 78 L130 120 L470 120 L570 78" fill="none" stroke="#C9A063" stroke-width="4"/></svg>`);

/* товар стоит на верхней грани подиума (её середина — y≈1008); поле 560×520 */
const box = { cx: 720, bottom: 1014, w: 600, h: 540 };
if (D.frame) {
  const w = 420, h = Math.min(500, Math.round(w / D.ratio));
  $(`<div id="frame" style="left:${box.cx - w / 2}px;top:${box.bottom - h - 6}px;width:${w}px;height:${h}px"><div style="background-image:url(${D.img})"></div></div>`);
} else {
  let w = box.w, h = Math.round(w / D.ratio); if (h > box.h) { h = box.h; w = Math.round(h * D.ratio); }
  $(`<div id="prod" style="left:${box.cx - w / 2}px;top:${box.bottom - h}px;width:${w}px;height:${h}px;background-image:url(${D.img})"></div>`);
}

/* ---------- преимущества ---------- */
const ben = $('<div id="ben" class="ab"></div>');
D.benefits.slice(0, 4).forEach(b => $(`<div class="bf"><div class="ic">${ic(b.icon)}</div><div class="tx"><b>${esc(b.title)}</b><span>${esc(b.text)}</span></div></div>`, ben));

/* ---------- цены ---------- */
const BOX = '<svg width="46" height="46" viewBox="0 0 40 40" fill="none" stroke="#F6E9D6" stroke-width="2.6" stroke-linejoin="round"><path d="M5 12 L20 5 L35 12 V28 L20 35 L5 28Z"/><path d="M5 12 L20 19 L35 12 M20 19 V35"/><path d="M12.5 8.5 L27.5 15.5"/></svg>';
const BAG = '<svg width="46" height="46" viewBox="0 0 40 40" fill="none" stroke="#F6E9D6" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"><path d="M8 13 H32 L30 35 H10Z"/><path d="M14 16 V11 a6 6 0 0 1 12 0 V16"/></svg>';
const pr = $('<div id="price" class="ab"></div>');
[[BOX, 'ОПТ', D.opt], [BAG, 'РОЗНИЦА', D.rtl]].forEach(([i, l, v]) => { if (v) $(`<div class="pr"><div class="ic">${i}</div><div><div class="l">${l}</div><div class="v">${fmt(v)}<small>₸</small></div></div></div>`, pr); });

/* ---------- низ ---------- */
$(`<div id="foot" class="ab"><div class="it">${ic('check', 40)}Оригинальный<br>товар</div><div class="sep"></div><div class="it">${ic('flask', 40).replace(ICON.flask, '<path d="M4 12 H24 V28 H4Z"/><path d="M24 17 H31 L36 23 V28 H24"/><circle cx="11" cy="30" r="3.5"/><circle cx="29" cy="30" r="3.5"/>')}Доставка по всем<br>регионам KZ</div><div class="sep"></div><div class="it">${ic('shield', 40)}Надёжная<br>упаковка</div></div>`);
document.title = 'ready';
</script></body></html>
