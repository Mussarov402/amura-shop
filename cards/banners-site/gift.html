     скачать https://admin.amura.kz/banners/img/8e76ea95c940dba46a3f0d70 → src/gift_full.png и выполнить:
     python3 -c "from PIL import Image,ImageDraw,ImageChops;im=Image.open('src/gift_full.png').convert('RGB').crop((890,30,2172,724));w,h=im.size;m=Image.new('L',(w,h),255);d=ImageDraw.Draw(m);[d.line([(i,0),(i,h)],fill=int(255*i/140)) for i in range(140)];[d.line([(w-1-i,0),(w-1-i,h)],fill=int(255*i/160)) for i in range(160)];d.rectangle([0,0,95,330],fill=0);g=Image.linear_gradient('L').resize((w,h)).point(lambda v:min(255,int(v*h/90)));im.putalpha(ImageChops.multiply(m,g));im.save('src/gift_prod.png')"

<style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;position:relative;overflow:hidden;background:radial-gradient(70% 90% at 75% 40%,#1f6b4a 0%,#0f4630 45%,#072b1d 100%);font-family:Montserrat,sans-serif;color:#fff}
.ab{position:absolute}

.tx{left:40px;right:40px;top:34px;text-align:center}

.t2{display:inline-block;margin-top:6px;font:900 96px/1 Montserrat;letter-spacing:-.02em;background:linear-gradient(180deg,#fff3c4 0%,#e9c46a 45%,#b8862b 100%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));white-space:nowrap}

</style></head><body>
<div class="ab rib"></div>
<img class="ab prod" src="src/gift_prod.png">
