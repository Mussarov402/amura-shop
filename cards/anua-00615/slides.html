<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css">
<!-- Anua PDRN Hyaluronic Acid 100 Moisturizing Cream, 60 мл (00615): галерея WB/Ozon (900×1200) и рич-контент (1440×900).
     Бриф Аналитика 27.10. Тексты — только из описания и этикетки, без цен и без процентов «клинически доказано».
     Фоны/сцены — ElevenLabs (bg/*.png), туба — настоящее фото без фона (tube.png). Надписи — вёрстка (точные буквы).
     Рендер: node render.js → out/g1..g6.png, out/r1..r6.png -->
<style>
:root { --mint: #E6F4F1; --teal: #1FA79A; --ink: #2B2B2B; --acc: #FFE45C }
* { margin: 0; box-sizing: border-box } body { font-family: Montserrat, sans-serif; color: var(--ink); overflow: hidden; position: relative; background: var(--mint) }
.bg { position: absolute; inset: 0; background-size: cover; background-position: center }
.ab { position: absolute }
.h1 { font: 900 72px/1.05 Montserrat; letter-spacing: -.01em } .h2 { font: 800 52px/1.1 Montserrat } .sub { font: 600 32px/1.3 Montserrat; color: #4a5653 }
.pill { display: inline-flex; align-items: center; gap: 14px; padding: 18px 28px; border-radius: 999px; background: rgba(255,255,255,.92); font: 700 34px Montserrat; box-shadow: 0 8px 24px rgba(31,167,154,.15) }
.pill i { width: 18px; height: 18px; border-radius: 50%; background: var(--teal); flex: none }
.card { background: rgba(255,255,255,.93); border-radius: 32px; box-shadow: 0 10px 30px rgba(31,167,154,.14); padding: 28px 30px }
.card b { display: block; font: 800 36px/1.15 Montserrat; color: var(--teal) } .card span { display: block; margin-top: 8px; font: 600 28px/1.3 Montserrat }
.num { width: 76px; height: 76px; border-radius: 50%; background: var(--teal); color: #fff; font: 900 40px/76px Montserrat; text-align: center; flex: none }
.step { display: flex; align-items: center; gap: 24px; font: 700 36px/1.2 Montserrat }
.no { display: flex; align-items: center; gap: 18px; font: 700 34px Montserrat } .no s { width: 64px; height: 64px; border-radius: 50%; border: 5px solid #d9534f; position: relative; flex: none; text-decoration: none }
.no s::after { content: ''; position: absolute; left: 50%; top: 6px; bottom: 6px; width: 5px; background: #d9534f; transform: translateX(-50%) rotate(45deg) }
.yes { display: flex; align-items: center; gap: 18px; font: 700 34px Montserrat } .yes s { width: 64px; height: 64px; border-radius: 50%; background: var(--teal); flex: none; position: relative; text-decoration: none }
.yes s::after { content: ''; position: absolute; left: 20px; top: 14px; width: 18px; height: 30px; border: solid #fff; border-width: 0 6px 6px 0; transform: rotate(45deg) }
.top { position: absolute; left: 0; right: 0; top: 0; background: linear-gradient(135deg, #0B6E66, #1FA79A); clip-path: polygon(0 0, 100% 0, 100% 78%, 0 100%) }
.T { font: 900 84px/.98 Montserrat; color: #fff; text-transform: uppercase; letter-spacing: -.015em } .T em { font-style: normal; color: var(--acc) }
.t2 { font: 700 34px/1.2 Montserrat; color: #E3FFF9 }
.badge { position: absolute; border-radius: 50%; background: var(--acc); color: #0B4F49; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; box-shadow: 0 16px 36px rgba(11,79,73,.3); transform: rotate(-10deg) }
.badge b { font: 900 92px/.9 Montserrat } .badge span { font: 700 26px/1.1 Montserrat; text-transform: uppercase; margin-top: 6px }
.chip { display: inline-flex; align-items: center; gap: 14px; padding: 16px 26px 16px 16px; border-radius: 22px; background: #fff; font: 700 32px/1.1 Montserrat; box-shadow: 0 10px 26px rgba(11,79,73,.18) }
.chip u { width: 58px; height: 58px; border-radius: 16px; background: var(--teal); color: #fff; font: 900 26px/58px Montserrat; text-align: center; text-decoration: none; flex: none }
.tag { display: inline-block; padding: 10px 22px; border-radius: 12px; background: var(--acc); color: #0B4F49; font: 900 30px Montserrat; text-transform: uppercase }
.big { font: 900 150px/.85 Montserrat; color: var(--teal) }
.ic { background: #fff; border-radius: 30px; padding: 26px; box-shadow: 0 12px 30px rgba(11,79,73,.16); border-top: 10px solid var(--teal) }
.ic b { display: block; font: 900 38px/1.05 Montserrat; color: #0B6E66; text-transform: uppercase } .ic span { display: block; margin-top: 10px; font: 700 27px/1.25 Montserrat }
.brand { font: 700 30px Montserrat; color: var(--teal); letter-spacing: .04em }
</style></head><body>
<script>
const q = new URLSearchParams(location.search), id = q.get('s'), P = (n) => `bg/${n}.png`;
const tube = (x, y, h, rot = 0) => `<img class="ab" src="tube.png" style="left:${x}px;top:${y}px;height:${h}px;transform:rotate(${rot}deg);filter:drop-shadow(0 30px 40px rgba(20,90,80,.25))">`;
const S = {
  /* ── галерея 900×1200: яркий стиль WB — бирюзовая шапка со скосом, жёлтые акценты, крупная туба ── */
  g1: [900, 1200, `<div class="bg" style="background-image:url(${P('g1')})"></div>
    <div class="top" style="height:500px"></div><div class="ab" style="left:56px;top:56px;right:56px"><span class="tag">Anua · Корея · 60 мл</span><div class="T" style="margin-top:22px">Увлажняющий<br>крем <em>с PDRN</em></div><div class="t2" style="margin-top:16px">и гиалуроновой кислотой</div></div>
    ${tube(590, 380, 800, 8)}
    <div class="badge" style="left:330px;top:470px;width:250px;height:250px"><span style="margin:0 0 4px">до</span><b>100</b><span>часов<br>увлажнения</span></div>
    <div class="ab" style="left:40px;bottom:70px;display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <div class="chip"><u style="font-size:19px">DNA</u>PDRN из ДНК лосося</div><div class="chip"><u>HA</u>Гиалуроновая кислота</div><div class="chip"><u>✓</u>Лёгкая текстура</div></div>`],
  g1o: [900, 1200, `<div class="bg" style="background-image:url(${P('g1')})"></div>
    <div class="top" style="height:500px"></div><div class="ab" style="left:56px;top:56px;right:56px"><span class="tag">Anua · Корея · 60 мл</span><div class="T" style="margin-top:22px">Увлажняющий<br>крем <em>с PDRN</em></div><div class="t2" style="margin-top:16px">и гиалуроновой кислотой</div></div>
    ${tube(340, 390, 790, 6)}`],
  g2: [900, 1200, `<div class="bg" style="background-image:url(${P('g2')})"></div>
    <div class="top" style="height:330px"></div><div class="ab" style="left:56px;top:56px;right:56px"><div class="T">Что <em>внутри</em></div><div class="t2" style="margin-top:14px">3 ключевых компонента</div></div>
    <div class="ab" style="left:40px;top:370px;width:500px;display:flex;flex-direction:column;gap:24px">
      <div class="ic"><b>PDRN</b><span>низкомолекулярный, из ДНК лосося</span></div>
      <div class="ic"><b>Гиалуроновая кислота</b><span>глубокое увлажнение</span></div>
      <div class="ic"><b>Коллаген</b><span>упругость и сияние</span></div></div>${tube(610, 300, 860, 8)}`],
  g3: [900, 1200, `<div class="bg" style="background-image:url(${P('g3')})"></div>
    <div class="top" style="height:330px"></div><div class="ab" style="left:56px;top:56px;right:56px"><div class="T">Что даёт<br><em>коже</em></div></div>
    <div class="ab" style="left:40px;top:380px;width:420px"><div class="big">100</div><div class="ic" style="margin-top:14px;border-top:0;padding:20px 24px"><b style="font-size:34px">часов увлажнения</b></div></div>
    ${tube(560, 300, 860, 8)}
    <div class="ab" style="left:40px;right:40px;bottom:60px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
      <div class="ic"><b>Барьер</b><span>восстанавливает</span></div><div class="ic"><b>Сияние</b><span>придаёт коже</span></div><div class="ic"><b>Упругость</b><span>придаёт коже</span></div></div>`],
  g4: [900, 1200, `<div class="bg" style="background-image:url(${P('g4')})"></div>
    <div class="top" style="height:330px"></div><div class="ab" style="left:56px;top:56px;right:56px"><div class="T">Изумрудная<br><em>лёгкая</em> текстура</div></div>
    <div class="ab" style="left:40px;bottom:70px;display:flex;flex-direction:column;gap:18px;align-items:flex-start">
      <div class="chip"><u>⚡</u>Быстро впитывается</div><div class="chip"><u>✓</u>Не оставляет липкости</div></div>`],
  g5: [900, 1200, `<div class="bg" style="background-image:url(${P('g5')})"></div>
    <div class="top" style="height:330px"></div><div class="ab" style="left:56px;top:56px;right:56px"><div class="T">Как <em>наносить</em></div></div>${tube(600, 220, 600, 10)}<div class="ab" style="left:40px;top:480px;width:470px"><div class="big">3</div><div class="ic" style="margin-top:14px;padding:30px 28px 40px"><b style="font-size:34px">шага ухода</b><span>утром и вечером</span></div></div>
    <div class="ab" style="left:40px;right:40px;bottom:60px;display:flex;flex-direction:column;gap:20px">
      <div class="chip" style="font-size:36px"><u style="font-size:32px">1</u>Очистите кожу</div>
      <div class="chip" style="font-size:36px"><u style="font-size:32px">2</u>Нанесите тонер и сыворотку</div>
      <div class="chip" style="font-size:36px"><u style="font-size:32px">3</u>Завершите уход кремом</div></div>`],
  g6: [900, 1200, `<div class="bg" style="background-image:url(${P('g6')})"></div>
    <div class="top" style="height:330px"></div><div class="ab" style="left:56px;top:56px;right:56px"><div class="T">Кому <em>подходит</em></div></div>${tube(560, 280, 620, 6)}
    <div class="ab" style="left:40px;top:380px;width:440px;display:flex;flex-direction:column;gap:18px">
      <div class="tag" style="align-self:flex-start">Для всех типов кожи</div><div class="tag" style="align-self:flex-start;background:#fff">Включая чувствительную</div></div>
    <div class="ab card" style="left:40px;right:40px;bottom:60px;display:grid;grid-template-columns:1fr 1fr;gap:24px 20px;padding:32px">
      <div class="no"><s></s>Без отдушек</div><div class="no"><s></s>Без искусственных красителей</div>
      <div class="sub" style="grid-column:1/3;text-align:center;font-weight:700;color:#0B6E66">Сделано в Корее · 60 мл</div></div>`],
  /* ── рич-контент 1440×900 ── */
  r1: [1440, 900, `<div class="bg" style="background-image:url(${P('r1')})"></div>
    <div class="ab" style="left:80px;top:250px;width:640px"><div class="brand">ANUA · PDRN HYALURONIC ACID 100</div>
      <div class="h1" style="margin-top:18px">PDRN + гиалуроновая кислота</div><div class="h2" style="margin-top:22px;color:var(--teal)">Увлажнение до&nbsp;100&nbsp;часов</div></div>${tube(843, 48, 740)}`],
  r2: [1440, 900, `<div class="bg" style="background-image:url(${P('r2')})"></div>
    <div class="ab h1" style="left:80px;top:90px">Почему PDRN</div>
    <div class="ab" style="left:80px;top:270px;width:600px;display:flex;flex-direction:column;gap:26px">
      <div class="card"><b>Низкомолекулярный PDRN</b><span>из ДНК лосося</span></div>
      <div class="card"><b>Работает в команде</b><span>с гиалуроновой кислотой и коллагеном</span></div></div>`],
  r3: [1440, 900, `<div class="bg" style="background-image:url(${P('r3')})"></div>
    <div class="ab h1" style="left:80px;top:90px">Результат ухода</div>
    <div class="ab" style="left:80px;right:80px;bottom:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px">
      <div class="card"><b>Глубокое увлажнение</b><span>до 100 часов</span></div>
      <div class="card"><b>Сияние и упругость</b><span>для ежедневного ухода</span></div>
      <div class="card"><b>Кожный барьер</b><span>восстанавливает</span></div></div>`],
  r4: [1440, 900, `<div class="bg" style="background-image:url(${P('r4')})"></div>
    <div class="ab card" style="left:80px;bottom:90px;width:720px;padding:36px"><b style="font-size:46px">Изумрудный лёгкий крем</b><span style="font-size:34px">впитывается быстро и без липкости</span></div>`],
  r5: [1440, 900, `<div class="bg" style="background-image:url(${P('r5')})"></div>
    <div class="ab h1" style="left:80px;top:90px">Ритуал ухода</div><div class="ab sub" style="left:80px;top:190px">Утром и вечером, последним этапом</div>
    <div class="ab" style="left:80px;right:80px;bottom:110px;display:grid;grid-template-columns:repeat(3,1fr);gap:30px">
      <div class="card step"><div class="num">1</div>Очистите кожу</div>
      <div class="card step"><div class="num">2</div>Тонер и сыворотка</div>
      <div class="card step"><div class="num">3</div>Крем Anua PDRN</div></div>`],
  r6: [1440, 900, `<div class="bg" style="background-image:url(${P('r6')})"></div>
    <div class="ab h1" style="left:80px;top:110px">Для кого</div>${tube(1010, 120, 680, -6)}
    <div class="ab card" style="left:80px;top:260px;width:720px;display:flex;flex-direction:column;gap:24px;padding:36px">
      <div class="yes"><s></s>Для всех типов кожи, включая чувствительную</div>
      <div class="no"><s></s>Без отдушек и искусственных красителей</div>
      <div class="sub">Республика Корея · 60 мл</div></div>`],
};
const [w, h, html] = S[id]; document.documentElement.style.width = document.body.style.width = w + 'px';
document.documentElement.style.height = document.body.style.height = h + 'px'; document.body.innerHTML = html;
window.SIZE = [w, h];
</script></body></html>
