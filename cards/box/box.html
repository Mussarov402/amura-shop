<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css">
<!-- Коробка нейтральная: без сайта, соцсетей и QR (штрафы WB 25–50 тыс. ₽). Вкладыши — insert.html.
     Концепция фирменной коробки AMURA для отправок WB/Ozon (03.11.2026). Превью: node cards/box/render.js → out/box_a|b|c.png.
     Логотип — cards/amura-logo.svg, цвета сайта (зелёный #0E3B2C, латунь #B89760, мята #E4EDE8). Размеры S/M/L — позже от Аналитика. -->
<style>
*{margin:0;box-sizing:border-box}body{width:1800px;height:1100px;font-family:Montserrat,Inter,sans-serif;background:#ECEAE6;position:relative;overflow:hidden;color:#1E1E1E}
.lg{display:block}
.tag{position:absolute;left:70px;top:56px;font:600 26px/1 Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#777}
.ttl{position:absolute;left:70px;top:96px;font:800 54px/1.1 Montserrat,sans-serif}
.scene{position:absolute;left:60px;top:230px;width:900px;height:820px;perspective:2600px}
.box{position:absolute;left:330px;top:300px;transform-style:preserve-3d;transform:rotateX(-24deg) rotateY(-38deg)}
.f{position:absolute;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;flex-direction:column}
.top{width:560px;height:400px;transform:translateY(-200px) rotateX(90deg);left:-280px;top:-200px}
.front{width:560px;height:240px;transform:translateZ(200px);left:-280px;top:-200px}
.side{width:400px;height:240px;transform:rotateY(90deg) translateZ(280px);left:-200px;top:-200px}
.shadow{position:absolute;left:120px;top:470px;width:640px;height:120px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.28),transparent);filter:blur(10px)}
.flap{position:absolute;right:80px;top:230px;width:700px;height:780px;border-radius:14px;padding:70px 64px;display:flex;flex-direction:column;align-items:center;text-align:center;box-shadow:0 30px 70px rgba(0,0,0,.18)}
.flap h2{font:800 58px/1.1 Montserrat,sans-serif;margin-top:36px}
.flap p{font:500 26px/1.45 Inter,sans-serif;margin-top:22px;opacity:.8}
.qr{margin-top:auto;display:flex;gap:28px;align-items:center;text-align:left}
.qr .q{padding:16px;border-radius:12px;background:#fff}
.qr .q svg{width:170px;height:170px;display:block;color:#111}
.qr div.t{font:600 26px/1.3 Inter,sans-serif}
.cap{position:absolute;font:600 20px/1 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#888}
.ft{font:500 22px/1 Inter,sans-serif;letter-spacing:.32em;text-transform:uppercase;margin-top:18px}
.sd{font:600 30px/1.5 Inter,sans-serif;text-align:center}
.sd small{display:block;font-weight:500;font-size:22px;letter-spacing:.2em;opacity:.7}
</style></head><body>
<div class="tag">Фирменная коробка AMURA · концепция</div><div class="ttl" id="ttl"></div>
<div class="scene"><div class="shadow"></div><div class="box">
 <div class="f top" id="top"></div><div class="f front" id="front"></div><div class="f side" id="side"></div></div>
 <div class="cap" style="left:60px;top:780px">крышка · лицевая · бок</div></div>
<div class="flap" id="flap"></div>
<div class="cap" style="right:80px;top:1035px">внутренняя сторона крышки</div>
<script>
const LOGO=`<svg class="lg" viewBox="0 0 141 25.5" fill="none" stroke="currentColor" stroke-width="1.5"><path transform="translate(0 0.5)" d="M1 24L10 1L19 24"/><path transform="translate(31 0.5)" d="M1 24V1L11 17L21 1V24"/><path transform="translate(64 0.5)" d="M1 1V15a8 8 0 0 0 16 0V1"/><path transform="translate(93 0.5)" d="M1 24V1H9a6.5 6.5 0 0 1 0 13H1M9 14L16 24"/><path transform="translate(121 0.5)" d="M1 24L10 1L19 24"/></svg>`, QR=`<svg viewBox="0 0 25 25"><path stroke="currentColor" d="M0 0.5h7m3 0h3m1 0h3m1 0h7m-25 1h1m5 0h1m3 0h2m1 0h2m3 0h1m5 0h1m-25 1h1m1 0h3m1 0h1m4 0h1m2 0h3m1 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h1m3 0h1m1 0h3m1 0h1m-25 1h1m1 0h3m1 0h1m4 0h1m1 0h4m1 0h1m1 0h3m1 0h1m-25 1h1m5 0h1m1 0h2m1 0h1m6 0h1m5 0h1m-25 1h7m1 0h1m1 0h1m1 0h1m1 0h1m1 0h1m1 0h7m-17 1h1m2 0h2m1 0h2m-15 1h2m3 0h1m2 0h6m3 0h2m1 0h1m-22 1h1m4 0h1m2 0h2m3 0h4m1 0h2m1 0h1m1 0h2m-25 1h1m2 0h2m1 0h1m1 0h1m2 0h1m3 0h1m4 0h3m1 0h1m-25 1h2m1 0h1m3 0h1m1 0h1m2 0h2m1 0h1m1 0h1m3 0h1m-18 1h4m1 0h1m1 0h3m2 0h1m1 0h2m4 0h1m-21 1h2m1 0h5m1 0h1m1 0h5m3 0h2m-25 1h4m2 0h1m1 0h1m2 0h2m1 0h3m1 0h1m2 0h2m1 0h1m-23 1h2m1 0h1m3 0h1m2 0h2m1 0h3m1 0h3m-22 1h4m2 0h1m2 0h3m2 0h1m1 0h5m2 0h1m-16 1h1m1 0h3m1 0h1m1 0h1m3 0h1m3 0h1m-25 1h7m2 0h2m1 0h3m1 0h1m1 0h1m1 0h1m3 0h1m-25 1h1m5 0h1m2 0h1m3 0h2m1 0h1m3 0h1m-21 1h1m1 0h3m1 0h1m3 0h2m1 0h1m1 0h6m2 0h2m-25 1h1m1 0h3m1 0h1m2 0h2m1 0h2m1 0h1m1 0h1m2 0h1m1 0h2m-24 1h1m1 0h3m1 0h1m1 0h1m1 0h1m4 0h2m2 0h3m1 0h2m-25 1h1m5 0h1m1 0h3m1 0h2m2 0h1m2 0h2m-21 1h7m2 0h1m3 0h2m1 0h2m3 0h1m2 0h1"/></svg>`;
const V={
 a:{t:'A · Минимализм',bg:'#F7F5F1',top:'#FBFAF7',front:'#F2EFE9',side:'#E8E4DC',ink:'#1E1E1E',flap:'#FBFAF7',fink:'#1E1E1E',pat:''},
 b:{t:'B · Премиум, зелёный и латунь',bg:'#E7E4DD',top:'#0E3B2C',front:'#0B3226',side:'#08281E',ink:'#C9A86A',flap:'#0E3B2C',fink:'#E9D7AE',pat:''},
 c:{t:'C · Яркий',bg:'#EAF4EE',top:'#5FC49A',front:'#4FB58B',side:'#3FA37A',ink:'#0E3B2C',flap:'#5FC49A',fink:'#0E3B2C',pat:'lam'}
};
const v=V[new URLSearchParams(location.search).get('v')||'a'];
document.body.style.background=v.bg;document.getElementById('ttl').textContent=v.t;
const lamPat=c=>`background-image:url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='90' height='80'><path d='M10 70L45 10L80 70' fill='none' stroke='${c}' stroke-width='3' opacity='.18'/></svg>`)}");background-size:90px 80px;`;
const face=(id,bg,html)=>{const e=document.getElementById(id);e.style.cssText+=`background:${bg};color:${v.ink};`+(v.pat?lamPat(v.ink):'');e.innerHTML=html;};
face('top',v.top,`<div style="width:340px">${LOGO}</div><div class="ft">Cosmetics</div>${v.t[0]==='B'?'<div style="width:120px;height:1px;background:currentColor;margin-top:26px;opacity:.6"></div>':''}`);
face('front',v.front,`<div style="width:230px">${LOGO}</div><div class="ft" style="font-size:16px">Cosmetics</div>`);
face('side',v.side,`<div class="sd" style="font-size:24px;line-height:1.35;padding:0 30px">Спасибо, что выбираете<br>корейский уход</div>`);
const f=document.getElementById('flap');f.style.background=v.flap;f.style.color=v.fink;
if(v.t[0]==='B')f.style.boxShadow+=',inset 0 0 0 10px #0E3B2C,inset 0 0 0 12px #B89760';
f.innerHTML=`<div style="width:300px">${LOGO}</div><div class="ft" style="font-size:18px">Cosmetics</div>
<h2 style="margin-top:auto">Спасибо,<br>что выбираете<br>корейский уход</h2><p style="margin-bottom:auto">Оригинальная корейская косметика.</p>`;
</script></body></html>
