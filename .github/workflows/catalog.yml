name: Выгрузка каталога из МойСклад

on:
  schedule:
    - cron: "47 * * * *"   # каждый час (коммит только если что-то изменилось)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: catalog

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - name: Выгрузка
        env:
          MS_TOKEN: ${{ secrets.MS_TOKEN }}
          OUT:
        run: python export_catalog.py
      - name: Сохранить
        run: |
          git config user.name "amura-bot"
          git config user.email "amura-bot@users.noreply.github.com"
          git add catalog.json img
          git diff --cached --quiet && echo "Без изменений" && exit 0
          git commit -m "Каталог $(TZ=Asia/Almaty date '+%d.%m.%Y %H:%M')"
          git push
