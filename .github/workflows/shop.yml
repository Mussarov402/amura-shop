name: Розничный сайт

# розница (index.html в корне, amura.kz) собирается из оптового opt/index.html (make_shop.py): любое изменение сайта сразу попадает и в розницу
on:
  push:
    branches: [main]
    paths: ["opt/index.html", "make_shop.py", "retail/**"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: shop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python make_shop.py
      - name: Сохранить
        run: |
          git config user.name "amura-bot"
          git config user.email "amura-bot@users.noreply.github.com"
          git add index.html manifest.webmanifest shop
          git diff --cached --quiet && echo "Без изменений" && exit 0
          git commit -m "Розничный сайт: пересобран из opt/index.html"
          git pull --rebase
          git push
