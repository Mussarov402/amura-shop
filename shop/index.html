<!doctype html>
<html lang="ru">
<head>
<!-- Собрано из index.html скриптом make_shop.py — не редактировать вручную -->
<script>window.AMURA_RETAIL = true; document.documentElement.dataset.theme = 'light';</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMURA — корейская косметика</title>
<meta name="description" content="Оригинальная корейская косметика с доставкой по Алматы и Казахстану.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://amura-shop-api.onrender.com" crossorigin>
<link rel="manifest" href="/shop/manifest.webmanifest">
<meta name="theme-color" content="#0E3B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMURA">
<link rel="apple-touch-icon" href="/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0E3B2C; --green-2:#15503C; --green-3:#1F6A50;
  --mint:#E4EDE8; --brass:#B89760;
  --bg:#F5F6F4; --surface:#FFFFFF; --ink:#16201B; --muted:#5F6B65; --line:#DDE3DF;
  --danger:#A23B2A; --warn-bg:#F6EEDC; --warn-fg:#6B4F1D;
  --radius-lg:22px; --radius:14px;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#1B5E45; --green-2:#227152; --green-3:#5FC49A; --mint:#1C2A24; --brass:#CDB07E;
    --bg:#0F1512; --surface:#17201C; --ink:#E9EFEB; --muted:#9AA8A1; --line:#28342E; --danger:#E0816F; color-scheme:dark; --warn-bg:#3A301C; --warn-fg:#EBD3A0;
  }
}
:root[data-theme="dark"]{
  --green:#1B5E45; --green-2:#227152; --green-3:#5FC49A; --mint:#1C2A24; --brass:#CDB07E;
  --bg:#0F1512; --surface:#17201C; --ink:#E9EFEB; --muted:#9AA8A1; --line:#28342E; --danger:#E0816F; color-scheme:dark; --warn-bg:#3A301C; --warn-fg:#EBD3A0;
}
html,body{overscroll-behavior:none}   /* iPhone: без «резинки» страницы — иначе вместе с ней едут шапка и нижняя панель */
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden}body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#0E3B2C;z-index:19;pointer-events:none}
header.top{position:sticky;top:0;z-index:20;background:#0E3B2C;color:#F2F5F3;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;white-space:nowrap;color:#fff;text-decoration:none}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:0;color:#A9C3B7;margin-top:-2px}
.search{flex:1;display:flex;background:#fff;border-radius:12px;overflow:hidden;min-width:0}
.search input{flex:1;min-width:0;border:0;padding:11px 14px;font-size:15px;color:#16201B;background:transparent}
.search input:focus{outline:none}
.count{background:var(--brass);color:#1b1408;border-radius:99px;font-size:12px;font-weight:800;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.brandsBar{background:#0E3B2C}
.brands{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.brands::-webkit-scrollbar{display:none}
/* как на WB: стрелки по краям, затухание у края, колесо и перетаскивание мышью (только компьютер) */
.brandsRow{position:relative}
.bArrow{position:absolute;top:0;bottom:12px;z-index:2;width:56px;border:0;display:flex;align-items:center;padding:0;color:#fff;cursor:pointer}
.bArrow svg{width:34px;height:34px;padding:7px;border-radius:50%;background:#fff;fill:none;stroke:#0E3B2C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.bArrow:hover svg{background:#E4EFE9}
.bArrow.prev{left:-4px;justify-content:flex-start;background:linear-gradient(90deg,#0E3B2C 55%,rgba(14,59,44,0))}
.bArrow.next{right:-4px;justify-content:flex-end;background:linear-gradient(270deg,#0E3B2C 55%,rgba(14,59,44,0))}
.bArrow[hidden]{display:none}
.brands.drag{cursor:grabbing;user-select:none}
.brands.drag .chip{pointer-events:none}
@media (pointer:coarse){.bArrow{display:none !important}}
.chip{flex:none;border:1px solid #2E6A54;background:transparent;color:#DCE7E1;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:#fff;color:#0E3B2C;border-color:#fff}

.hero{background:linear-gradient(180deg,#0E3B2C 0%,#0E3B2C 55%,var(--bg) 55%);padding:6px 0 0}
.bSlide h1{font-family:var(--display);font-weight:500;font-size:clamp(24px,4vw,40px);line-height:1.1;margin:0 0 10px;max-width:18ch;position:relative;z-index:1}
.bSlide p{margin:0;color:rgba(255,255,255,.82);max-width:46ch;position:relative;z-index:1}
.tiers-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.tiers-legend span{background:rgba(255,255,255,.1);border:1px solid rgba(205,176,126,.4);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:#F1E6D2}
/* карусель баннеров (как на WB/Ozon/Kaspi): слайды из banners.json — текст на цвете или картинка */
.banners{position:relative;border-radius:var(--radius-lg);overflow:hidden}
.bTrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.bTrack::-webkit-scrollbar{display:none}
.bSlide{flex:0 0 100%;scroll-snap-align:start;position:relative;min-height:210px;color:#fff;padding:30px 32px 40px;display:flex;flex-direction:column;justify-content:center;text-decoration:none;overflow:hidden;cursor:default}
.bSlide[data-link]{cursor:pointer}
.bSlide::after{content:"";position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 40px rgba(255,255,255,.04),0 0 0 90px rgba(255,255,255,.03);pointer-events:none}
.bSlide.pic{padding:0;min-height:0;aspect-ratio:4/1}
.bSlide.pic::after{display:none}
.bSlide.pic img{width:100%;height:100%;object-fit:cover;display:block}
.bSlide .bBtn{align-self:flex-start;margin-top:16px;background:#fff;color:#0E3B2C;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;position:relative;z-index:1}
.bNav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
.banners:hover .bNav{opacity:1}
.bNav svg{width:20px;height:20px;fill:none;stroke:#0E3B2C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bNav.prev{left:12px}.bNav.next{right:12px}
.bDots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:2}
.bDots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.45);transition:width .2s}
.bDots button[aria-current="true"]{width:22px;background:#fff}
.banners.one .bNav,.banners.one .bDots{display:none}
@media (pointer:coarse){.bNav{display:none}}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 14px}
.toolbar h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0}
.meta{color:var(--muted);font-size:13px}
select{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 16px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.thumb{aspect-ratio:3/4;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;border:0;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain}   /* фото товара — 3:4, как на WB (900×1200) */
.ph{font-family:var(--display);font-size:30px;color:#C9D3CE}
/* «Избранное»: сердечко на карточке и в карточке товара */
.fav{position:absolute;top:16px;right:16px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.12);cursor:pointer;padding:0}
.fav svg{width:21px;height:21px;fill:none;stroke:#5F6B66;stroke-width:1.8;stroke-linejoin:round;transition:transform .15s}
.fav:hover svg{stroke:#D6336C}
.fav[aria-pressed="true"] svg{fill:#E0245E;stroke:#E0245E}
.fav:active svg{transform:scale(.85)}
.sheet .fav{top:14px;right:auto;left:14px}
.tag{position:absolute;left:8px;top:8px;background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.brand{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.name{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;background:none;border:0;padding:0;text-align:left;font-weight:600}
.stock{font-size:12px;color:var(--green-3);font-weight:700}
.price-now{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-top:2px}
.price-now b{font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.price-now small{color:var(--muted);font-size:12px;font-weight:600}
.act{display:grid;gap:6px;margin-top:auto}
.tiers{display:grid;gap:5px}
.tiers button{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--muted);text-align:left}
.tiers button b{color:var(--ink);font-weight:800;white-space:nowrap}
.tiers button:hover:not(:disabled){border-color:var(--green-3)}
.tiers button.on{border-color:var(--green-3);background:var(--mint);color:var(--green-3);font-weight:700}
.tiers button.on b{color:var(--green-3)}
.tiers button:disabled{opacity:.45;cursor:not-allowed}
.buy{display:grid;gap:8px;padding-top:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--mint);border-radius:12px}
.stepper button{border:0;background:transparent;width:42px;height:40px;font-size:20px;font-weight:700;color:var(--green-3)}
.stepper input{width:56px;min-width:0;flex:1;text-align:center;border:0;background:transparent;font-weight:800;font-size:16px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{border:0;background:var(--green);color:#fff;font-weight:700;border-radius:12px;padding:11px;width:100%}
.add:hover{background:var(--green-2)}
.add.in{background:var(--mint);color:var(--green-3)}
.skel{background:linear-gradient(90deg,var(--line) 0%,var(--mint) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:8px}
.thumb.skel{border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
.hint{font-size:12px;color:var(--brass);font-weight:700;min-height:1.2em}

.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;text-align:center;margin:22px 0}
.notice h3{font-family:var(--display);font-weight:500;margin:0 0 8px}
.notice p{color:var(--muted);margin:0 auto;max-width:52ch}
.btn{border:0;background:var(--green);color:#fff;font-weight:700;border-radius:12px;padding:13px 20px;text-align:center;text-decoration:none;display:block;width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.tg{background:#229ED9}
.btn.wa{background:#1FA855}
.btn:disabled{opacity:.6;cursor:wait}
.more{display:block;margin:28px auto 56px;border:1.5px solid var(--green);color:var(--green-3);background:transparent;font-weight:700;border-radius:12px;padding:12px 28px}

/* кнопка «Каталог» и боковая панель брендов — как на WB */
.catBtn{flex:none;display:flex;align-items:center;gap:8px;border:0;background:#1F5A44;color:#fff;font-weight:700;font-size:15px;padding:10px 16px;border-radius:12px}
.catBtn:hover{background:#26694F}
.catBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.brk{display:none}
.catPanel{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(360px,86vw);background:var(--surface);color:var(--ink);transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.25)}
.catPanel.open{transform:none;visibility:visible;transition:transform .22s ease}
.catHead{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line)}
.catHead b{font-family:var(--display);font-size:20px}
.catHead button{border:0;background:var(--bg);width:38px;height:38px;border-radius:10px;font-size:18px;color:var(--ink)}
.catList{overflow-y:auto;padding:8px;flex:1}
.catList button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:11px 12px;border-radius:10px;font-size:15px}
.catList button:hover,.catList button[aria-current="true"]{background:var(--mint)}
.catList button[aria-current="true"]{font-weight:700;color:var(--green-3)}
.catList small{color:var(--muted);font-size:12.5px;margin-left:10px}
.back{border:0;background:transparent;color:var(--green-3);font-weight:700;font-size:15px;padding:6px 0;margin:0 0 4px;cursor:pointer}
.back:hover{text-decoration:underline}
.scrim{position:fixed;inset:0;background:rgba(8,20,15,.5);z-index:40;display:none}
.scrim.open{display:block}
.narrow{max-width:560px}
.page{padding-block:18px 8px}
.page-h{font-family:var(--display);font-weight:500;font-size:22px;margin:4px 0 8px}
body{padding-bottom:calc(84px + max(8px,calc(env(safe-area-inset-bottom,0px) - 12px)))}
body:not([data-view="home"]) .brandsBar{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#173A2A;border-radius:22px 22px 0 0;padding:10px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(8,25,18,.22);-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
/* компьютер: как в маркетплейсах — «Корзина» и «Кабинет» в шапке, нижней панели нет */
.topnav{display:none;margin-left:auto;gap:4px}
.topnav button{border:0;background:transparent;color:#DCE7E1;display:grid;justify-items:center;gap:2px;font-weight:600;font-size:12.5px;padding:4px 12px;border-radius:10px}
.topnav button:hover{background:#14503C;color:#fff}
.topnav button[aria-current="page"]{color:#fff}
.topnav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.topnav .ic{position:relative;display:grid}
.topnav .count{position:absolute;right:-12px;top:-6px}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:5px;color:rgba(233,241,236,.55);font-weight:700;font-size:13px;padding:4px 0}
.tabbar button[aria-current="page"]{color:#fff}
.tabbar svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar .ic{position:relative;display:grid}
.tabbar .count{position:absolute;right:-12px;top:-6px}
/* нижняя панель: плавающее «жидкое стекло» (как в iOS), отрезана от низа экрана; под активной вкладкой скользит капсула */
.tabbar{--nbb:max(8px,calc(env(safe-area-inset-bottom,0px) - 12px));--nb-bg:linear-gradient(180deg,#17553F,#0C3526);--nb-rim:rgba(255,255,255,.14);--nb-ink:rgba(236,243,239,.78);--nb-on:#F3D68F;--nb-cap:rgba(255,255,255,.14);--cl:0px;--cw:0px;--lo:0;
 left:12px;right:12px;bottom:var(--nbb);border-radius:999px;padding:6px;background:var(--nb-bg);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--nb-rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 32px rgba(4,20,14,.38),0 2px 8px rgba(4,20,14,.2)}
.tabbar::before{content:"";position:absolute;top:6px;bottom:6px;left:0;width:var(--cw);border-radius:999px;background:var(--nb-cap);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transform:translateX(var(--cl));opacity:var(--lo);pointer-events:none;transition:transform .5s cubic-bezier(.3,1.25,.5,1),width .35s cubic-bezier(.3,1.25,.5,1),opacity .3s}
.tabbar.nt::before{transition:none}
.tabbar,.tabbar button{-webkit-tap-highlight-color:transparent}
.tabbar button{position:relative;outline:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;color:var(--nb-ink);font-size:10.5px;gap:3px;padding:7px 0 6px;transition:color .3s}
.tabbar button[aria-current="page"],.tabbar button.on{color:var(--nb-on)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"] svg,.tabbar button.on svg{stroke-width:2.1}
.count[hidden]{display:none}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--mint);color:var(--green-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px}
.panel h4{margin:0;font-size:16px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px 14px;font-size:14px}
.order{display:grid;gap:8px}
.order .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.order .top b{font-size:15px}
.order .row{display:flex;gap:8px}
.order .row .btn{padding:10px}
.order details{font-size:13px;color:var(--muted)}
.order summary{cursor:pointer;font-weight:600}
.order li{margin:3px 0}
.list{display:grid;gap:12px;margin-top:12px}
.x{border:0;background:var(--mint);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.line .n{font-size:14px;font-weight:600}
.line .p{font-weight:800;text-align:right;white-space:nowrap}
.line .stepper{width:140px}
.line .stepper button{height:34px;width:38px}
.kv{font-size:12.5px;color:var(--muted)}
.sum{display:grid;gap:6px;padding:14px 0;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .total{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
form.co{display:grid;gap:12px;padding-top:6px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;font-size:14px;color:var(--muted)}

.ract{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.ract .line.rstep{display:block;padding:0;border:0}.ract .stepper{width:124px}
.rbuy{border:0;background:var(--mint);color:var(--green-3);font:inherit;font-weight:800;font-size:14px;border-radius:12px;padding:10px 14px;cursor:pointer}
@media(max-width:420px){.ract .stepper{width:104px}.ract{gap:6px}}
#viewCart .rstep2>.back{display:none}
.rdel{position:absolute;top:8px;right:6px;width:34px;height:34px}
.rfix{position:fixed;left:12px;right:12px;bottom:16px;z-index:25}
.rfixb{width:100%;border:0;border-radius:16px;background:var(--green);color:#fff;font:inherit;font-weight:800;font-size:16px;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 8px 24px rgba(8,25,18,.28);cursor:pointer}
.rfixb:disabled{opacity:.5}
.rco{padding-bottom:84px}
@media(max-width:899px){.rside .rgo,.rcart .rside{display:none}}
@media(min-width:900px){.rfix{display:none}.rco{padding-bottom:0}}
.rprov{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.rprov b{font-size:12.5px;font-weight:800;border-radius:8px;padding:3px 8px;background:var(--mint);color:var(--green-3)}
.rprov b.ya{background:#FFE14D;color:#1A1A1A}.rprov b.cd{background:#1AB248;color:#fff}

/* способы по городу: Алматы — 3 вкладки, другие города — одна (пункт выдачи СДЭК) */
.rtabs.n1{grid-template-columns:1fr}.rtabs.n2{grid-template-columns:repeat(2,minmax(0,1fr))}
.rfree{margin-top:8px;font-size:13px;font-weight:600;color:var(--ink)}
.rfree>b{color:var(--green-3)}
.rfree i{display:block;height:6px;border-radius:6px;background:var(--bg);margin-top:6px;overflow:hidden}
.rfree i b{display:block;height:100%;border-radius:6px;background:#1E9E5A}
.rtabs.n3 button{font-size:13px}
.rremember{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px;font-weight:700;cursor:pointer}
.rremember input{width:20px;height:20px;margin-top:2px;accent-color:var(--green-3);flex:none}
.rremember small{display:block;font-weight:500;font-size:12.5px;color:var(--muted);margin-top:2px}
/* iPhone не приближает экран при вводе: шрифт в полях не меньше 16px */
input,select,textarea{font-size:16px!important}
/* Алматы: 4 способа — на телефоне 2×2, на компьютере в ряд */
.rtabs.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:900px){.rtabs.n4{grid-template-columns:repeat(4,minmax(0,1fr))}}
/* юридические ссылки внизу (как на WB): мелко и серо, не мешают; на телефоне — над нижней панелью */
.rlegal{max-width:1200px;margin:40px auto 0;padding:18px 16px 24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);display:grid;gap:6px}
.rlegal nav{display:flex;flex-wrap:wrap;gap:4px 16px}
.rlegal a{color:var(--muted);text-decoration:none}.rlegal a:hover{color:var(--ink);text-decoration:underline}
@media(max-width:760px){.rlegal{display:none}}      /* телефон: как в приложении WB — подвала нет; оферта и политика — в строке у «Заказать» */
.rterms{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.4}.rterms a{color:var(--muted)}
/* экран «Заказ оформлен» */
.rdone{max-width:640px;margin:0 auto;gap:14px}
.rdone-h{display:flex;gap:14px;align-items:center}
.rdone-h h3{margin:0;font-size:21px;line-height:1.25}
.rdone-ok{width:52px;height:52px;flex:none}.rdone-ok circle{fill:#1E9E5A}.rdone-ok path{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.rsteps{list-style:none;margin:4px 0;padding:0 0 0 4px;display:grid;gap:0}
.rsteps li{position:relative;padding:0 0 16px 28px;display:grid;gap:2px}
.rsteps li::before{content:"";position:absolute;left:0;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface)}
.rsteps li::after{content:"";position:absolute;left:8px;top:21px;bottom:0;width:2px;background:var(--line)}
.rsteps li:last-child::after{display:none}
.rsteps li.on::before{background:#1E9E5A;border-color:#1E9E5A}
.rsteps b{font-size:15px}.rsteps span{font-size:13.5px;color:var(--muted)}
.rdone-d{display:grid;gap:8px}
.rdone-d .rrow b{text-align:right;font-weight:600}
/* отслеживание доставки в «Моих заказах» */
.rtrk{margin:10px 0 4px;padding:12px;border-radius:14px;background:var(--bg);display:grid;gap:10px}
.rtrk-l{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}.rtrk-l b{font-size:15px}.rtrk-l span{font-size:13px;color:var(--muted)}
.rtrk.bad .rtrk-l b{color:#B5661B}
.rtrk ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.rtrk li{display:grid;gap:5px;font-size:11.5px;color:var(--muted);text-align:center;justify-items:center}
.rtrk li i{display:block;width:100%;height:5px;border-radius:5px;background:var(--line)}
.rtrk li.on i{background:#1E9E5A}.rtrk li.cur span{color:var(--ink);font-weight:700}
.rtrk .btn{text-decoration:none;text-align:center}
[data-view="me"].rdot{position:relative}
[data-view="me"].rdot::after{content:"";position:absolute;top:6px;right:calc(50% - 16px);width:9px;height:9px;border-radius:50%;background:#E5483A;box-shadow:0 0 0 2px #173A2A}
/* Розничный сайт: отзывы */
.rpc-rate{font-size:13px;font-weight:700;display:flex;align-items:center;gap:3px}
.rpc-rate b{color:#E8A317;font-size:14px}.rpc-rate span{color:var(--muted);font-weight:500}
.rv-box{margin-top:18px;padding-top:14px;border-top:1px solid var(--line);display:grid;gap:10px}
.rv-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}.rv-h h4{margin:0;font-size:18px}.rv-h>span{font-size:13.5px;color:var(--muted)}
.rv-st{color:#E8A317;letter-spacing:1px}.rv-st i{font-style:normal;color:var(--line)}
.rv-i{display:grid;gap:3px;padding:10px 0;border-bottom:1px solid var(--line)}
.rv-t{display:flex;justify-content:space-between;align-items:center}
.rv-n{font-size:13.5px;font-weight:700}.rv-n em{font-style:normal;font-weight:700;color:var(--green-3);font-size:12px;margin-left:4px}
.rv-i p{margin:2px 0 0;font-size:14.5px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.rv-a{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13.5px}
.rv-f{display:grid;gap:8px}
.rv-pick{display:flex;gap:4px}.rv-pick button{border:0;background:none;font-size:32px;line-height:1;color:var(--line);cursor:pointer;padding:2px}.rv-pick button.on{color:#E8A317}
.rv-f textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font:inherit;font-size:15px;color:var(--ink);resize:vertical}
/* розница: одна высота у всей карусели (выбирается в панели) — картинки не обрезаются соседним текстовым баннером.
   Компьютер: s 4:1 (1600×400), m 3:1 (1500×500), l 5:2 (1500×600). Телефон: всегда 16:9 (1280×720). */
.banners[data-size] .bSlide{min-height:0}
.banners[data-size="s"] .bSlide{aspect-ratio:4/1}
.banners[data-size="m"] .bSlide{aspect-ratio:3/1}
.banners[data-size="l"] .bSlide{aspect-ratio:5/2}
.bSlide.pic picture{display:block;width:100%;height:100%}
@media(max-width:640px){
  .banners[data-size] .bSlide{aspect-ratio:16/9}
  .banners[data-size] .bSlide:not(.pic){padding:16px 18px 26px}
  .banners[data-size] .bSlide h1{font-size:20px;margin-bottom:6px;max-width:none}
  .banners[data-size] .bSlide p{font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .banners[data-size] .tiers-legend{margin-top:8px}
  .banners[data-size] .bBtn{margin-top:8px;padding:7px 12px;font-size:13px}
}
/* розница: товар — отдельная страница на весь экран (retail/product.js) */
body.rpage .modal{padding:0;place-items:stretch;z-index:45}
body.rpage .sheet{max-width:none;max-height:none;height:100%;border-radius:0;align-content:start;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;padding:0 max(16px,calc((100% - 1160px)/2)) 32px}
body.rpage #closeModal{display:none}
.rp-bar{grid-column:1/-1;position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:6px;background:var(--surface);
  padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;margin:0 calc(-1 * max(16px,calc((100vw - 1160px)/2)));padding-left:max(8px,calc((100vw - 1160px)/2));padding-right:max(8px,calc((100vw - 1160px)/2));border-bottom:1px solid var(--line)}
.rp-bar button{border:0;background:none;color:var(--ink);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;padding:0}
.rp-bar button:hover{background:var(--bg)}
.rp-bar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.rp-t{flex:1;font-weight:700;font-size:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.rp-bar em{position:absolute;top:3px;right:1px;min-width:18px;height:18px;border-radius:9px;background:#E5483A;color:#fff;font:700 11px/18px system-ui,sans-serif;font-style:normal;padding:0 4px}
.rp-rate{align-self:flex-start;border:0;background:none;padding:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.rp-rate b{color:#E8A317}
body.rpage .sheet .pic{border-radius:var(--radius-lg);margin-top:16px;align-self:start;position:sticky;top:76px;min-height:360px}
body.rpage .sheet .pic img{max-height:min(560px,70vh)}
body.rpage .sheet .info{padding:16px 0 0}
@media(max-width:760px){
  body.rpage .sheet{display:block;padding:0 0 calc(var(--rpact,150px) + 16px)}
  body.rpage .sheet .pic img{max-height:min(440px,55vh)}
  .rp-bar{margin:0;padding-left:4px;padding-right:4px}
  body.rpage .sheet .pic{position:relative;top:0;margin:0;border-radius:0;min-height:300px}
  body.rpage .sheet .info{padding:14px 16px 0}
  body.rpage .sheet .act{position:fixed;left:0;right:0;bottom:0;z-index:46;margin:0;background:var(--surface);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(8,25,18,.1);border-radius:16px 16px 0 0}
}
body.rpage .sheet .act .hint:empty{display:none}
</style>
</head>

<script>
/* ===== Настройки ===== */
const CONFIG = {
  catalogUrl: "catalog.json",
  apiUrl: "https://amura-shop-api.onrender.com",           // сервер на Render
  orderUrl: "https://amura-shop-api.onrender.com/order",
  botUsername: "amuraorders_bot",                            // бот, который присылает PDF
  managerWa: "77003671350",
  tierMid: 10,                                                // цена «от 10 шт» (тип цены «От 10шт» в МойСклад)
  liveUrl: "https://amura-shop-api.onrender.com/catalog",  // живые остатки и цены из МойСклад
  refreshMs: 180000,                                          // обновлять каждые 3 минуты
  loaderPrice: 1000,
  bankFee: 0.0095,
  shipping: [
    { id: "kamaz",   name: "КАМАЗ",            loader: true },
    { id: "rail",    name: "ЖД",               loader: true },
    { id: "avia",    name: "Авиа",             loader: true },
    { id: "kazpost", name: "Казпочта",         loader: false },
    { id: "courier", name: "Курьер по городу", loader: false },
    { id: "pickup",  name: "Самовывоз",        loader: false }
  ]
};
const PAGE = 40;

/* ===== Утилиты ===== */
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat("ru-RU").format(Math.round(n));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RETAIL = !!window.AMURA_RETAIL;   // розничный сайт amura.kz/shop: только розничные цены, заказы с пометкой «розница»
if(RETAIL){
  CONFIG.catalogUrl = "/catalog.json"; CONFIG.liveUrl += "?mode=retail";
  CONFIG.bankFee = 0;                       // рознице комиссию банка не добавляем
  CONFIG.shipping = [                       // без КАМАЗа, ЖД, авиа и Казпочты
    { id: "courier", name: "Курьер по городу", loader: false },
    { id: "cdek",    name: "СДЭК",             loader: false },
    { id: "pickup",  name: "Самовывоз",        loader: false }
  ];
}
const SK = k => RETAIL && k !== "amura-auth" ? "r:" + k : k;   // корзина и кэш розницы — отдельно от оптового сайта, вход общий
function load(k, d){ try{ const v = localStorage.getItem(SK(k)); return v ? JSON.parse(v) : d; }catch{ return d; } }
function save(k, v){ try{ localStorage.setItem(SK(k), JSON.stringify(v)); }catch{} }
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 2600); }

/* ===== Цена по количеству ===== */
function tierOf(it, q){
  if(it.box && it.boxQty && q >= it.boxQty) return "box";
  if(it.mid && q >= CONFIG.tierMid) return "mid";
  return "opt";
}
function unitPrice(it, q){ return it[tierOf(it, q)] || it.opt; }
function nextTierHint(it, q){
  const t = tierOf(it, q);
  if(t === "opt" && it.mid && it.mid < it.opt && CONFIG.tierMid <= it.qty) return `Ещё ${CONFIG.tierMid - q} шт — цена ${fmt(it.mid)} ₸`;
  if(t !== "box" && it.box && it.boxQty && it.boxQty <= it.qty && it.box < unitPrice(it, q)) return `Ещё ${it.boxQty - q} шт до короба — ${fmt(it.box)} ₸`;
  return "";
}
function tiersHTML(it, q){
  const t = tierOf(it, q);
  const rows = [["opt", 1, it.mid ? `1–${CONFIG.tierMid - 1} шт` : "от 1 шт", it.opt]];
  if(it.mid) rows.push(["mid", CONFIG.tierMid, `от ${CONFIG.tierMid} шт`, it.mid]);

/* ряд брендов на компьютере: стрелки, колесо мыши, перетаскивание */
(() => {
  const row = $("#brands"), prev = $(".bArrow.prev"), next = $(".bArrow.next");
  const upd = () => { const max = row.scrollWidth - row.clientWidth; prev.hidden = row.scrollLeft <= 4; next.hidden = row.scrollLeft >= max - 4; };
  const step = () => Math.max(200, row.clientWidth * 0.7);
  prev.onclick = () => row.scrollBy({ left: -step(), behavior: "smooth" });
  next.onclick = () => row.scrollBy({ left: step(), behavior: "smooth" });
  row.addEventListener("scroll", upd, { passive: true });
  addEventListener("resize", upd);
  new MutationObserver(upd).observe(row, { childList: true });
  row.addEventListener("wheel", e => {                 // обычное колесо мыши крутит ряд вбок
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX) || row.scrollWidth <= row.clientWidth) return;
    const max = row.scrollWidth - row.clientWidth;
    if((e.deltaY < 0 && row.scrollLeft <= 0) || (e.deltaY > 0 && row.scrollLeft >= max)) return;   // край ряда — дальше крутится страница
    e.preventDefault(); row.scrollLeft += e.deltaY;
  }, { passive: false });
  let down = null, moved = false;
  row.addEventListener("pointerdown", e => { if(e.pointerType !== "mouse" || e.button !== 0) return; down = { x: e.clientX, left: row.scrollLeft }; moved = false; });
  addEventListener("pointermove", e => {
    if(!down) return;
    const dx = e.clientX - down.x;
    if(!moved && Math.abs(dx) > 6){ moved = true; row.classList.add("drag"); }
    if(moved) row.scrollLeft = down.left - dx;
  });
  addEventListener("pointerup", () => { if(!down) return; down = null; setTimeout(() => row.classList.remove("drag"), 0); });
  row.addEventListener("click", e => { if(moved){ e.stopImmediatePropagation(); e.preventDefault(); moved = false; } }, true);   // после перетаскивания бренд не выбирается
  upd();
})();

    const p = e.touches[0]; if(e.touches.length !== 1){ ok = false; return; }
    sx = p.clientX; sy = p.clientY; t0 = Date.now();
    ok = !skip(e.target) && sx > 24;            // самый край экрана — жест «назад» браузера, его не трогаем
  }, { passive: true });
  addEventListener("touchend", e => {
    if(!ok) return; ok = false;
    const p = e.changedTouches[0], dx = p.clientX - sx, dy = p.clientY - sy;
    if(Date.now() - t0 > 700 || Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.5) return;   // только быстрый горизонтальный свайп
    const open = $("#catPanel").classList.contains("open");
    if(dx > 0 && !open && !$("#modal").classList.contains("open")) openCatalog();
    else if(dx < 0 && open) closeAll();
  }, { passive: true });
})();

function lines(){

}
function totals(ship){
  const ls = lines();
  const goods = ls.reduce((s,l) => s + l.price * l.q, 0);
  const s = CONFIG.shipping.find(x => x.id === ship);

  const dlv = RETAIL ? dlvPrice(ship, goods) : 0;          // розница: доставка по сетке цен (null — ещё не посчитана)
  return { ls, goods, loader, fee, dlv, total: goods + loader + fee + (dlv || 0), count: ls.reduce((s,l) => s + l.q, 0) };
}

/* ===== Розница: доставка как на WB — цена и срок по городу, пункт СДЭК, интервал курьера ===== */
const DLV = { city: "", opts: null, pvz: [], pvzFor: "", pvzErr: "", pvzSel: null, slotSel: null, t: 0, seq: 0 };
{ const f0 = load("amura-form", {}); DLV.pvzSel = f0.pvz || null; DLV.slotSel = f0.slot || null; }
function dlvPrice(ship, goods){
  if(!ship || ship === "pickup") return 0;
  const o = DLV.opts; if(!o) return null;
  let p = o.freeFrom && goods >= o.freeFrom ? 0 : ((o.tiers.find(t => goods < t[0]) || o.tiers[o.tiers.length - 1] || [0, 0])[1]);
  if(ship === "courier" && !o.almaty) p += o.doorExtra;          // СДЭК до двери — всегда с доплатой
  return p;
}
const dlvTxt = p => p === null ? "—" : p ? fmt(p) + " ₸" : "бесплатно";
async function loadDlv(city){
  const my = ++DLV.seq;
  if(!city){ DLV.opts = null; DLV.city = ""; dlvRefresh(); return; }
  if(DEMO){ DLV.opts = { almaty: /алмат/i.test(city), methods: [], slots: [], freeFrom: 20000, doorExtra: 1000, tiers: [[5000, 1500], [20000, 500]], hours: "" }; DLV.city = city; dlvRefresh(); return; }
  try{
    const goods = totals("pickup").goods;
    const j = await getJSON(`${CONFIG.apiUrl}/delivery/options?city=${encodeURIComponent(city)}&sum=${goods}`, 20000);
    if(my !== DLV.seq) return;
    DLV.opts = j; DLV.city = city;
    if(DLV.slotSel && !j.slots.some(s => s.date === DLV.slotSel.date && s.from === DLV.slotSel.from)) DLV.slotSel = null;
  }catch{ if(my === DLV.seq){ DLV.opts = null; } }
  dlvRefresh();
  const f = readFormSafe2(); if(f && f.ship === "cdek") loadPvz(city);
}
function readFormSafe2(){ return $("#fName") ? readForm() : null; }
function dlvRefresh(){

  document.querySelectorAll(".dlvs label").forEach(l => {
    const m = l.dataset.m, meth = o && o.methods.find(x => x.id === m);
    l.querySelector(".dlvp").textContent = m === "pickup" ? "бесплатно" : o ? dlvTxt(dlvPrice(m, goods)) : "";
    l.querySelector(".dlvn").textContent = meth ? meth.note : (m === "pickup" ? "Со склада в Алматы" : "Укажите город — посчитаем цену");

function setCartQty(it, v){
  const q = Math.max(0, Math.min(it.qty, Math.floor(Number(v) || 0)));

  if(q === 0) delete cart[it.id]; else cart[it.id] = q;

  save("amura-cart2", cart); renderCartCount(); refreshCard(it.id); readFormSafe(); renderCart();
}

    clientTotal: t.total,

    else{
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 120000);
      const busy = setTimeout(() => { btn.textContent = "Заказов много — ваш в очереди, не закрывайте страницу…"; }, 8000);
      let r;
      try{ r = await fetch(CONFIG.orderUrl, { method: "POST", headers: authHeaders(), body: JSON.stringify(payload), signal: ctl.signal }); }
      catch(e){ throw new Error(e.name === "AbortError" ? "Сервер долго отвечает — нажмите «Отправить заказ» ещё раз, дубль не создастся" : "Нет связи с сервером"); }
      finally{ clearTimeout(tm); clearTimeout(busy); }
      res = await r.json().catch(() => ({}));

    }

});
function normPhone(d){ if(d.length === 11 && d[0] === "8") d = "7" + d.slice(1); if(d.length === 10) d = "7" + d; return d; }
function showDone(res, f, t){
  $("#drawerTitle").textContent = "Заказ принят";
  const shipName = RETAIL ? dlvShipName(f) : (CONFIG.shipping.find(s => s.id === f.ship)?.name || "") + (f.logistics && !["kazpost", "courier", "pickup", "cdek"].includes(f.ship) ? " — " + f.logistics : "") + (f.ship === "kazpost" ? ` — ${f.recipient}, ${f.zip}, ${f.address}` : "") + (f.ship === "courier" || f.ship === "cdek" ? ` — ${f.address}` : "");
  // в WhatsApp — только данные заказа и итог; состав заказа — в PDF-накладной
  const text = `Здравствуйте! Мой заказ AMURA № ${res.number}\n${f.name}, ${f.city}, ${shipName}\n\nИтого: ${fmt(res.total || t.total)} ₸`;
  const wa = `https://wa.me/${CONFIG.managerWa}?text=${encodeURIComponent(text)}`;
  const tg = `https://t.me/${CONFIG.botUsername}?start=${encodeURIComponent(res.startToken || res.number)}`;
  $("#drawerBody").innerHTML = `<div class="done">

      ? `<p>Нажмите кнопку и «Старт» — бот сразу пришлёт PDF-накладную и реквизиты для оплаты.</p><a class="btn tg" href="${tg}" target="_blank" rel="noopener">Получить накладную в Telegram</a>`
      : `<p>Нажмите кнопку — выберите WhatsApp, и текст заказа вместе с PDF уйдёт менеджеру. В ответ он пришлёт реквизиты для оплаты.</p><button class="btn wa" id="waSend" type="button">Отправить в WhatsApp</button>`}
    ${res.pdfUrl ? `<button class="btn ghost" id="pdfShare" type="button">Скопировать / отправить PDF-накладную</button>` : (res.demo ? `<p class="kv">В демо-режиме PDF не создаётся.</p>` : "")}

      try{

    };
  }
}

/* ===== PDF-накладная как файл: «Поделиться» открывает меню телефона, где «Копировать» копирует сам документ, а не ссылку ===== */
const pdfCache = {};
function pdfFile(url, number){
  if(pdfCache[url]) return Promise.resolve(pdfCache[url]);
  return fetch(url).then(r => { if(!r.ok) throw new Error("pdf"); return r.blob(); }).then(b => (pdfCache[url] = new File([b], `AMURA-${number}.pdf`, { type: "application/pdf" })));
}
async function sharePdf(url, number, btn){
  const old = btn && btn.textContent;
  try{
    if(btn){ btn.disabled = true; btn.textContent = "Готовлю файл…"; }
    const f = await pdfFile(url, number);
    if(navigator.canShare && navigator.canShare({ files: [f] })){ await navigator.share({ files: [f], title: f.name }); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click();     // компьютер: файл просто скачивается
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast("PDF сохранён в загрузки");
  }catch(e){
    if(e && e.name === "AbortError") return;
    if(e && e.name === "NotAllowedError") toast("Нажмите ещё раз — файл уже готов");     // iPhone просит нажатие сразу после загрузки
    else window.open(url, "_blank", "noopener");
  }finally{ if(btn){ btn.disabled = false; btn.textContent = old; } }
}

function authHeaders(){ const h = { "Content-Type": "application/json" }; if(AUTH.token) h.Authorization = "Bearer " + AUTH.token; return h; }
function setAuth(token, profile){

/* демо-кабинет для превью */
function demoApi(path, opts){
  if(path.startsWith("/auth/tg/start")) return Promise.resolve({ ok: true, nonce: "demo" });

<script>
/* Чат с менеджером: сообщения приходят в панель → «Сообщения» (канал «Сайт»), отвечает ИИ или менеджер.
   Только оптовый сайт — на розничном (window.AMURA_RETAIL) чата нет. */
(function(){
  if(window.AMURA_RETAIL) return;
  const API = CONFIG.apiUrl, K = "amura-chat";
  const st = (() => { try{ return JSON.parse(localStorage.getItem(K) || "{}"); }catch{ return {}; } })();
  const keep = () => { try{ localStorage.setItem(K, JSON.stringify(st)); }catch{} };
  let msgs = [], open = false, timer = 0, sending = false;
  const btn = document.createElement("button");
  btn.className = "cbtn"; btn.type = "button"; btn.setAttribute("aria-label", "Чат с менеджером");
  btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><i hidden>0</i>';
  document.body.appendChild(btn);
  const box = document.createElement("section");
  box.className = "cbox"; box.hidden = true; box.setAttribute("aria-label", "Чат с менеджером");
  box.innerHTML = `<header><b>Чат с AMURA<small>Ответим здесь, обычно за несколько минут</small></b><button type="button" class="ccl" aria-label="Закрыть">✕</button></header>
    <div class="cmsgs" id="cmsgs"></div><div class="cerr" id="cerr" hidden></div>
    <div class="cme" id="cme"><input id="cName" placeholder="Ваше имя" autocomplete="name"><input id="cPhone" type="tel" inputmode="tel" placeholder="Телефон (необяз.)" autocomplete="tel"></div>
    <form class="cin" id="cform"><button type="button" class="cat" id="cat" aria-label="Прикрепить фото или PDF">📎</button><input type="file" id="cfile" accept="image/*,application/pdf" hidden>
    <textarea id="ctext" rows="1" placeholder="Сообщение…"></textarea><button class="csd" type="submit">Отправить</button></form>`;
  document.body.appendChild(box);
  const $c = id => box.querySelector("#" + id);
  if(st.name) $c("cName").value = st.name;
  if(st.phone) $c("cPhone").value = st.phone;
  const tm = t => new Date(t * 1000).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
  function draw(){
    const el = $c("cmsgs"), atEnd = el.scrollHeight - el.scrollTop - el.clientHeight < 60;
    el.innerHTML = (msgs.length ? "" : '<div class="chint">Здравствуйте! Задайте вопрос о товаре, заказе или оптовых ценах — ответим в этом окне.</div>') +
      msgs.map(m => `<div class="cm ${m.me ? "me" : ""}">${m.photo ? `<a href="${esc(m.photo)}" target="_blank" rel="noopener"><img src="${esc(m.photo)}" alt="Фото" loading="lazy"></a>` : ""}${m.file ? `<a href="${esc(m.file.url)}" target="_blank" rel="noopener">📄 ${esc(m.file.name)}</a>${m.text ? "\n" : ""}` : ""}${esc(m.text)}<small>${m.at ? tm(m.at) : "отправляется…"}</small></div>`).join("");
    if(atEnd || !el.dataset.seen){ el.scrollTop = el.scrollHeight; el.dataset.seen = 1; }

  }
  function badge(){

    i.hidden = !n; i.textContent = n;
  }
  async function poll(){
    if(!st.token) return;
    try{
      const r = await fetch(`${API}/chat/poll?token=${encodeURIComponent(st.token)}&after=${msgs.length ? msgs[msgs.length - 1].id || 0 : 0}`);
      if(r.status === 403){ delete st.token; keep(); return; }
      const j = await r.json();
      if(j.ok && j.messages.length){
        msgs = msgs.filter(m => m.id).concat(j.messages);
        if(open){ st.seen = msgs[msgs.length - 1].id; keep(); }
        draw(); badge();
      }
    }catch{}

  function show(v){
    open = v; box.hidden = !v; btn.hidden = v;
    if(v){ if(msgs.length){ st.seen = msgs[msgs.length - 1].id || st.seen; keep(); } draw(); badge(); poll(); setTimeout(() => $c("ctext").focus(), 50); }
    schedule();
  }

  box.querySelector(".ccl").onclick = () => show(false);

  $c("ctext").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); $c("cform").requestSubmit(); } });

      msgs.push({ me: true, text: file ? (text || "") + (file.type === "application/pdf" ? "\n📄 " + file.name : "\n📷 Фото") : text, at: 0 }); draw();
      let r;
      if(file){
        const fd = new FormData(); fd.append("token", st.token); fd.append("text", text); fd.append("name", st.name); fd.append("phone", st.phone); fd.append("file", file);
        r = await fetch(API + "/chat/send", { method: "POST", body: fd });
      } else {
        r = await fetch(API + "/chat/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: st.token, text, name: st.name, phone: st.phone }) });
      }
      const j = await r.json().catch(() => ({}));
      if(!r.ok || !j.ok) throw new Error(j.error || "Не отправлено, попробуйте ещё раз");
      st.sent = 1; keep(); setTimeout(poll, 600); setTimeout(poll, 2500);
    }catch(e){
      msgs = msgs.filter(m => m.id); draw();

    }finally{ sending = false; }
  }
  $c("cform").onsubmit = e => { e.preventDefault(); const t = $c("ctext").value.trim(); if(!t) return; $c("ctext").value = ""; send(t); };
  $c("cfile").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if(f) send($c("ctext").value.trim(), f), $c("ctext").value = ""; };
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") poll(); });
  if(st.token){ poll(); schedule(); }
})();

function seenTracks(tracks, notify){
  let seen = {}; try{ seen = JSON.parse(localStorage.getItem(TRK) || "{}"); }catch{}

  Object.entries(tracks).forEach(([n, tr]) => {
    if(seen[n] !== tr.code){ if(notify && seen[n] !== undefined){ toast(`Заказ № ${n}: ${tr.label}`); changed = true; } seen[n] = tr.code; }

/* пока есть заказ в пути — раз в 1,5 минуты спрашиваем сервер; новый статус — всплывающее сообщение и точка на «Я» */
async function trackPoll(){
  if(!AUTH.token || document.visibilityState !== "visible") return;
  let seen = {}; try{ seen = JSON.parse(localStorage.getItem(TRK) || "{}"); }catch{}
  const active = Object.values(seen).some(c => !/deliver|return|cancel|fail/.test(c));
  if(!active && TRACK_ORDERS === null && trackPoll.done) return;
  trackPoll.done = true;
  try{

    const tr = j.tracks || {};
    if(seenTracks(tr, true)){
      if(VIEW === "me" && TRACK_ORDERS){ TRACK_ORDERS.forEach(o => { if(tr[o.number]) o.track = tr[o.number]; }); trackPaint(TRACK_ORDERS); }
      else meDot(true);
    }
  }catch{}
}

  return `<div class="rv-h"><h4>Отзывы</h4>${j.count ? `<span>${STAR(Math.round(j.avg))} <b>${String(j.avg).replace(".", ",")}</b> · ${fmt(j.count)} ${plur(j.count)}</span>` : ""}</div>
    ${j.items.length ? j.items.map(r => `<div class="rv-i">
      <div class="rv-t">${STAR(r.rating)}<span class="kv">${esc(r.date)}</span></div>
      <div class="rv-n">${esc(r.name)}${r.city ? `, ${esc(r.city)}` : ""}${r.verified ? ' <em>купил на сайте</em>' : ""}</div>
      ${r.text ? `<p>${esc(r.text)}</p>` : ""}
      ${r.answer ? `<div class="rv-a"><b>Ответ AMURA:</b> ${esc(r.answer)}</div>` : ""}</div>`).join("")
      : `<p class="kv">Отзывов пока нет — будьте первым.</p>`}
    ${mine && mine.status === "new" ? `<p class="kv">Ваш отзыв на проверке — скоро появится.</p>` : ""}
    <button type="button" class="btn ghost" data-rvw>${!AUTH.token ? "Войти и оставить отзыв" : mine ? "Изменить мой отзыв" : "Оставить отзыв"}</button>
    <div id="rvForm"></div>`;
}
function formHTML(mine){
  const r = mine ? mine.rating : 0;
  return `<div class="rv-f"><div class="rv-pick" role="radiogroup" aria-label="Оценка">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-rvs="${n}" class="${n <= r ? "on" : ""}" aria-label="${n} из 5">★</button>`).join("")}</div>
    <textarea id="rvText" rows="4" maxlength="2000" placeholder="Что понравилось, что нет, как подошло">${esc(mine ? mine.text : "")}</textarea>
    <div class="err" id="rvErr"></div><button type="button" class="btn" data-rvsend>Отправить отзыв</button></div>`;
}
async function loadBox(it){
  const box = $("#rvBox"); if(!box) return;
  try{
    const r = await fetch(`${CONFIG.apiUrl}/reviews?id=${encodeURIComponent(it.id)}`, { headers: authHeaders() });
    const j = await r.json();
    if($("#sheet").dataset.id !== it.id) return;
    if(j.on === false){ ON = false; box.remove(); return; }
    box.innerHTML = boxHTML(j, it); box.dataset.mine = JSON.stringify(j.mine || null);
  }catch{ box.innerHTML = `<p class="kv">Отзывы сейчас не загрузились.</p>`; }
}
const _open = openProduct;
openProduct = function(it){
  _open(it);
  if(!ON || DEMO) return;
  const info = $("#sheet .info"); if(!info) return;
  info.insertAdjacentHTML("beforeend", `<div class="rv-box" id="rvBox"><p class="kv">Загружаем отзывы…</p></div>`);
  loadBox(it);
};
$("#sheet").addEventListener("click", async e => {
  const box = $("#rvBox"); if(!box || !box.contains(e.target)) return;
  const it = byId($("#sheet").dataset.id); if(!it) return;
  if(e.target.closest("[data-rvw]")){
    if(!AUTH.token){ closeAll(); toast("Войдите — и сможете оставить отзыв"); return go("me"); }
    $("#rvForm").innerHTML = formHTML(JSON.parse(box.dataset.mine || "null")); e.target.closest("[data-rvw]").hidden = true; return;
  }
  const st = e.target.closest("[data-rvs]");
  if(st){ const n = +st.dataset.rvs; box.querySelectorAll("[data-rvs]").forEach(b => b.classList.toggle("on", +b.dataset.rvs <= n)); box.dataset.rate = n; return; }
  if(e.target.closest("[data-rvsend]")){
    const btn = e.target.closest("[data-rvsend]"), err = $("#rvErr");
    const rating = +(box.dataset.rate || box.querySelectorAll("[data-rvs].on").length), text = $("#rvText").value.trim();
    if(!rating){ err.textContent = "Поставьте оценку — нажмите на звёзды"; return; }
    btn.disabled = true; btn.textContent = "Отправляем…";
    try{
      const r = await fetch(`${CONFIG.apiUrl}/reviews`, { method: "POST", headers: authHeaders(), body: JSON.stringify({ id: it.id, rating, text }) });
      const j = await r.json().catch(() => ({}));
      if(r.status === 401){ closeAll(); toast("Войдите заново"); return go("me"); }
      if(!r.ok || !j.ok) throw new Error(j.error || "Не получилось отправить");
      toast(j.status === "new" ? "Спасибо! Отзыв появится после проверки" : "Спасибо за отзыв!");
      loadBox(it); loadSummary();
    }catch(ex){ err.textContent = ex.message; btn.disabled = false; btn.textContent = "Отправить отзыв"; }
  }
});
loadSummary();
})();
/* ===== Розница: свои баннеры (панель → Товары → Баннеры → «Розничный сайт») ===== */
// Высота карусели (size: s/m/l) и отдельная картинка для телефона (imgM) — только здесь, оптовый сайт их не знает.
const RBANNERS_DEFAULT = { autoplaySec: 6, size: "m", slides: [
  { title: "Корейская косметика с доставкой", text: "Оригинальный уход со склада в Алматы. Доставка по городу и по всему Казахстану.", tags: ["Оригинал", "Доставка по Казахстану"], bg: "#14503C" },
  { title: "Новинки недели", text: "Свежие поступления — смотрите первыми.", button: "Смотреть новинки", link: { sort: "new" }, bg: "#1E3A5F" }
] };
(function(){
  const base = renderBanners;
  renderBanners = function(cfg){
    base(cfg);
    const box = $("#banners");
    box.dataset.size = ["s", "m", "l"].includes(cfg.size) ? cfg.size : "m";
    const mob = {};
    (cfg.slides || []).forEach(b => { if(b.img && b.imgM) mob[b.img] = b.imgM; });
    box.querySelectorAll(".bSlide.pic img").forEach(img => {
      const m = mob[img.getAttribute("src")];
      if(!m) return;
      const pic = document.createElement("picture"), src = document.createElement("source");
      src.media = "(max-width:640px)"; src.srcset = m;
      img.replaceWith(pic); pic.append(src, img);
      img.closest(".bSlide").classList.add("hasM");
    });
  };
  renderBanners(RBANNERS_DEFAULT);
  getJSON(CONFIG.apiUrl + "/banners?site=retail", 8000).then(c => renderBanners(c)).catch(() => {});
})();
/* Розничный сайт: товар открывается отдельной страницей (как на WB), со своей ссылкой amura.kz/shop/#p/<id>.
   Кнопка «Назад» телефона/браузера возвращает в каталог на то же место; ссылкой можно поделиться.
   Внутри — то же окно товара (#sheet): цены, корзина, описание, отзывы работают как раньше. Только розница. */
(function(){
if(!window.AMURA_RETAIL) return;
const PH = "#p/", TITLE = document.title;
const CART_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg>';
const SHARE_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5"/><path d="M5 13v6h14v-6"/></svg>';
const isPage = () => document.body.classList.contains("rpage");
const cartN = () => Object.values(cart).reduce((s, q) => s + q, 0);

function rateLine(id){
  const r = (window.RV_SUM || {})[id]; if(!r || !r[1]) return "";
  const n = r[1], m = n % 10, h = n % 100, w = m === 1 && h !== 11 ? "оценка" : m >= 2 && m <= 4 && (h < 10 || h >= 20) ? "оценки" : "оценок";
  return `<button type="button" class="rp-rate" data-rprate><b>★ ${String(r[0]).replace(".", ",")}</b> · ${fmt(n)} ${w}</button>`;
}

const _open = openProduct;
openProduct = function(it, fromHistory){
  _open(it);
  const sh = $("#sheet"), n = cartN();
  document.body.classList.add("rpage"); $("#scrim").classList.remove("open");
  sh.insertAdjacentHTML("afterbegin", `<div class="rp-bar">
    <button type="button" class="rp-back" data-rpback aria-label="Назад"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
    <span class="rp-t">${esc(it.brand || "Товар")}</span>
    <button type="button" class="rp-ic" data-rpshare aria-label="Поделиться">${SHARE_SVG}</button>
    <button type="button" class="rp-ic" data-rpcart aria-label="Корзина">${CART_SVG}<em id="rpCnt" ${n ? "" : "hidden"}>${n}</em></button></div>`);
  const h3 = sh.querySelector(".info h3"); if(h3) h3.insertAdjacentHTML("afterend", rateLine(it.id));
  sh.scrollTop = 0;
  const act = sh.querySelector(".act"); if(act) sh.style.setProperty("--rpact", act.offsetHeight + "px");   // телефон: место под закреплённой кнопкой покупки
  document.title = it.name + " — AMURA";
  const h = PH + encodeURIComponent(it.id);
  if(!fromHistory && location.hash !== h){
    try{ if(location.hash.startsWith(PH)) history.replaceState({ rp: 1 }, "", h); else history.pushState({ rp: 1 }, "", h); }catch{}
  }
};

const _close = closeAll;
closeAll = function(){
  const was = isPage();
  _close();
  if(!was) return;
  document.body.classList.remove("rpage"); document.title = TITLE;
  if(location.hash.startsWith(PH)) try{ history.replaceState(null, "", location.pathname); }catch{}
};

const _cnt = renderCartCount;
renderCartCount = function(){ _cnt(); const c = $("#rpCnt"); if(c){ const n = cartN(); c.textContent = n; c.hidden = !n; } };

$("#sheet").addEventListener("click", e => {
  if(!isPage()) return;
  if(e.target.closest("[data-rpback]")){
    if(history.state && history.state.rp) history.back(); else closeAll();
    return;
  }
  if(e.target.closest("[data-rpcart]")) return go("cart");
  if(e.target.closest("[data-rprate]")){ const b = $("#rvBox"); if(b) b.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if(e.target.closest("[data-rpshare]")){
    const url = location.href, title = document.title;
    if(navigator.share) navigator.share({ title, url }).catch(() => {});
    else if(navigator.clipboard) navigator.clipboard.writeText(url).then(() => toast("Ссылка скопирована"), () => {});
  }
});

addEventListener("popstate", () => {
  const h = location.hash;
  if(h.startsWith(PH)){ const it = byId(decodeURIComponent(h.slice(PH.length))); if(it) openProduct(it, true); }
  else if(isPage()) closeAll();
});

// открыли ссылку на товар: каталог грузится асинхронно — ждём товар, под ним в истории оставляем каталог (назад — в каталог)
if(location.hash.startsWith(PH)){
  const id = decodeURIComponent(location.hash.slice(PH.length)), t0 = Date.now();
  try{ history.replaceState(null, "", location.pathname); }catch{}
  const tick = setInterval(() => {
    const it = byId(id);
    if(it){ clearInterval(tick); openProduct(it); }
    else if(Date.now() - t0 > 20000) clearInterval(tick);
  }, 200);
}
})();
</script>
</body>
</html>
