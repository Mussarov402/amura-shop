<!doctype html>
<html lang="ru">
<head>
<!-- Собрано из index.html скриптом make_shop.py — не редактировать вручную -->
<script>window.AMURA_RETAIL = true;</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AMURA — корейская косметика</title>
<meta name="description" content="Оригинальная корейская косметика с доставкой по Алматы и Казахстану.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://amura-shop-api.onrender.com" crossorigin>
<link rel="manifest" href="/shop/manifest.webmanifest">
<meta name="theme-color" content="#0E3B2C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AMURA">
<link rel="apple-touch-icon" href="/icon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0E3B2C; --green-2:#15503C; --green-3:#1F6A50;
  --mint:#E4EDE8; --brass:#B89760;
  --bg:#F5F6F4; --surface:#FFFFFF; --ink:#16201B; --muted:#5F6B65; --line:#DDE3DF;
  --danger:#A23B2A; --warn-bg:#F6EEDC; --warn-fg:#6B4F1D;
  --radius-lg:22px; --radius:14px;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --green:#1B5E45; --green-2:#227152; --green-3:#5FC49A; --mint:#1C2A24; --brass:#CDB07E;
    --bg:#0F1512; --surface:#17201C; --ink:#E9EFEB; --muted:#9AA8A1; --line:#28342E; --danger:#E0816F; color-scheme:dark; --warn-bg:#3A301C; --warn-fg:#EBD3A0;
  }
}
:root[data-theme="dark"]{
  --green:#1B5E45; --green-2:#227152; --green-3:#5FC49A; --mint:#1C2A24; --brass:#CDB07E;
  --bg:#0F1512; --surface:#17201C; --ink:#E9EFEB; --muted:#9AA8A1; --line:#28342E; --danger:#E0816F; color-scheme:dark; --warn-bg:#3A301C; --warn-fg:#EBD3A0;
}
html,body{overscroll-behavior:none}   /* iPhone: без «резинки» страницы — иначе вместе с ней едут шапка и нижняя панель */
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:hidden}body{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:0 16px}

body::before{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);background:#0E3B2C;z-index:19;pointer-events:none}
header.top{position:sticky;top:0;z-index:20;background:#0E3B2C;color:#F2F5F3;padding-top:env(safe-area-inset-top,0px)}
.bar{display:flex;align-items:center;gap:14px;padding:12px 0}
.logo{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.02em;white-space:nowrap;color:#fff;text-decoration:none}
.logo small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:0;color:#A9C3B7;margin-top:-2px}
.search{flex:1;display:flex;background:#fff;border-radius:12px;overflow:hidden;min-width:0}
.search input{flex:1;min-width:0;border:0;padding:11px 14px;font-size:15px;color:#16201B;background:transparent}
.search input:focus{outline:none}
.count{background:var(--brass);color:#1b1408;border-radius:99px;font-size:12px;font-weight:800;min-width:20px;height:20px;display:inline-grid;place-items:center;padding:0 6px}
.brandsBar{background:#0E3B2C}
.brands{display:flex;gap:6px;overflow-x:auto;padding:0 0 12px;scrollbar-width:none}
.brands::-webkit-scrollbar{display:none}
/* как на WB: стрелки по краям, затухание у края, колесо и перетаскивание мышью (только компьютер) */
.brandsRow{position:relative}
.bArrow{position:absolute;top:0;bottom:12px;z-index:2;width:56px;border:0;display:flex;align-items:center;padding:0;color:#fff;cursor:pointer}
.bArrow svg{width:34px;height:34px;padding:7px;border-radius:50%;background:#fff;fill:none;stroke:#0E3B2C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.bArrow:hover svg{background:#E4EFE9}
.bArrow.prev{left:-4px;justify-content:flex-start;background:linear-gradient(90deg,#0E3B2C 55%,rgba(14,59,44,0))}
.bArrow.next{right:-4px;justify-content:flex-end;background:linear-gradient(270deg,#0E3B2C 55%,rgba(14,59,44,0))}
.bArrow[hidden]{display:none}
.brands.drag{cursor:grabbing;user-select:none}
.brands.drag .chip{pointer-events:none}
@media (pointer:coarse){.bArrow{display:none !important}}
.chip{flex:none;border:1px solid #2E6A54;background:transparent;color:#DCE7E1;border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:#fff;color:#0E3B2C;border-color:#fff}

.hero{background:linear-gradient(180deg,#0E3B2C 0%,#0E3B2C 55%,var(--bg) 55%);padding:6px 0 0}
.bSlide h1{font-family:var(--display);font-weight:500;font-size:clamp(24px,4vw,40px);line-height:1.1;margin:0 0 10px;max-width:18ch;position:relative;z-index:1}
.bSlide p{margin:0;color:rgba(255,255,255,.82);max-width:46ch;position:relative;z-index:1}
.tiers-legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative;z-index:1}
.tiers-legend span{background:rgba(255,255,255,.1);border:1px solid rgba(205,176,126,.4);border-radius:99px;padding:4px 12px;font-size:13px;font-weight:600;color:#F1E6D2}
/* карусель баннеров (как на WB/Ozon/Kaspi): слайды из banners.json — текст на цвете или картинка */
.banners{position:relative;border-radius:var(--radius-lg);overflow:hidden}
.bTrack{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;scroll-behavior:smooth}
.bTrack::-webkit-scrollbar{display:none}
.bSlide{flex:0 0 100%;scroll-snap-align:start;position:relative;min-height:210px;color:#fff;padding:30px 32px 40px;display:flex;flex-direction:column;justify-content:center;text-decoration:none;overflow:hidden;cursor:default}
.bSlide[data-link]{cursor:pointer}
.bSlide::after{content:"";position:absolute;right:-80px;top:-120px;width:360px;height:360px;border-radius:50%;border:1px solid rgba(255,255,255,.18);box-shadow:0 0 0 40px rgba(255,255,255,.04),0 0 0 90px rgba(255,255,255,.03);pointer-events:none}
.bSlide.pic{padding:0;min-height:0;aspect-ratio:4/1}
.bSlide.pic::after{display:none}
.bSlide.pic img{width:100%;height:100%;object-fit:cover;display:block}
.bSlide .bBtn{align-self:flex-start;margin-top:16px;background:#fff;color:#0E3B2C;border-radius:10px;padding:9px 16px;font-weight:700;font-size:14px;position:relative;z-index:1}
.bNav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;border:0;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25);opacity:0;transition:opacity .2s}
.banners:hover .bNav{opacity:1}
.bNav svg{width:20px;height:20px;fill:none;stroke:#0E3B2C;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bNav.prev{left:12px}.bNav.next{right:12px}
.bDots{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:center;gap:6px;z-index:2}
.bDots button{width:8px;height:8px;border-radius:99px;border:0;padding:0;background:rgba(255,255,255,.45);transition:width .2s}
.bDots button[aria-current="true"]{width:22px;background:#fff}
.banners.one .bNav,.banners.one .bDots{display:none}
@media (pointer:coarse){.bNav{display:none}}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:24px 0 14px}
.toolbar h2{font-family:var(--display);font-weight:500;font-size:21px;margin:0}
.meta{color:var(--muted);font-size:13px}
select{font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:22px 16px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px}
.thumb{aspect-ratio:3/4;border-radius:10px;background:#fff;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:0;border:0;position:relative}
.thumb img{width:100%;height:100%;object-fit:contain}   /* фото товара — 3:4, как на WB (900×1200) */
.ph{font-family:var(--display);font-size:30px;color:#C9D3CE}
/* «Избранное»: сердечко на карточке и в карточке товара */
.fav{position:absolute;top:16px;right:16px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 1px 6px rgba(0,0,0,.12);cursor:pointer;padding:0}
.fav svg{width:21px;height:21px;fill:none;stroke:#5F6B66;stroke-width:1.8;stroke-linejoin:round;transition:transform .15s}
.fav:hover svg{stroke:#D6336C}
.fav[aria-pressed="true"] svg{fill:#E0245E;stroke:#E0245E}
.fav:active svg{transform:scale(.85)}
.sheet .fav{top:14px;right:auto;left:14px}
.tag{position:absolute;left:8px;top:8px;background:var(--green);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px}
.brand{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.name{font-size:14px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em;background:none;border:0;padding:0;text-align:left;font-weight:600}
.stock{font-size:12px;color:var(--green-3);font-weight:700}
.price-now{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 6px;margin-top:2px}
.price-now b{font-size:21px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.price-now small{color:var(--muted);font-size:12px;font-weight:600}
.act{display:grid;gap:6px;margin-top:auto}
.tiers{display:grid;gap:5px}
.tiers button{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-size:13px;color:var(--muted);text-align:left}
.tiers button b{color:var(--ink);font-weight:800;white-space:nowrap}
.tiers button:hover:not(:disabled){border-color:var(--green-3)}
.tiers button.on{border-color:var(--green-3);background:var(--mint);color:var(--green-3);font-weight:700}
.tiers button.on b{color:var(--green-3)}
.tiers button:disabled{opacity:.45;cursor:not-allowed}
.buy{display:grid;gap:8px;padding-top:2px}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--mint);border-radius:12px}
.stepper button{border:0;background:transparent;width:42px;height:40px;font-size:20px;font-weight:700;color:var(--green-3)}
.stepper input{width:56px;min-width:0;flex:1;text-align:center;border:0;background:transparent;font-weight:800;font-size:16px;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.add{border:0;background:var(--green);color:#fff;font-weight:700;border-radius:12px;padding:11px;width:100%}
.add:hover{background:var(--green-2)}
.add.in{background:var(--mint);color:var(--green-3)}
.skel{background:linear-gradient(90deg,var(--line) 0%,var(--mint) 50%,var(--line) 100%);background-size:200% 100%;animation:sh 1.2s infinite linear;border-radius:8px}
.thumb.skel{border-radius:10px}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){.skel{animation:none}}
.hint{font-size:12px;color:var(--brass);font-weight:700;min-height:1.2em}

.notice{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px;text-align:center;margin:22px 0}
.notice h3{font-family:var(--display);font-weight:500;margin:0 0 8px}
.notice p{color:var(--muted);margin:0 auto;max-width:52ch}
.btn{border:0;background:var(--green);color:#fff;font-weight:700;border-radius:12px;padding:13px 20px;text-align:center;text-decoration:none;display:block;width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.tg{background:#229ED9}
.btn.wa{background:#1FA855}
.btn:disabled{opacity:.6;cursor:wait}
.more{display:block;margin:28px auto 56px;border:1.5px solid var(--green);color:var(--green-3);background:transparent;font-weight:700;border-radius:12px;padding:12px 28px}

/* кнопка «Каталог» и боковая панель брендов — как на WB */
.catBtn{flex:none;display:flex;align-items:center;gap:8px;border:0;background:#1F5A44;color:#fff;font-weight:700;font-size:15px;padding:10px 16px;border-radius:12px}
.catBtn:hover{background:#26694F}
.catBtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.brk{display:none}
.catPanel{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(360px,86vw);background:var(--surface);color:var(--ink);transform:translateX(-102%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s;display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(0,0,0,.25)}
.catPanel.open{transform:none;visibility:visible;transition:transform .22s ease}
.catHead{display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 12px;border-bottom:1px solid var(--line)}
.catHead b{font-family:var(--display);font-size:20px}
.catHead button{border:0;background:var(--bg);width:38px;height:38px;border-radius:10px;font-size:18px;color:var(--ink)}
.catList{overflow-y:auto;padding:8px;flex:1}
.catList button{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;color:var(--ink);text-align:left;padding:11px 12px;border-radius:10px;font-size:15px}
.catList button:hover,.catList button[aria-current="true"]{background:var(--mint)}
.catList button[aria-current="true"]{font-weight:700;color:var(--green-3)}
.catList small{color:var(--muted);font-size:12.5px;margin-left:10px}
.back{border:0;background:transparent;color:var(--green-3);font-weight:700;font-size:15px;padding:6px 0;margin:0 0 4px;cursor:pointer}
.back:hover{text-decoration:underline}
.scrim{position:fixed;inset:0;background:rgba(8,20,15,.5);z-index:40;display:none}
.scrim.open{display:block}
.narrow{max-width:560px}
.page{padding-block:18px 8px}
.page-h{font-family:var(--display);font-weight:500;font-size:22px;margin:4px 0 8px}
body{padding-bottom:calc(84px + max(8px,calc(env(safe-area-inset-bottom,0px) - 12px)))}
body:not([data-view="home"]) .brandsBar{display:none}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:#173A2A;border-radius:22px 22px 0 0;padding:10px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(8,25,18,.22);-webkit-transform:translateZ(0);transform:translateZ(0);will-change:transform}
/* компьютер: как в маркетплейсах — «Корзина» и «Кабинет» в шапке, нижней панели нет */
.topnav{display:none;margin-left:auto;gap:4px}
.topnav button{border:0;background:transparent;color:#DCE7E1;display:grid;justify-items:center;gap:2px;font-weight:600;font-size:12.5px;padding:4px 12px;border-radius:10px}
.topnav button:hover{background:#14503C;color:#fff}
.topnav button[aria-current="page"]{color:#fff}
.topnav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.topnav .ic{position:relative;display:grid}
.topnav .count{position:absolute;right:-12px;top:-6px}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:5px;color:rgba(233,241,236,.55);font-weight:700;font-size:13px;padding:4px 0}
.tabbar button[aria-current="page"]{color:#fff}
.tabbar svg{width:27px;height:27px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabbar .ic{position:relative;display:grid}
.tabbar .count{position:absolute;right:-12px;top:-6px}
/* нижняя панель: плавающее «жидкое стекло» (как в iOS), отрезана от низа экрана; под активной вкладкой скользит капсула */
.tabbar{--nbb:max(8px,calc(env(safe-area-inset-bottom,0px) - 12px));--nb-bg:linear-gradient(180deg,#17553F,#0C3526);--nb-rim:rgba(255,255,255,.14);--nb-ink:rgba(236,243,239,.78);--nb-on:#F3D68F;--nb-cap:rgba(255,255,255,.14);--cl:0px;--cw:0px;--lo:0;
 left:12px;right:12px;bottom:var(--nbb);border-radius:999px;padding:6px;background:var(--nb-bg);-webkit-backdrop-filter:blur(22px) saturate(1.8);backdrop-filter:blur(22px) saturate(1.8);border:1px solid var(--nb-rim);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 32px rgba(4,20,14,.38),0 2px 8px rgba(4,20,14,.2)}
.tabbar::before{content:"";position:absolute;top:6px;bottom:6px;left:0;width:var(--cw);border-radius:999px;background:var(--nb-cap);box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);transform:translateX(var(--cl));opacity:var(--lo);pointer-events:none;transition:transform .5s cubic-bezier(.3,1.25,.5,1),width .35s cubic-bezier(.3,1.25,.5,1),opacity .3s}
.tabbar.nt::before{transition:none}
.tabbar,.tabbar button{-webkit-tap-highlight-color:transparent}
.tabbar button{position:relative;outline:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;color:var(--nb-ink);font-size:10.5px;gap:3px;padding:7px 0 6px;transition:color .3s}
.tabbar button[aria-current="page"],.tabbar button.on{color:var(--nb-on)}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"] svg,.tabbar button.on svg{stroke-width:2.1}
.count[hidden]{display:none}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;background:var(--mint);color:var(--green-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:grid;gap:10px}
.panel h4{margin:0;font-size:16px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.warn{background:var(--warn-bg);color:var(--warn-fg);border-radius:12px;padding:12px 14px;font-size:14px}
.order{display:grid;gap:8px}
.order .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.order .top b{font-size:15px}
.order .row{display:flex;gap:8px}
.order .row .btn{padding:10px}
.order details{font-size:13px;color:var(--muted)}
.order summary{cursor:pointer;font-weight:600}
.order li{margin:3px 0}
.list{display:grid;gap:12px;margin-top:12px}
.x{border:0;background:var(--mint);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.line{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:13px 0;border-bottom:1px solid var(--line)}
.line .n{font-size:14px;font-weight:600}
.line .p{font-weight:800;text-align:right;white-space:nowrap}
.line .stepper{width:140px}
.line .stepper button{height:34px;width:38px}
.kv{font-size:12.5px;color:var(--muted)}
.sum{display:grid;gap:6px;padding:14px 0;font-size:14px}
.sum div{display:flex;justify-content:space-between;gap:10px}
.sum .total{font-size:18px;font-weight:800;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
form.co{display:grid;gap:12px;padding-top:6px}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}
.field input,.field select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ship{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ship label{position:relative;display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font-size:14px;font-weight:700;line-height:1.2;cursor:pointer;background:var(--bg);color:var(--ink);min-width:0;word-break:break-word}
.field .ship input{position:absolute;opacity:0;width:1px;height:1px;margin:0;padding:0;pointer-events:none}
.ship label.on,.ship label:has(input:checked){border-color:var(--green);background:var(--green);color:#fff}
.ship label:has(input:focus-visible){outline:2px solid var(--brass);outline-offset:2px}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em}
.done{display:grid;gap:12px;padding-top:12px}
.done h3{font-family:var(--display);font-weight:500;font-size:22px;margin:4px 0 0}
.done p{margin:0;color:var(--muted)}

.modal{position:fixed;inset:0;z-index:42;display:none;place-items:center;padding:16px}
.modal.open{display:grid}
.sheet{background:var(--surface);border-radius:var(--radius-lg);max-width:880px;width:100%;max-height:calc(100% - 16px);overflow:auto;display:grid;grid-template-columns:1fr 1fr;position:relative}
.sheet .pic{position:relative;background:#fff;display:grid;place-items:center;min-height:300px;border-radius:var(--radius-lg) 0 0 var(--radius-lg)}
.sheet .pic img{max-height:460px;object-fit:contain;padding:22px}
.sheet .info{padding:26px;display:flex;flex-direction:column;gap:10px}
.sheet .info h3{font-family:var(--display);font-weight:500;font-size:21px;line-height:1.25;margin:0}
.sheet .desc{color:var(--ink);font-size:14px;line-height:1.6;white-space:pre-line}
.sheet .desc.clip{max-height:9.6em;overflow:hidden;-webkit-mask-image:linear-gradient(#000 60%,transparent)}
.more-link{border:0;background:none;padding:0;color:var(--green-3);font-weight:700;font-size:14px;justify-self:start}
.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 0;font-weight:800}
.specs{border-collapse:collapse;width:100%;font-size:14px}
.specs th{text-align:left;font-weight:600;color:var(--muted);padding:7px 12px 7px 0;width:40%;vertical-align:top;border-bottom:1px solid var(--line)}
.specs td{padding:7px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;word-break:break-word}
.sheet>.x{position:absolute;right:12px;top:12px;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(92px + max(8px,calc(env(safe-area-inset-bottom,0px) - 12px)));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;z-index:60;display:none;max-width:calc(100% - 32px);text-align:center}
.demo{background:var(--brass);color:#1b1408;text-align:center;font-size:13px;font-weight:700;padding:6px 16px}

@media (max-width:760px), (pointer:coarse) and (max-height:500px){
  /* мобильная версия: узкий экран или телефон, повёрнутый горизонтально.
     как в маркетплейсах: логотип уезжает вверх, поиск остаётся прижатым к верху */
  header.top{top:calc(6px - var(--hide, 0px))}
  .bar{flex-wrap:wrap;gap:10px}
  .logo{order:1}
  .brk{display:block;order:2;flex-basis:100%;height:0}
  .catBtn{order:3;padding:10px 12px}
  .catBtn span{display:none}
  .search{order:4;flex:1 1 0}
  .bSlide{min-height:170px;padding:18px 18px 32px}
  .bSlide.pic{aspect-ratio:2/1}
  .hero h1{font-size:22px;margin-bottom:6px}
  .hero p{font-size:13.5px}
  .tiers-legend{margin-top:10px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 10px}
  .card{padding:8px}
  .price-now b{font-size:17px}
  .tiers button{font-size:12px;padding:7px 8px}
  .price-now small{display:none}
  .stepper button{width:34px}
  .stepper input{width:40px}
  .add{font-size:13.5px;padding:10px 6px;white-space:nowrap}
  .hint{font-size:11px}
  .sheet{grid-template-columns:1fr}
  .sheet .pic{border-radius:var(--radius-lg) var(--radius-lg) 0 0;min-height:220px}
}
@media (min-width:761px) and (min-height:501px), (min-width:761px) and (pointer:fine){
  /* компьютер, ноутбук, планшет */
  .tabbar{display:none}
  .topnav{display:flex}
  body{padding-bottom:0}
  .toast{bottom:24px}
}
@media (pointer:coarse) and (max-height:500px) and (min-width:561px){
  /* телефон горизонтально: больше товаров в ряд, низкая нижняя панель */
  .grid{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tabbar{padding:4px 8px;border-radius:999px;--nbb:max(6px,calc(env(safe-area-inset-bottom,0px) - 12px))}
  .tabbar button{display:flex;justify-content:center;align-items:center;gap:8px;font-size:12.5px}
  .tabbar .ic{display:flex}
  .tabbar svg{width:22px;height:22px}
  body{padding-bottom:calc(52px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:360px){
  /* маленькие телефоны (iPhone SE и т.п.) */
  .grid{gap:10px 8px}
  .card{padding:6px}
  .tiers button{font-size:11px;padding:6px 6px}
  .stepper button{width:28px}
  .add{font-size:12px;padding:9px 4px;white-space:normal}
}
/* ===== Чат с менеджером (только оптовый сайт; на рознице — позже «Служба поддержки») ===== */
.cbtn[hidden],.cbox[hidden],.cme[hidden],.cerr[hidden]{display:none!important}

.cbox header b{flex:1;font-size:16px}.cbox header small{display:block;font-weight:500;opacity:.8;font-size:12px}
.cbox header button{border:0;background:rgba(255,255,255,.14);color:#fff;width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer}
.cmsgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.cm{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.cm.me{align-self:flex-end;background:var(--green);color:#fff;border-color:var(--green)}

.cme{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 0;background:var(--surface)}
.cme input,.cin textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--bg);color:var(--ink);min-width:0}

.cin .cat{background:var(--mint);color:var(--green-3);font-size:18px}.cin .csd{background:var(--green);color:#fff;padding:0 14px}
.cerr{color:#B3261E;font-size:13px;padding:0 12px 6px;background:var(--surface)}
@media (min-width:761px) and (min-height:501px), (min-width:761px) and (pointer:fine){
  .cbtn{bottom:24px;right:24px}
  .cbox{inset:auto 24px 24px auto;width:380px;height:560px;border-radius:20px}
}
</style>
</head>

<div class="toast" id="toast" role="status"></div>

<script>
/* ===== Настройки ===== */
const CONFIG = {
  catalogUrl: "catalog.json",
  apiUrl: "https://amura-shop-api.onrender.com",           // сервер на Render
  orderUrl: "https://amura-shop-api.onrender.com/order",
  botUsername: "amuraorders_bot",                            // бот, который присылает PDF
  managerWa: "77003671350",
  tierMid: 10,                                                // цена «от 10 шт» (тип цены «От 10шт» в МойСклад)
  liveUrl: "https://amura-shop-api.onrender.com/catalog",  // живые остатки и цены из МойСклад
  refreshMs: 180000,                                          // обновлять каждые 3 минуты
  loaderPrice: 1000,
  bankFee: 0.0095,
  shipping: [
    { id: "kamaz",   name: "КАМАЗ",            loader: true },
    { id: "rail",    name: "ЖД",               loader: true },
    { id: "avia",    name: "Авиа",             loader: true },
    { id: "kazpost", name: "Казпочта",         loader: false },
    { id: "courier", name: "Курьер по городу", loader: false },
    { id: "pickup",  name: "Самовывоз",        loader: false }
  ]
};
const PAGE = 40;

/* ===== Утилиты ===== */
const $ = s => document.querySelector(s);
const fmt = n => new Intl.NumberFormat("ru-RU").format(Math.round(n));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const RETAIL = !!window.AMURA_RETAIL;   // розничный сайт amura.kz/shop: только розничные цены, заказы с пометкой «розница»
if(RETAIL){
  CONFIG.catalogUrl = "/catalog.json"; CONFIG.liveUrl += "?mode=retail";
  CONFIG.bankFee = 0;                       // рознице комиссию банка не добавляем
  CONFIG.shipping = [                       // без КАМАЗа, ЖД, авиа и Казпочты
    { id: "courier", name: "Курьер по городу", loader: false },
    { id: "cdek",    name: "СДЭК",             loader: false },
    { id: "pickup",  name: "Самовывоз",        loader: false }
  ];
}
const SK = k => RETAIL && k !== "amura-auth" ? "r:" + k : k;   // корзина и кэш розницы — отдельно от оптового сайта, вход общий
function load(k, d){ try{ const v = localStorage.getItem(SK(k)); return v ? JSON.parse(v) : d; }catch{ return d; } }
function save(k, v){ try{ localStorage.setItem(SK(k), JSON.stringify(v)); }catch{} }
let tt; function toast(m){ const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => t.style.display = "none", 2600); }

/* ===== Цена по количеству ===== */
function tierOf(it, q){
  if(it.box && it.boxQty && q >= it.boxQty) return "box";
  if(it.mid && q >= CONFIG.tierMid) return "mid";
  return "opt";
}
function unitPrice(it, q){ return it[tierOf(it, q)] || it.opt; }
function nextTierHint(it, q){
  const t = tierOf(it, q);
  if(t === "opt" && it.mid && it.mid < it.opt && CONFIG.tierMid <= it.qty) return `Ещё ${CONFIG.tierMid - q} шт — цена ${fmt(it.mid)} ₸`;
  if(t !== "box" && it.box && it.boxQty && it.boxQty <= it.qty && it.box < unitPrice(it, q)) return `Ещё ${it.boxQty - q} шт до короба — ${fmt(it.box)} ₸`;
  return "";
}
function tiersHTML(it, q){
  const t = tierOf(it, q);
  const rows = [["opt", 1, it.mid ? `1–${CONFIG.tierMid - 1} шт` : "от 1 шт", it.opt]];
  if(it.mid) rows.push(["mid", CONFIG.tierMid, `от ${CONFIG.tierMid} шт`, it.mid]);
  if(it.box && it.boxQty) rows.push(["box", it.boxQty, `Короб ${it.boxQty} шт`, it.box]);
  return `<div class="tiers" role="group" aria-label="Цена по количеству">${rows.map(([k, min, label, p]) =>
    `<button type="button" data-tier="${min}" class="${t === k ? "on" : ""}" aria-pressed="${t === k}" ${min > it.qty ? `disabled title="Столько нет в наличии"` : ""}><span>${label}</span><b>${fmt(p)} ₸</b></button>`).join("")}</div>`;
}
function buyHTML(it){
  const q = qtyPick(it), inCart = cart[it.id];
  return `<div class="price-now"><b>${fmt(unitPrice(it, q))} ₸</b><small>за шт · ${fmt(unitPrice(it, q) * q)} ₸ за ${q} шт</small></div>
    ${tiersHTML(it, q)}
    <div class="buy">
      <div class="hint">${esc(nextTierHint(it, q))}</div>
      <div class="stepper"><button type="button" data-dec aria-label="Меньше">−</button><input type="number" inputmode="numeric" min="1" max="${it.qty}" value="${q}" aria-label="Количество"><button type="button" data-inc aria-label="Больше">+</button></div>
      <button type="button" class="add ${inCart ? "in" : ""}" data-add>${inCart && inCart === q ? `В корзине · ${q} шт` : `В корзину · ${q} шт`}</button>
    </div>`;
}

/* ===== Состояние ===== */
let ALL = [], DEMO = false;
const st = { q: "", brand: "", sort: "default", shown: PAGE };
let cart = load("amura-cart2", {});           // id -> qty
const pick = {};                              // id -> выбранное кол-во на карточке
const byId = id => ALL.find(i => i.id === id);

/* ===== Каталог ===== */
async function getJSON(url, ms, headers){
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try{ const r = await fetch(url, { cache: "no-cache", signal: ctl.signal, headers }); if(!r.ok) throw new Error(r.status); return await r.json(); }
  finally{ clearTimeout(t); }
}
const DESC = {};
let WS = false;                               // true — сервер отдал оптовые цены (клиент с тегом «опт»)
function applyData(data){
  if(RETAIL) data = { ...data, wholesale: false, items: (data.items || []).map(i => ({ ...i,   // в выгрузке опт и розница — берём розницу
    ...("rtl" in i ? { opt: i.rtl, mid: 0, box: 0 } : {}), img: i.img && !/^(https?:)?\//.test(i.img) ? "/" + i.img : i.img })) };
  WS = !!data.wholesale;

(() => {
  const row = $("#brands"), prev = $(".bArrow.prev"), next = $(".bArrow.next");
  const upd = () => { const max = row.scrollWidth - row.clientWidth; prev.hidden = row.scrollLeft <= 4; next.hidden = row.scrollLeft >= max - 4; };
  const step = () => Math.max(200, row.clientWidth * 0.7);
  prev.onclick = () => row.scrollBy({ left: -step(), behavior: "smooth" });
  next.onclick = () => row.scrollBy({ left: step(), behavior: "smooth" });
  row.addEventListener("scroll", upd, { passive: true });
  addEventListener("resize", upd);
  new MutationObserver(upd).observe(row, { childList: true });
  row.addEventListener("wheel", e => {                 // обычное колесо мыши крутит ряд вбок
    if(Math.abs(e.deltaY) <= Math.abs(e.deltaX) || row.scrollWidth <= row.clientWidth) return;
    const max = row.scrollWidth - row.clientWidth;
    if((e.deltaY < 0 && row.scrollLeft <= 0) || (e.deltaY > 0 && row.scrollLeft >= max)) return;   // край ряда — дальше крутится страница
    e.preventDefault(); row.scrollLeft += e.deltaY;
  }, { passive: false });
  let down = null, moved = false;
  row.addEventListener("pointerdown", e => { if(e.pointerType !== "mouse" || e.button !== 0) return; down = { x: e.clientX, left: row.scrollLeft }; moved = false; });
  addEventListener("pointermove", e => {
    if(!down) return;
    const dx = e.clientX - down.x;
    if(!moved && Math.abs(dx) > 6){ moved = true; row.classList.add("drag"); }
    if(moved) row.scrollLeft = down.left - dx;
  });
  addEventListener("pointerup", () => { if(!down) return; down = null; setTimeout(() => row.classList.remove("drag"), 0); });
  row.addEventListener("click", e => { if(moved){ e.stopImmediatePropagation(); e.preventDefault(); moved = false; } }, true);   // после перетаскивания бренд не выбирается
  upd();
})();

function lines(){
  return Object.entries(cart).map(([id, q]) => { const it = byId(id); return it ? { it, q, price: unitPrice(it, q), tier: tierOf(it, q) } : null; }).filter(Boolean);
}
function totals(ship){
  const ls = lines();
  const goods = ls.reduce((s,l) => s + l.price * l.q, 0);
  const s = CONFIG.shipping.find(x => x.id === ship);
  const loader = s && s.loader ? CONFIG.loaderPrice : 0;
  const fee = Math.round((goods + loader) * CONFIG.bankFee);
  return { ls, goods, loader, fee, total: goods + loader + fee, count: ls.reduce((s,l) => s + l.q, 0) };
}

/* ===== Отправка заказа ===== */
let orderKeyVal = "";   // один ключ на попытку заказа: повторная отправка не создаёт дубль
function orderKey(){ return orderKeyVal || (orderKeyVal = Date.now().toString(36) + Math.random().toString(36).slice(2, 10)); }
$("#drawerBody").addEventListener("submit", async e => {
  e.preventDefault();
  const f = readForm(), err = $("#err");
  const digits = f.phone.replace(/\D/g, "");
  if(!f.name) return fail("Укажите имя", "#fName");
  if(f.contact === "wa" && digits.length < 10) return fail("Укажите номер WhatsApp", "#fPhone");
  if(f.contact === "tg" && !/^[A-Za-z0-9_]{4,32}$/.test(f.tg)) return fail("Укажите Telegram username", "#fTg");
  if(!f.city) return fail("Укажите город", "#fCity");
  if(!f.ship) return fail("Выберите способ отправки");
  if(["kamaz", "rail", "avia"].includes(f.ship) && !f.logistics) return fail("Укажите, через какую логистику отправить", "#fLogi");
  if(f.ship === "courier" && !f.address) return fail("Укажите адрес доставки", "#fAddr");
  if(f.ship === "cdek" && !f.address) return fail("Укажите город и адрес пункта СДЭК", "#fAddr");
  if(f.ship === "kazpost"){
    if(!f.recipient) return fail("Укажите ФИО получателя", "#fFio");
    if(!/^\d{6}$/.test(f.zip)) return fail("Индекс — 6 цифр", "#fZip");
    if(!f.address) return fail("Укажите адрес", "#fAddr");
  }
  function fail(m, sel){ err.textContent = m; if(sel) $(sel).focus(); }
  err.textContent = "";
  const t = totals(f.ship);
  const payload = {
    name: f.name, contact: f.contact,
    phone: f.contact === "wa" ? normPhone(digits) : "",
    telegram: f.contact === "tg" ? f.tg : "",
    city: f.city, shipping: f.ship,
    logistics: f.logistics, recipient: f.recipient, zip: f.zip, address: f.address,
    items: t.ls.map(l => ({ id: l.it.id, qty: l.q, price: l.price })),
    clientTotal: t.total,
    orderKey: orderKey(),
    mode: RETAIL ? "retail" : undefined
  };
  const btn = $("#send"); btn.disabled = true; btn.textContent = "Отправляем…";
  try{
    let res;
    if(DEMO){ await new Promise(r => setTimeout(r, 700)); res = { ok: true, number: "DEMO-" + Date.now().toString().slice(-5), total: t.total, pdfUrl: "", demo: true }; }
    else{
      const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 120000);
      const busy = setTimeout(() => { btn.textContent = "Заказов много — ваш в очереди, не закрывайте страницу…"; }, 8000);
      let r;
      try{ r = await fetch(CONFIG.orderUrl, { method: "POST", headers: authHeaders(), body: JSON.stringify(payload), signal: ctl.signal }); }
      catch(e){ throw new Error(e.name === "AbortError" ? "Сервер долго отвечает — нажмите «Отправить заказ» ещё раз, дубль не создастся" : "Нет связи с сервером"); }
      finally{ clearTimeout(tm); clearTimeout(busy); }
      res = await r.json().catch(() => ({}));
      if(!r.ok || !res.ok) throw new Error(res.error || "Сервер не ответил");
    }
    showDone(res, f, t);
    orderKeyVal = "";
    cart = {}; save("amura-cart2", cart); renderCartCount(); render();
  }catch(ex){
    err.textContent = (ex.message || "Ошибка") + ". Попробуйте ещё раз или напишите менеджеру в WhatsApp.";
    btn.disabled = false; btn.textContent = "Отправить заказ";
  }
});
function normPhone(d){ if(d.length === 11 && d[0] === "8") d = "7" + d.slice(1); if(d.length === 10) d = "7" + d; return d; }
function showDone(res, f, t){
  $("#drawerTitle").textContent = "Заказ принят";
  const shipName = (CONFIG.shipping.find(s => s.id === f.ship)?.name || "") + (f.logistics && !["kazpost", "courier", "pickup", "cdek"].includes(f.ship) ? " — " + f.logistics : "") + (f.ship === "kazpost" ? ` — ${f.recipient}, ${f.zip}, ${f.address}` : "") + (f.ship === "courier" || f.ship === "cdek" ? ` — ${f.address}` : "");
  // в WhatsApp — только данные заказа и итог; состав заказа — в PDF-накладной
  const text = `Здравствуйте! Мой заказ AMURA № ${res.number}\n${f.name}, ${f.city}, ${shipName}\n\nИтого: ${fmt(res.total || t.total)} ₸`;
  const wa = `https://wa.me/${CONFIG.managerWa}?text=${encodeURIComponent(text)}`;
  const tg = `https://t.me/${CONFIG.botUsername}?start=${encodeURIComponent(res.startToken || res.number)}`;
  $("#drawerBody").innerHTML = `<div class="done">
    <h3>Заказ № ${esc(res.number)}</h3>
    <p>Заказ зарезервирован. Сумма ${fmt(res.total || t.total)} ₸.</p>
    ${f.contact === "tg"
      ? `<p>Нажмите кнопку и «Старт» — бот сразу пришлёт PDF-накладную и реквизиты для оплаты.</p><a class="btn tg" href="${tg}" target="_blank" rel="noopener">Получить накладную в Telegram</a>`
      : `<p>Нажмите кнопку — выберите WhatsApp, и текст заказа вместе с PDF уйдёт менеджеру. В ответ он пришлёт реквизиты для оплаты.</p><button class="btn wa" id="waSend" type="button">Отправить в WhatsApp</button>`}
    ${res.pdfUrl ? `<button class="btn ghost" id="pdfShare" type="button">Скопировать / отправить PDF-накладную</button>` : (res.demo ? `<p class="kv">В демо-режиме PDF не создаётся.</p>` : "")}
    <button class="btn ghost" id="backShop" type="button">Вернуться в каталог</button></div>`;
  $("#backShop").onclick = () => go("home");
  if(res.pdfUrl){ pdfFile(res.pdfUrl, res.number).catch(() => {}); $("#pdfShare").onclick = e => sharePdf(res.pdfUrl, res.number, e.currentTarget); }
  const waBtn = $("#waSend");
  if(waBtn){
    // PDF скачиваем заранее, чтобы по нажатию сразу открылось меню «Поделиться» с файлом и текстом
    let pdfFile = null;
    if(res.pdfUrl) fetch(res.pdfUrl).then(r => r.ok ? r.blob() : null).then(b => { if(b) pdfFile = new File([b], `AMURA-${res.number}.pdf`, { type: "application/pdf" }); }).catch(() => {});
    waBtn.onclick = async () => {
      try{
        if(pdfFile && navigator.canShare && navigator.canShare({ files: [pdfFile] })){
          await navigator.share({ files: [pdfFile], text });   // в списке выберите WhatsApp → чат с менеджером
          return;
        }
      }catch(e){ if(e && e.name === "AbortError") return; }
      window.open(wa, "_blank", "noopener");                  // запасной вариант: только текст
      if(res.pdfUrl) toast("PDF скачайте кнопкой ниже и приложите в чат");
    };
  }
}

/* ===== PDF-накладная как файл: «Поделиться» открывает меню телефона, где «Копировать» копирует сам документ, а не ссылку ===== */
const pdfCache = {};
function pdfFile(url, number){
  if(pdfCache[url]) return Promise.resolve(pdfCache[url]);
  return fetch(url).then(r => { if(!r.ok) throw new Error("pdf"); return r.blob(); }).then(b => (pdfCache[url] = new File([b], `AMURA-${number}.pdf`, { type: "application/pdf" })));
}
async function sharePdf(url, number, btn){
  const old = btn && btn.textContent;
  try{
    if(btn){ btn.disabled = true; btn.textContent = "Готовлю файл…"; }
    const f = await pdfFile(url, number);
    if(navigator.canShare && navigator.canShare({ files: [f] })){ await navigator.share({ files: [f], title: f.name }); return; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click();     // компьютер: файл просто скачивается
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast("PDF сохранён в загрузки");
  }catch(e){
    if(e && e.name === "AbortError") return;
    if(e && e.name === "NotAllowedError") toast("Нажмите ещё раз — файл уже готов");     // iPhone просит нажатие сразу после загрузки
    else window.open(url, "_blank", "noopener");
  }finally{ if(btn){ btn.disabled = false; btn.textContent = old; } }
}

const STATUS_TONE = s => /отгруж|выполн|достав|закрыт/i.test(s) ? "" : /отмен/i.test(s) ? ' style="background:var(--bg);color:var(--muted)"' : ' style="background:var(--warn-bg);color:var(--warn-fg)"';

  }
  function badge(){
    const n = open ? 0 : msgs.filter(m => !m.me && m.id > (st.seen || 0)).length, i = btn.querySelector("i");
    i.hidden = !n; i.textContent = n;
  }
  async function poll(){
    if(!st.token) return;
    try{
      const r = await fetch(`${API}/chat/poll?token=${encodeURIComponent(st.token)}&after=${msgs.length ? msgs[msgs.length - 1].id || 0 : 0}`);
      if(r.status === 403){ delete st.token; keep(); return; }
      const j = await r.json();
      if(j.ok && j.messages.length){
        msgs = msgs.filter(m => m.id).concat(j.messages);
        if(open){ st.seen = msgs[msgs.length - 1].id; keep(); }
        draw(); badge();
      }
    }catch{}
  }
  function schedule(){ clearTimeout(timer); timer = setTimeout(async () => { if(document.visibilityState === "visible") await poll(); schedule(); }, open ? 3000 : 25000); }
  function show(v){
    open = v; box.hidden = !v; btn.hidden = v;
    if(v){ if(msgs.length){ st.seen = msgs[msgs.length - 1].id || st.seen; keep(); } draw(); badge(); poll(); setTimeout(() => $c("ctext").focus(), 50); }
    schedule();
  }
  btn.onclick = () => show(true);
  box.querySelector(".ccl").onclick = () => show(false);
  $c("cat").onclick = () => $c("cfile").click();
  $c("ctext").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey && !matchMedia("(pointer:coarse)").matches){ e.preventDefault(); $c("cform").requestSubmit(); } });
  async function send(text, file){
    const err = $c("cerr"); err.hidden = true;
    if(sending) return; sending = true;
    try{
      if(!st.token){ const r = await fetch(API + "/chat/start", { method: "POST" }); const j = await r.json(); if(!j.ok) throw new Error(j.error || "Чат недоступен"); st.token = j.token; keep(); }
      st.name = $c("cName").value.trim(); st.phone = $c("cPhone").value.trim(); keep();
      msgs.push({ me: true, text: file ? (text || "") + (file.type === "application/pdf" ? "\n📄 " + file.name : "\n📷 Фото") : text, at: 0 }); draw();
      let r;
      if(file){
        const fd = new FormData(); fd.append("token", st.token); fd.append("text", text); fd.append("name", st.name); fd.append("phone", st.phone); fd.append("file", file);
        r = await fetch(API + "/chat/send", { method: "POST", body: fd });
      } else {
        r = await fetch(API + "/chat/send", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token: st.token, text, name: st.name, phone: st.phone }) });
      }
      const j = await r.json().catch(() => ({}));
      if(!r.ok || !j.ok) throw new Error(j.error || "Не отправлено, попробуйте ещё раз");
      st.sent = 1; keep(); setTimeout(poll, 600); setTimeout(poll, 2500);
    }catch(e){
      msgs = msgs.filter(m => m.id); draw();
      err.textContent = e.message || "Нет связи с сервером"; err.hidden = false;
    }finally{ sending = false; }
  }
  $c("cform").onsubmit = e => { e.preventDefault(); const t = $c("ctext").value.trim(); if(!t) return; $c("ctext").value = ""; send(t); };
  $c("cfile").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if(f) send($c("ctext").value.trim(), f), $c("ctext").value = ""; };
  document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible") poll(); });
  if(st.token){ poll(); schedule(); }
})();
</script>
</body>
</html>
