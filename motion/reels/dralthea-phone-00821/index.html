<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/brand.css">
<!-- Dr.Althea Aqua Marine Watery Cream, арт. 00821 — розница amura.kz. Формат «iPhone + интерфейс» (как у @riki.bosso): без голоса.
     В телефоне — настоящие экраны amura.kz (Playwright, 390×844 @3x, цены скрыты): s1_home, s2_focus, s3_search, s4_product, s5_added.
     cream.png — фото товара без фона. Медиа в git не храним: экраны снимаются заново скриптом shots.js. -->
<style>
.stage3d{position:absolute;inset:0;perspective:2600px;perspective-origin:50% 45%}
.phone{position:absolute;left:262px;top:300px;width:556px;height:1160px;border-radius:92px;transform-style:preserve-3d;
  background:linear-gradient(145deg,#4a4f55,#1c1f22 40%,#3a3e43 70%,#15171a);box-shadow:0 60px 120px rgba(0,0,0,.6),inset 0 0 0 3px rgba(255,255,255,.18)}
.phone .scr{position:absolute;left:20px;top:20px;right:20px;bottom:20px;border-radius:74px;overflow:hidden;background:#fff}
.phone .scr img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;opacity:0}
.phone .isl{position:absolute;left:50%;top:38px;width:150px;height:44px;margin-left:-75px;border-radius:22px;background:#000;z-index:3}
.phone .btn{position:absolute;width:8px;border-radius:4px;background:#2b2e32}
.phone .glare{position:absolute;inset:20px;border-radius:74px;background:linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 35%);z-index:4;pointer-events:none}
.tap{position:absolute;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:rgba(215,234,74,.55);border:4px solid #D7EA4A;opacity:0;z-index:5}
.lbl{position:absolute;white-space:nowrap;z-index:6}
.lbl span{display:inline-flex;align-items:center;gap:12px;background:rgba(7,31,23,.92);border:2px solid rgba(215,234,74,.7);color:#fff;font:800 38px Manrope;border-radius:999px;padding:16px 30px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.lbl span b{color:#D7EA4A}
.big2{position:absolute;left:40px;right:40px;text-align:center;font:800 76px/1.05 Unbounded;color:#fff;text-shadow:0 10px 40px rgba(0,0,0,.45)}
.prod{position:absolute;background:url(cream.png) 0 0/100% 100%;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
</style></head><body>
<script src="../../kit/kit.js"></script>
<script>
(function(){
const { make, A, E } = AM;
const END = 18.6, PR = 1083 / 1400;
const world = AM.stage({ brand: '' });
const SC = [];
const sc = (a, opt = {}) => { const id = 'sc' + SC.length; const el = make(`<div class="sc" id="${id}"></div>`, world); SC.push({ id, a, ...opt }); return el; };

/* 1. 0–1.8 зацепка */
let a = 0; const s1 = sc(a); AM.dots(0, 1.9);
AM.slamWin(make('<div class="am-big" style="top:660px;font-size:100px">Корейский уход<br><span class="lime">за 10 секунд?</span></div>', s1), 0, 1.8);

/* 2. 1.8–13 телефон: amura.kz → поиск 00821 → товар → «В корзину» */
a = 1.8; const s2 = sc(a, { in: 'whip' });
const st = make('<div class="stage3d"></div>', s2);
const ph = make(`<div class="phone"><div class="btn" style="left:-8px;top:250px;height:90px"></div><div class="btn" style="left:-8px;top:370px;height:90px"></div><div class="btn" style="right:-8px;top:300px;height:150px"></div>
  <div class="scr"></div><div class="isl"></div><div class="glare"></div></div>`, st);
const scr = ph.querySelector('.scr');
const SW = 516, SH = 1120, k = SH / 844;               // экран телефона и масштаб от сайта (390×844)
const screens = {}; ['s1_home', 's2_focus', 's3_search', 's4_product', 's5_added'].forEach(n => screens[n] = make(`<img src="${n}.png">`, scr));
const show = (n, t0, t1) => AM.A(screens[n], [{ opacity: 0 }, { opacity: 1, offset: .04 }, { opacity: 1, offset: .96 }, { opacity: t1 >= 13 ? 1 : 0 }], t0, t1 - t0 + .15, 'linear', 'none');
show('s1_home', a, 3.9); show('s2_focus', 3.8, 4.6); show('s3_search', 4.5, 6.0); show('s4_product', 5.9, 9.4); show('s5_added', 9.3, 13.3);
const tap = (x, y, t) => { const n = make(`<div class="tap" style="left:${20 + x * SW / 390}px;top:${20 + y * k}px"></div>`, ph);
  AM.A(n, [{ opacity: 1, transform: 'scale(.3)' }, { opacity: 0, transform: 'scale(1.6)' }], t, .5, 'ease-out', 'none'); AM.cue(t, 'pop'); };
// влёт в 3D и «живые» повороты
AM.A(ph, [{ transform: 'translateY(900px) rotateY(70deg) rotateX(18deg) scale(.8)', opacity: 0 }, { transform: 'translateY(-20px) rotateY(-14deg) rotateX(6deg) scale(1.02)', opacity: 1, offset: .8 }, { transform: 'rotateY(-10deg) rotateX(5deg)', opacity: 1 }], a, .9, E.snap); AM.cue(a, 'whoosh');
AM.A(ph, [{ transform: 'rotateY(-10deg) rotateX(5deg)' }, { transform: 'rotateY(4deg) rotateX(2deg) scale(1.08)' }], 3.4, .7, E.out, 'forwards');           // к поиску
AM.A(ph, [{ transform: 'rotateY(4deg) rotateX(2deg) scale(1.08)' }, { transform: 'rotateY(12deg) rotateX(4deg) scale(1)' }], 6.0, .8, E.out, 'forwards');  // к товару
AM.A(ph, [{ transform: 'rotateY(12deg) rotateX(4deg) scale(1)' }, { transform: 'rotateY(-6deg) rotateX(-4deg) scale(1.1) translateY(-60px)' }], 8.6, .7, E.out, 'forwards'); // к кнопке
AM.A(ph, [{ transform: 'rotateY(-6deg) rotateX(-4deg) scale(1.1) translateY(-60px)' }, { transform: 'translateX(-250px) rotateY(18deg) rotateX(4deg) scale(.82)' }], 10.8, .7, E.snap, 'forwards'); // в сторону
AM.float(ph.parentNode, 2.8, 13, 10);
// подписи и касания
const lbl = (html, x, y, t, t1, from = 1) => { const n = make(`<div class="lbl" style="left:${x}px;top:${y}px"><span>${html}</span></div>`, s2); AM.slide(n, t, from);
  if (t1) AM.A(n, [{ opacity: 1 }, { opacity: 0 }], t1, .3, E.out, 'forwards'); return n; };
const top = make('<div class="big2" style="top:150px;font-size:58px">amura.kz</div>', s2); AM.up(top, a + .5, .4, 30); AM.A(top, [{ opacity: 1 }, { opacity: 0 }], 3.6, .3, E.out, 'forwards');
tap(170, 70, 3.65);
const art = lbl('🔍 артикул <b>00821</b>', 60, 1480, 4.3, 6.0, -1);
tap(200, 160, 5.7);
lbl('💧 бамбуковая вода', 40, 420, 6.5, 8.6, -1);
lbl('гиалуроновая кислота', 560, 620, 7.1, 8.6, 1);
lbl('🌿 пантенол + водоросли', 40, 1500, 7.7, 8.6, -1);
tap(195, 813, 9.15);
const ok = lbl('✓ <b>в корзине</b>', 330, 200, 9.5, 10.8, 1);
// товар рядом с телефоном
const H = 640, cr = make(`<div class="prod" style="left:${1080 - H * PR - 20}px;top:640px;width:${Math.round(H * PR)}px;height:${H}px;opacity:0"></div>`, s2);
const g2 = make('<div class="am-glow" style="left:520px;top:560px;width:600px;height:760px"></div>', s2); AM.glow(g2, 11.2);
AM.rise(cr, 11.0); AM.sweep(cr, 11.7); AM.cue(11.7, 'shine');
const t11 = make('<div class="big2" style="top:170px;font-size:62px">Оригинал<br><span class="lime">из Кореи</span></div>', s2); AM.up(t11, 11.2, .4, 30);
const t12 = lbl('🚚 доставка по Казахстану', 250, 1430, 11.9, 0, 1);

/* 3. 13.2–18.6 призыв: артикул → «в описании» → «ссылка в шапке профиля» */
a = 13.2; const s3 = sc(a, { in: 'zoom' });
const brand = make('<div id="am-brand" style="opacity:0">AMURA</div>', document.body); AM.A(brand, [{ opacity: 0 }, { opacity: .85 }], a, .5, E.out, 'forwards');
make('<div class="am-glow" style="left:-160px;top:420px;width:800px;height:900px"></div>', s3);
const H9 = 600, p9 = make(`<div class="prod" style="left:20px;top:560px;width:${Math.round(H9 * PR)}px;height:${H9}px"></div>`, s3);
AM.A(p9, [{ opacity: 0, transform: 'translateY(600px) rotate(10deg)' }, { opacity: 1, transform: 'none' }], a, .6, E.snap); AM.float(p9, a + .6, END, 12);
const X = 520, Wd = 520;
const nm = make(`<div class="ab" style="left:${X}px;top:360px;width:${Wd}px;font:800 46px/1.15 Unbounded">Dr.Althea<br>Aqua Marine<br>Watery Cream</div>`, s3); AM.up(nm, a + .25, .4, 30);
const ar = make(`<div class="ab" style="left:${X}px;top:580px;width:${Wd}px;height:180px;border-radius:32px;background:#D7EA4A;color:#0B3326;display:flex;flex-direction:column;justify-content:center;padding-left:36px;box-shadow:0 0 80px rgba(215,234,74,.45)"><div style="font:800 28px Manrope;letter-spacing:.2em">АРТИКУЛ</div><div style="font:800 88px Unbounded;letter-spacing:.04em"></div></div>`, s3);
AM.pop(ar, a + .4); AM.digits(ar.lastChild, '00821', [0, 1, 2, 3, 4].map(i => a + .7 + i * .15));
const ds = make(`<div class="ab" style="left:${X}px;top:780px"><span class="am-chip" style="font-size:30px">↓ также в описании</span></div>`, s3); AM.pop(ds, a + 1.6, .45);
const pf = make(`<div class="ab" style="left:${X}px;top:880px;width:${Wd}px;height:150px;border-radius:30px;background:#1F6A50;display:flex;align-items:center;gap:22px;padding:0 28px;box-shadow:0 0 0 4px #D7EA4A"><span style="font:800 58px Manrope;color:#D7EA4A">↑</span><div style="font:800 34px/1.2 Manrope">Ссылка на магазин —<br><span class="lime">в шапке профиля</span></div></div>`, s3);
AM.pop(pf, a + 2.3); AM.pulse(pf, a + 2.9); AM.pulse(pf, END - 1);
const kz = make(`<div class="ab" style="left:${X}px;top:1070px;font:800 40px Unbounded">amura.kz</div>`, s3); AM.up(kz, a + 3.0, .4, 20);

AM.scenes(SC, END); AM.background(END);
window.REEL_END = END;
})();
</script></body></html>
