<style>

<script src="../../kit/kit.js"></script>
<script>
(function(){
const { make, A, E } = AM;
const R = 1221 / 1539;                       // ширина / высота serum.png
const END = 35;

/* Субтитры без голоса: фраза целиком, текущее слово — салатовым (слова поровну по окну фразы) */
const LINES = [
  ['Смотри: солнце светит в окно.', 3.7, 5.3],
  ['В лучах два вида ультрафиолета:', 5.4, 6.6], ['UVB и UVA.', 6.6, 7.4],
  ['UVB стекло', 7.5, 8.3], ['в основном задерживает.', 8.3, 9.5],
  ['А UVA проходит сквозь стекло —', 9.6, 10.9], ['прямо к лицу у окна.', 10.9, 11.8],
  ['Обычное оконное стекло', 11.9, 12.8], ['пропускает большую часть UVA.', 12.8, 13.9],
  ['UVA проникают глубже в кожу', 14.2, 15.7], ['и связаны с фотостарением', 15.8, 16.8], ['и пятнами.', 16.8, 17.6],
  ['Солнцезащитная сыворотка', 23.4, 24.6], ['Skin1004 Hyalu-Cica.', 24.6, 25.8],
  ['SPF50+ — от UVB,', 26.1, 27.1], ['PA++++ — от UVA.', 27.1, 28.1], ['Лёгкая, без белых следов.', 28.1, 28.9],
  ['Артикул 00355 —', 29.4, 30.4], ['также в описании.', 30.5, 31.1], ['Ссылка — в шапке профиля,', 31.2, 32.4], ['ищи на amura.kz.', 32.5, 34.4],
];

const world = AM.stage({ brand: '' });       // без логотипа в начале: бренд появляется только с товаром
LINES.forEach(([txt, a, b], i) => {
  const d = make('<div class="am-sub"></div>', 'am-subs'), w = txt.split(' '), st = (b - a) / w.length, nx = LINES[i + 1];
  const z = nx && nx[1] - b < .4 ? nx[1] - .05 : b + .4;
  w.forEach((x, k) => { const s = make('<span></span>', d); s.textContent = (k ? ' ' : '') + x; s.animate([{ color: '#D7EA4A' }, { color: '#D7EA4A' }], { delay: (a + k * st) * 1000, duration: st * 1000, fill: 'none' }); });
  d.animate([{ opacity: 0, transform: 'translateY(20px) scale(.95)' }, { opacity: 1, transform: 'none', offset: Math.min(.5, .12 / (z - a)) }, { opacity: 1, transform: 'none' }], { delay: (a - .05) * 1000, duration: (z - a + .05) * 1000, fill: 'none' });
});
const SC = [];
const sc = (a, opt = {}) => { const id = 'sc' + SC.length; const el = make(`<div class="sc" id="${id}"></div>`, world); SC.push({ id, a, ...opt }); return el; };
const big = (el, html, top, size = 100) => make(`<div class="am-big" style="top:${top}px;font-size:${size}px">${html}</div>`, el);

/* Луч: полоска летит из (x0,y0) в (x1,y1); fade — растворяется в конце (упёрся в стекло) */
const ray = (el, kind, x0, y0, x1, y1, t, d, fade = false) => {
  const r = make(`<div class="ray ${kind}"></div>`, el), ang = Math.atan2(y1 - y0, x1 - x0) * 180 / Math.PI;
  const p = (x, y) => `translate(${x - 60}px,${y - 8}px) rotate(${ang}deg)`;
  A(r, [{ opacity: 0, transform: p(x0, y0) }, { opacity: 1, transform: p(x0 + (x1 - x0) * .15, y0 + (y1 - y0) * .15), offset: .15 }, { opacity: 1, transform: p(x1, y1), offset: fade ? .85 : .9 }, { opacity: 0, transform: p(x1 + (fade ? 0 : (x1 - x0) * .05), y1 + (fade ? 0 : (y1 - y0) * .05)) }], t, d, 'linear', 'none');
  return r;
};
const sunSVG = `<svg width="300" height="300" viewBox="-150 -150 300 300"><g class="spk" fill="#FFD34D">${[...Array(12)].map((_, k) => `<path transform="rotate(${k * 30})" d="M-14 -112 L0 -146 L14 -112Z"/>`).join('')}</g>
  <circle r="98" fill="#FFD34D"/><circle r="98" fill="url(#sg)"/><defs><radialGradient id="sg" cx="35%" cy="35%"><stop offset="0" stop-color="#FFF6C8"/><stop offset="1" stop-color="#FFB627" stop-opacity=".9"/></radialGradient></defs></svg>`;
const faceSVG = `<svg width="340" height="420" viewBox="0 0 520 640">
  <path d="M90 640 C 110 490, 410 490, 430 640" fill="#1F6A50"/><rect x="215" y="430" width="90" height="90" rx="30" fill="#F2C9A8"/>
  <ellipse cx="260" cy="270" rx="185" ry="225" fill="#F6D3B5"/><path d="M75 250 C 70 80, 450 80, 445 250 C 430 150, 90 150, 75 250Z" fill="#3A2A22"/>
  <ellipse cx="190" cy="285" rx="20" ry="24" fill="#2B2B2B"/><ellipse cx="330" cy="285" rx="20" ry="24" fill="#2B2B2B"/>
  <path d="M205 385 Q260 420 315 385" fill="none" stroke="#B5574B" stroke-width="12" stroke-linecap="round"/>
  <g class="spots" opacity="0" fill="#B5826A"><circle cx="150" cy="350" r="11"/><circle cx="178" cy="372" r="8"/><circle cx="132" cy="380" r="7"/><circle cx="360" cy="352" r="10"/><circle cx="385" cy="376" r="7"/></g></svg>`;

/* 1. 0–1.8 зацепка */
let a = 0; const s1 = sc(a); AM.dots(0, 1.9);
AM.slamWin(big(s1, 'Солнце достаёт<br>тебя <span class="lime">даже дома?</span>', 700, 96), 0, 1.8);

/* 2. 1.8–3.6 второй вопрос + окно */
a = 1.8; const s2 = sc(a, { in: 'whip' });
AM.slam(big(s2, 'Окно защищает<br>от <span style="color:var(--sun)">солнца?</span>', 420, 92), a + .05, { hit: false });
const w2 = make(`<svg class="ab" style="left:340px;top:820px" width="400" height="460" viewBox="0 0 400 460"><rect x="10" y="10" width="380" height="440" rx="18" fill="rgba(170,215,250,.25)" stroke="#E4EDE8" stroke-width="20"/><line x1="200" y1="10" x2="200" y2="450" stroke="#E4EDE8" stroke-width="16"/><line x1="10" y1="230" x2="390" y2="230" stroke="#E4EDE8" stroke-width="16"/><path d="M60 60 L140 140 M250 60 L330 140" stroke="rgba(255,255,255,.45)" stroke-width="12" stroke-linecap="round"/></svg>`, s2);

const q2 = make('<div class="ab" style="left:800px;top:760px;font:800 160px Unbounded;color:var(--lime)">?</div>', s2); AM.pop(q2, a + 1.0);

/* 3. 3.6–14 «опыт»: солнце → окно → лицо */

AM.A(sun.querySelector('.spk'), [{ transform: 'rotate(0deg)' }, { transform: 'rotate(60deg)' }], a, 14 - a, 'linear');
const glass = make(`<div class="ab" style="left:${GX}px;top:${GY}px;width:${GW}px;height:${GH}px;border-radius:10px;background:linear-gradient(90deg,rgba(170,215,250,.35),rgba(220,240,255,.6),rgba(170,215,250,.35));border:8px solid #E4EDE8"></div>`, s3);
AM.up(glass, a + .3, .5, 80);
const gl = make(`<div class="ab" style="left:${GX - 30}px;top:${GY}px;width:${GW + 60}px;height:${GH}px;border-radius:40px;background:radial-gradient(closest-side,rgba(255,154,60,.75),rgba(255,154,60,0));opacity:0"></div>`, s3);
const lw = make(`<div class="ab" style="left:${GX - 60}px;top:${GY - 80}px;width:${GW + 120}px;text-align:center"><span class="am-chip" style="font-size:32px;padding:8px 22px">окно</span></div>`, s3); AM.pop(lw, a + .6);
const face = make(`<div class="ab" style="left:700px;top:640px">${faceSVG}</div>`, s3); AM.up(face, a + .5, .5, 80);
const legB = make('<div class="ab" style="left:380px;top:250px"><span class="tag b">UVB</span></div>', s3);
const legA = make('<div class="ab" style="left:580px;top:250px"><span class="tag a">UVA</span></div>', s3);
AM.pop(legB, 5.6); AM.pop(legA, 6.6);
AM.A(legB.firstChild, [{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], 7.5, .5, 'ease-in-out', 'none');
AM.A(legA.firstChild, [{ transform: 'scale(1)' }, { transform: 'scale(1.15)' }, { transform: 'scale(1)' }], 9.6, .5, 'ease-in-out', 'none');
const S0 = [[290, 520], [300, 600], [290, 680]];                // из солнца
const G1 = [[GX + 10, 640], [GX + 10, 780], [GX + 10, 920]];      // в стекло
const F1 = [[830, 880], [880, 930], [830, 980]];                  // в щёку
// UVB: летят и гаснут на стекле
[7.5, 7.75, 8.0, 8.6, 8.85, 9.1].forEach((t, k) => { const i = k % 3; ray(s3, 'b', S0[i][0], S0[i][1], G1[i][0], G1[i][1], t, .55, true); AM.A(gl, [{ opacity: 0 }, { opacity: .9 }, { opacity: 0 }], t + .45, .4, 'ease-out', 'none'); });
AM.cue(7.95, 'hit');
const stopB = make(`<div class="ab" style="left:${GX - 200}px;top:${GY + GH + 40}px;width:470px;text-align:center"><span class="tag b" style="font-size:32px">стекло задерживает ✋</span></div>`, s3);
AM.pop(stopB, 8.3); AM.A(stopB, [{ opacity: 1 }, { opacity: 0 }], 9.5, .3, E.out, 'forwards');
// UVA: проходят сквозь стекло к лицу — и дальше идут потоком до конца сцены
const uva = t => { for (let i = 0; i < 3; i++) { const t0 = t + i * .22; ray(s3, 'a', S0[i][0], S0[i][1], G1[i][0], G1[i][1], t0, .45); ray(s3, 'a', G1[i][0] + GW, G1[i][1] + 20, F1[i][0], F1[i][1], t0 + .42, .5); } };
for (let t = 9.6; t < 13.6; t += 1.0) uva(t);
const thru = make(`<div class="ab" style="left:${GX - 200}px;top:${GY + GH + 40}px;width:470px;text-align:center"><span class="tag a" style="font-size:32px">проходит насквозь →</span></div>`, s3);
AM.pop(thru, 10.0);
const hit = make('<div class="am-glow" style="left:720px;top:780px;width:300px;height:300px;background:radial-gradient(closest-side,rgba(176,140,255,.6),rgba(176,140,255,0));opacity:0"></div>', s3);
AM.A(hit, [{ opacity: 0 }, { opacity: 1 }], 10.6, .5, E.out, 'forwards'); AM.cue(10.6, 'shine');
AM.A(face.querySelector('.spots'), [{ opacity: 0 }, { opacity: 1 }], 11.0, .6, E.out, 'forwards');
const card = make('<div class="card" style="top:190px;background:#0B3326;z-index:2">Обычное стекло<br>пропускает большую<br>часть <span class="uva">UVA</span></div>', s3);
AM.A(card, [{ opacity: 0, transform: 'translateY(-60px)' }, { opacity: 1, transform: 'none' }], 11.9, .45, E.back); AM.cue(11.9, 'pop');
[legA, legB].forEach(n => AM.A(n, [{ opacity: 1 }, { opacity: 0 }], 11.9, .3, E.out, 'forwards'));

/* 4. 14–17.8 кожа в разрезе: UVB — в верхнем слое, UVA — глубже */
a = 14; const s4 = sc(a, { in: 'iris', x: 860, y: 930 });
const L = (top, h, bg, label) => make(`<div class="ab" style="left:80px;right:80px;top:${top}px;height:${h}px;background:${bg};border-radius:${top < 800 ? '40px 40px 0 0' : '0 0 40px 40px'};display:flex;align-items:center;justify-content:flex-end;padding-right:36px;font:800 34px Manrope;color:rgba(60,30,20,.75)">${label}</div>`, s4);
const ep = L(760, 170, '#F6D3B5', 'верхний слой'), de = L(930, 330, '#E7A58E', 'глубже');
AM.up(ep, a + .1, .5, 60); AM.up(de, a + .2, .5, 60);
const arrow = (x, y0, len, color, t, label) => {
  const lab = make(`<div class="ab" style="left:${x - 110}px;top:${y0 - 100}px;width:220px;text-align:center"><span class="tag" style="background:${color}">${label}</span></div>`, s4); AM.pop(lab, t - .3);
  const sh = make(`<div class="ab" style="left:${x - 14}px;top:${y0}px;width:28px;height:${len}px;border-radius:14px;background:${color};box-shadow:0 0 30px ${color};transform-origin:50% 0"></div>`, s4);
  const hd = make(`<svg class="ab" style="left:${x - 40}px;top:${y0 + len - 20}px" width="80" height="70" viewBox="0 0 80 70"><path d="M0 0 L40 70 L80 0Z" fill="${color}"/></svg>`, s4);
  AM.A(sh, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }], t, .6, E.out); AM.A(hd, [{ opacity: 0, transform: `translateY(${-len}px)` }, { opacity: 1, transform: 'none' }], t, .6, E.out); AM.cue(t, 'swish');
};
arrow(330, 470, 340, 'var(--uvb)', a + .8, 'UVB');
arrow(720, 470, 700, 'var(--uva)', a + 1.5, 'UVA');
const c41 = make('<div class="ab" style="left:80px;top:1290px"><span class="am-chip solid" style="background:var(--uva)">фотостарение</span></div>', s4); AM.pop(c41, 15.8);
const c42 = make('<div class="ab" style="right:80px;top:1290px"><span class="am-chip solid" style="background:var(--uva)">пигментные пятна</span></div>', s4); AM.pop(c42, 16.8);
const k4 = make('<div class="am-kick" style="top:260px">UVA ПРОНИКАЮТ ГЛУБЖЕ</div>', s4); AM.up(k4, a + .3, .4, 30);

/* 5. 17.8–20.6 поворот */
a = 17.8; const s5 = sc(a, { in: 'whip' }); AM.dots(a, 20.7);
AM.slam(big(s5, 'Ты даже<br>не заметил,<br>как <span class="lime">досмотрел</span>', 560, 100), a + .1);
const wink = make('<div class="ab" style="left:0;right:0;top:1000px;text-align:center;font:160px \'Noto Color Emoji\'">😉</div>', s5); AM.pop(wink, a + 1.0);

/* 6. 20.6–23.2 «а вот что защищает» */
a = 20.6; const s6 = sc(a, { in: 'wipe' });
AM.slam(big(s6, 'А вот что<br>защищает<br>и от <span class="uva">UVA</span>,<br>и от <span class="uvb">UVB</span>', 520, 104), a + .1);
const ar6 = make('<div class="ab" style="left:0;right:0;top:1180px;text-align:center;font:800 120px Unbounded;color:var(--lime)">↓</div>', s6);
AM.up(ar6, a + .9, .4, -40); AM.A(ar6, [{ translate: '0 0' }, { translate: '0 30px' }, { translate: '0 0' }], a + 1.3, 1.2, 'ease-in-out', 'none');

/* 7. 23.2–26 товар: взлёт, свечение, блик + бренд AMURA */
a = 23.2; const s7 = sc(a, { in: 'zoom' });
const brand = make('<div id="am-brand" style="opacity:0">AMURA</div>', document.body); AM.A(brand, [{ opacity: 0 }, { opacity: .85 }], a, .5, E.out, 'forwards');
make('<div class="am-glow" style="left:90px;top:420px;width:900px;height:900px"></div>', s7);
const r7 = make('<div class="am-ring" style="left:290px;top:620px;width:500px;height:500px;opacity:0"></div>', s7);
const H7 = 860, p7 = make(`<div class="prod" style="left:${Math.round(540 - H7 * R / 2)}px;top:400px;width:${Math.round(H7 * R)}px;height:${H7}px"></div>`, s7);
AM.rise(p7, a + .05); AM.sway(p7, a + .8, 26.2, 1.5); AM.ring(r7, a + .5); AM.sweep(p7, a + .9); AM.cue(a + .9, 'shine');
const n7 = make('<div class="ab" style="left:0;right:0;top:230px;text-align:center"><span class="am-chip solid" style="font-size:40px">Skin1004 · SPF50+ PA++++</span></div>', s7); AM.pop(n7, a + 1.0);

/* 8. 26–29.2 факты: щит + чипы из описания */
a = 26; const s8 = sc(a, { in: 'zoom' });
const H8 = 640, p8 = make(`<div class="prod" style="left:20px;top:520px;width:${Math.round(H8 * R)}px;height:${H8}px"></div>`, s8);
AM.A(p8, [{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'none' }], a, .45, E.out); AM.float(p8, a + .45, 29.4, 10);
const dome = make('<svg class="ab" style="left:0;top:420px" width="600" height="820" viewBox="0 0 600 820"><path d="M30 800 C 30 260, 160 40, 300 40 C 440 40, 570 260, 570 800" fill="rgba(215,234,74,.08)" stroke="#D7EA4A" stroke-width="8" stroke-dasharray="26 18"/></svg>', s8);
AM.fade(dome, a + .3, .5);
[[0, 'b'], [.35, 'a'], [.7, 'b'], [1.05, 'a'], [1.4, 'b'], [1.75, 'a']].forEach(([dt, k], i) => ray(s8, k, 760, 300 + i * 30, 470, 560 + (i % 3) * 70, a + .6 + dt, .5, true));
const k8 = make('<div class="am-kick" style="top:260px">ЗАЩИТА ОТ UVA И UVB</div>', s8); AM.up(k8, a + .1, .4, 30);
[['SPF50+ PA++++', true], ['🪶 невесомая', false], ['без белых следов', false], ['гиалуронка + центелла', false]].forEach(([t, solid], k) => {
  const c = make(`<div class="ab" style="left:540px;top:${560 + k * 140}px"><span class="am-chip${solid ? ' solid' : ''}" style="font-size:34px">${t}</span></div>`, s8); AM.slide(c, a + .5 + k * .65, 1);
});

/* 9. 29.2–34.6 призыв: артикул → «в описании» → «ссылка в шапке профиля» → поиск на amura.kz */
a = 29.2; const s9 = sc(a, { in: 'zoom' });
make('<div class="am-glow" style="left:-160px;top:420px;width:800px;height:900px"></div>', s9);
const H9 = 560, p9 = make(`<div class="prod" style="left:24px;top:560px;width:${Math.round(H9 * R)}px;height:${H9}px"></div>`, s9);
AM.A(p9, [{ opacity: 0, transform: 'translateY(600px) rotate(10deg)' }, { opacity: 1, transform: 'none' }], a, .6, E.snap); AM.float(p9, a + .6, END, 12);
const X = 500, Wd = 540;
const nm = make(`<div class="ab" style="left:${X}px;top:330px;width:${Wd}px;font:800 46px/1.15 Unbounded">Skin1004<br>Hyalu-Cica<br>Sun Serum</div>`, s9); AM.up(nm, a + .25, .4, 30);
const art = make(`<div class="ab" style="left:${X}px;top:540px;width:${Wd}px;height:180px;border-radius:32px;background:#D7EA4A;color:#0B3326;display:flex;flex-direction:column;justify-content:center;padding-left:36px;box-shadow:0 0 80px rgba(215,234,74,.45)"><div style="font:800 28px Manrope;letter-spacing:.2em">АРТИКУЛ</div><div style="font:800 88px Unbounded;letter-spacing:.04em"></div></div>`, s9);
AM.pop(art, a + .4); AM.digits(art.lastChild, '00355', [0, 1, 2, 3, 4].map(k => a + .7 + k * .15));
const ds = make(`<div class="ab" style="left:${X}px;top:740px"><span class="am-chip" style="font-size:30px">↓ также в описании</span></div>`, s9); AM.pop(ds, a + 1.3, .45);
const pf = make(`<div class="ab" style="left:${X}px;top:840px;width:${Wd}px;height:140px;border-radius:30px;background:#1F6A50;display:flex;align-items:center;gap:22px;padding:0 28px;box-shadow:0 0 0 4px #D7EA4A"><span style="font:800 58px Manrope;color:#D7EA4A">↑</span><div style="font:800 34px/1.2 Manrope">Ссылка на магазин —<br><span class="lime">в шапке профиля</span></div></div>`, s9);
