<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/brand.css">
<style>
.phone{position:absolute;left:212px;top:470px;width:656px;height:1378px;border-radius:84px;background:#0c0f0e;padding:18px;box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 3px rgba(255,255,255,.12) inset;transform-origin:50% 30%}
.phone .scr{width:620px;height:1342px;border-radius:68px;overflow:hidden;background:#fff;position:relative}
.phone img{width:100%;height:100%;display:block}
.phone .isl{position:absolute;left:50%;top:34px;width:150px;height:40px;margin-left:-75px;border-radius:20px;background:#0c0f0e}
.call{position:absolute;white-space:nowrap}
.call .am-chip{font-size:40px;box-shadow:0 18px 40px rgba(0,0,0,.45)}
.url{position:absolute;left:90px;right:90px;top:820px;height:150px;border-radius:75px;background:#fff;color:#16201B;display:flex;align-items:center;justify-content:center;gap:24px;font:800 66px Unbounded;box-shadow:0 0 0 6px #D7EA4A,0 0 90px rgba(215,234,74,.45)}
</style></head><body>
<script src="../../kit/kit.js"></script>
<script src="site/meta.js"></script><script src="words.js"></script><script src="data.js"></script>
<script>
(function (R) {
  const { make, at } = AM;
  AM.setWords(window.WORDS || []);
  const world = AM.stage({ brand: 'AMURA' });
  const words = AM.words(), END = R.end ?? words[words.length - 1][2] + 1.8;
  const list = [];
  const scene = (id, a, opts = {}) => { const el = make(`<div class="sc" id="${id}"></div>`, world); list.push({ id, a, ...opts }); return el; };

  /* 1. Зацепка */
  const tPhone = at(R.phoneAt);
  const s1 = scene('s1', 0); AM.dots(0, tPhone + .2);
  R.hook.forEach((l, k) => { const t0 = at(l.at), t1 = R.hook[k + 1] ? at(R.hook[k + 1].at) : tPhone;
    AM.slamWin(make(`<div class="am-big" style="top:${l.top ?? 700}px;${l.size ? 'font-size:' + l.size + 'px' : ''}">${l.html}</div>`, s1), t0, t1); });

  /* 2. Телефон с записью сайта */
  const tCta = at(R.ctaAt);
  const s2 = scene('s2', tPhone, { in: 'zoom' });
  const zw = make('<div class="ab" style="inset:0;transform-origin:540px 900px"></div>', s2);
  const ph = make('<div class="phone"><div class="scr"><img id="scr"></div><div class="isl"></div></div>', zw);
  AM.rise(ph, tPhone, .8);
  (R.zoom || []).forEach(z => AM.A(zw, [{ transform: 'scale(1) translate(0,0)' }, { transform: `scale(${z.s}) translate(${z.x || 0}px,${z.y || 0}px)`, offset: .2 }, { transform: `scale(${z.s}) translate(${z.x || 0}px,${z.y || 0}px)`, offset: .8 }, { transform: 'scale(1) translate(0,0)' }], at(z.at), at(z.to) - at(z.at), AM.E.out, 'none'));
  (R.calls || []).forEach(c => { const t0 = at(c.at), t1 = c.to ? at(c.to) : tCta;
    const n = make(`<div class="call" style="${c.side === 'r' ? 'right' : 'left'}:${c.x ?? 40}px;top:${c.y}px"><span class="am-chip${c.solid ? ' solid' : ''}">${c.text}</span></div>`, s2);
    AM.pop(n, t0); AM.A(n, [{ opacity: 1 }, { opacity: 0 }], t1 - .25, .25, 'linear', 'forwards'); });

  /* 3. Призыв: адрес оптового сайта */
  const s3 = scene('s3', tCta, { in: 'zoom' });
  const k = make('<div class="am-kick" style="top:560px">ОПТОВЫЙ САЙТ</div>', s3); AM.up(k, tCta + .05, .4, 30);
  const u = make('<div class="url"><svg width="64" height="64" viewBox="0 0 100 100"><circle cx="42" cy="42" r="26" fill="none" stroke="#16201B" stroke-width="11"/><path d="M62 62 L86 86" stroke="#16201B" stroke-width="13" stroke-linecap="round"/></svg><span></span></div>', s3);
  AM.pop(u, tCta + .2); AM.type(u.lastChild, 'opt.amura.kz', tCta + .55, .08);
  const p = make('<div class="ab" style="left:150px;right:150px;top:1060px;height:170px;border-radius:36px;background:#1F6A50;display:flex;align-items:center;gap:26px;padding:0 40px;box-shadow:0 0 0 5px #D7EA4A"><span style="font:800 76px Manrope;color:#D7EA4A">↑</span><div style="font:800 46px/1.2 Manrope">Ссылка —<br><span class="lime">в шапке профиля</span></div></div>', s3);
  const tp = at(R.profileAt); AM.pop(p, tp); AM.pulse(p, tp + .6); AM.pulse(p, tp + 1.5);

  AM.scenes(list, END); AM.background(END); AM.karaoke(words, { top: R.subsTop ?? 300 });
  window.REEL_END = END;

  /* запись сайта: время ролика → время записи (кусочно-линейно по якорям), кадр → картинка */
  const SITE = window.SITE, f0 = SITE.frames[0], ts = SITE.frames.map(x => x - f0);
  const A = R.anchors.map(([w, c]) => [typeof c === 'string' ? SITE.marks[c] : c, at(w)]).map(([c, r]) => [r, c]);
  const capT = t => { if (t <= A[0][0]) return A[0][1]; for (let i = 1; i < A.length; i++) if (t <= A[i][0]) { const [r0, c0] = A[i - 1], [r1, c1] = A[i]; return c0 + (c1 - c0) * (t - r0) / (r1 - r0); } return A[A.length - 1][1] + (t - A[A.length - 1][0]); };
  const img = document.getElementById('scr'); let cur = -1;
  const frameAt = t => { const c = Math.min(capT(t), ts[ts.length - 1]); let lo = 0, hi = ts.length - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (ts[m] <= c) lo = m; else hi = m - 1; } return lo; };
  const base = window.seek;
  window.seek = ms => { base(ms); const i = frameAt(ms / 1000); if (i === cur) return; cur = i; img.src = 'site/' + String(i + 1).padStart(5, '0') + '.jpg'; return img.decode().catch(() => {}); };
  window.seek(0);
})(window.REEL);
</script></body></html>
