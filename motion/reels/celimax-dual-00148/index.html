<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../kit/brand.css">
<style>
:root{--mid:#14513D;--deep:#0E3B2C;--bg:#0A2C21;--lime:#00FF41}
html,body{background:#0E3B2C}
#am-bg{background:radial-gradient(60% 40% at 50% 45%,#16573F 0%,#0E3B2C 50%,#072319 100%)}
#am-bar{background:#00FF41}
.sub{position:absolute;left:40px;right:40px;top:1250px;text-align:center;font:800 64px/1.15 Manrope;color:#fff;-webkit-text-stroke:9px #0b0b0b;paint-order:stroke fill;letter-spacing:-.01em;opacity:0}
.sub b{color:#FFE600}
.ylw{display:inline-block;background:#FFE600;color:#111;font:800 44px/1.15 Manrope;padding:16px 30px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.plate{position:absolute;left:60px;right:60px;border-radius:26px;background:rgba(0,0,0,.42);border:3px dashed rgba(255,255,255,.55);padding:22px 30px;font:700 34px/1.3 Manrope;color:#fff}
.plate i{font-style:normal;color:#00FF41;font-weight:800;letter-spacing:.12em;font-size:26px;display:block;margin-bottom:6px}
.big{position:absolute;left:30px;right:30px;text-align:center;font:800 150px/1 Unbounded;color:#fff;-webkit-text-stroke:12px #000;paint-order:stroke fill}
.big.g{color:#00FF41}.big.y{color:#FFE600}
.chip{position:absolute;white-space:nowrap}
.chip span{display:inline-block;background:#00FF41;color:#0E3B2C;font:800 42px Manrope;border-radius:999px;padding:14px 30px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.prod{position:absolute;background:url(toner.png) 0 0/100% 100%;filter:drop-shadow(0 40px 60px rgba(0,0,0,.55))}
.glow{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(0,255,65,.45),rgba(0,255,65,0))}
.arrow{position:absolute}
</style></head><body>
<script src="../../kit/kit.js"></script><script src="words.js"></script>
<script>
(function(){
const { make, A, E } = AM; AM.setWords([]);
const world = AM.stage({ brand: 'AMURA' });
const END = 40;
const SC = [];
const sc = (a, opt = {}) => { const id = 'sc' + SC.length; const el = make(`<div class="sc" id="${id}"></div>`, world); SC.push({ id, a, ...opt }); return el; };
const subs = make('<div class="ab" style="inset:0;z-index:5"></div>', document.body);
const sub = (html, a, b) => { const n = make(`<div class="sub">${html}</div>`, subs); n.animate([{opacity:0,transform:'scale(1.35)'},{opacity:1,transform:'scale(1)',offset:Math.min(.25,.15/(b-a))},{opacity:1,transform:'scale(1)',offset:.92},{opacity:0,transform:'scale(1)'}],{delay:a*1000,duration:(b-a)*1000,fill:'none',easing:'ease-out'}); AM.cue(a,'pop'); };
const plate = (el, html, top, t) => { const n = make(`<div class="plate" style="top:${top}px"><i>🎬 В СЪЁМКЕ</i>${html}</div>`, el); AM.up(n, t, .4, 30); return n; };
const prod = (el, h, l, t, extra = '') => make(`<div class="prod" style="left:${l}px;top:${t}px;width:${Math.round(h*1153/1551)}px;height:${h}px;${extra}"></div>`, el);
const arrowSVG = (rot) => `<svg width="190" height="120" viewBox="0 0 190 120" style="transform:rotate(${rot}deg)"><path d="M10 60 H140" stroke="#FF2D2D" stroke-width="22" stroke-linecap="round"/><path d="M120 18 L178 60 L120 102" fill="none" stroke="#FF2D2D" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const arrow = (el, x, y, rot, t) => { const n = make(`<div class="arrow" style="left:${x}px;top:${y}px">${arrowSVG(rot)}</div>`, el); AM.A(n,[{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'scale(1)'}],t,.35,E.back); AM.A(n,[{translate:'0 0'},{translate:'-18px 0'},{translate:'0 0'}],t+.35,.6,'ease-in-out','none'); AM.cue(t,'swish'); return n; };
const face = (el, x, y, s=1) => make(`<svg class="ab" style="left:${x}px;top:${y}px" width="${520*s}" height="${620*s}" viewBox="0 0 520 620">
  <path d="M90 600 C 110 470, 410 470, 430 600" fill="#1F6A50"/><rect x="215" y="420" width="90" height="80" rx="30" fill="#F2C9A8"/>
  <ellipse cx="260" cy="270" rx="185" ry="225" fill="#F6D3B5"/><path d="M75 250 C 70 80, 450 80, 445 250 C 430 150, 90 150, 75 250Z" fill="#3A2A22"/>
  <g class="eyesN"><ellipse cx="190" cy="280" rx="20" ry="24" fill="#2B2B2B"/><ellipse cx="330" cy="280" rx="20" ry="24" fill="#2B2B2B"/></g>
  <g class="eyesS" opacity="0"><path d="M160 282 L215 270 M160 268 L215 282" stroke="#2B2B2B" stroke-width="12" stroke-linecap="round"/><path d="M305 270 L360 282 M305 282 L360 268" stroke="#2B2B2B" stroke-width="12" stroke-linecap="round"/></g>
  <path class="mouthN" d="M205 380 Q260 420 315 380" fill="none" stroke="#B5574B" stroke-width="12" stroke-linecap="round"/>
  <path class="mouthS" d="M210 395 Q235 380 260 395 Q285 410 310 392" fill="none" stroke="#B5574B" stroke-width="12" stroke-linecap="round" opacity="0"/>
  <g class="dry" opacity="0"><g stroke="#E0A080" stroke-width="5"><path d="M110 330 l20 10 M120 350 l25 -5 M100 360 l18 12 M390 330 l-20 10 M400 352 l-25 -6 M415 365 l-18 12"/></g></g>
</svg>`, el);


const onT = (el, html, top, t, size=72, color='#fff') => { const n = make(`<div class="ab" style="left:40px;right:40px;top:${top}px;text-align:center;font:800 ${size}px/1.08 Unbounded;color:${color};-webkit-text-stroke:9px #000;paint-order:stroke fill">${html}</div>`, el); AM.slam(n, t, { hit: false }); return n; };
const tonikSVG = `<svg width="170" height="330" viewBox="0 0 170 330"><rect x="55" y="0" width="60" height="60" rx="10" fill="#9AA3A0"/><rect x="15" y="55" width="140" height="270" rx="30" fill="#BFD3E6"/><rect x="30" y="150" width="110" height="80" rx="8" fill="#fff"/><text x="85" y="198" font-family="Manrope" font-weight="800" font-size="24" text-anchor="middle" fill="#777">без бренда</text></svg>`;
const palmTop = (el, x, y) => make(`<svg class="ab" style="left:${x}px;top:${y}px" width="700" height="700" viewBox="0 0 700 700"><path d="M150 690 C 90 560, 80 420, 120 300 C 150 220, 250 170, 350 170 C 450 170, 560 220, 590 320 C 620 430, 610 560, 550 690 Z" fill="#F6D3B5" stroke="#E2B796" stroke-width="6"/><path d="M200 420 Q350 480 500 420" fill="none" stroke="#E6BC9C" stroke-width="5"/><path d="M220 520 Q350 570 480 520" fill="none" stroke="#E6BC9C" stroke-width="5"/></svg>`, el);
const say = (txt, a, b) => sub(txt, a, b);

/* 1. 0–2 вопрос в камеру */
let a = 0; const s1 = sc(a);
const f1 = face(s1, 160, 470, .95); const p1 = prod(s1, 520, 620, 640); AM.rise(p1, .05); AM.float(p1, .6, 2.1, 8);
onT(s1, 'Кожу стягивает<br>после умывания?', 210, .1, 70, '#FFE600');
say('Если скажу, что кожу', 0, .7); say('после умывания', .7, 1.3); say('может не стягивать — поверишь?', 1.3, 1.98);

/* 2. 2–5 обычный тоник */
a = 2; const s2 = sc(a, { in: 'whip' });
const f2 = face(s2, 280, 430); const tk = make(`<div class="ab" style="left:60px;top:700px">${tonikSVG}</div>`, s2); AM.slide(tk, a + .1, -1);
const pad = make('<div class="ab" style="left:600px;top:760px;width:110px;height:110px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.35)"></div>', s2);
AM.A(pad,[{transform:'translate(0,0)',opacity:0},{transform:'translate(0,0)',opacity:1,offset:.15},{transform:'translate(-120px,40px)',offset:.45},{transform:'translate(-20px,90px)',offset:.75},{transform:'translate(-140px,120px)',opacity:1}],a+.3,1.8,'ease-in-out','forwards');
onT(s2, 'Знакомо?', 330, a + .2, 90);
plate(s2, 'У зеркала: протирает щёку <b>обычным тоником</b> (этикетка скрыта)', 140, a + .1);
say('Обычный тоник —', a, a + 1); say('протёрла, и через минуту', a + 1, a + 2); say('снова сухо', a + 2, 4.98);

/* 3. 5–8 «стянуло» + вставка: сухой диск */
a = 5; const s3 = sc(a, { in: 'zoom' });
const f3 = face(s3, 280, 430); ['.eyesN','.mouthN'].forEach(q=>f3.querySelector(q).setAttribute('opacity','0')); ['.eyesS','.mouthS'].forEach(q=>f3.querySelector(q).setAttribute('opacity','1'));
const hand3 = make('<div class="ab" style="left:700px;top:780px;width:120px;height:170px;border-radius:60px;background:#F6D3B5;border:5px solid #E2B796"></div>', s3); AM.up(hand3, a + .2, .4, 80);
arrow(s3, 820, 560, 160, a + .4); const st3 = make('<div class="ab" style="left:700px;top:470px"><span class="ylw" style="background:#FF2D2D;color:#fff">стянуло</span></div>', s3); AM.pop(st3, a + .6);
const ins = make('<div class="ab" style="inset:0;background:#EDE3DA;display:flex;align-items:center;justify-content:center;opacity:0"><div style="width:520px;height:520px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff,#ECE6DF);box-shadow:0 30px 60px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font:800 44px Manrope;color:#8A7F76">сухой диск</div></div>', s3);
ins.animate([{opacity:1},{opacity:1}],{delay:(a+1.6)*1000,duration:1000,fill:'none'}); AM.cue(a + 1.6, 'whoosh');
say('В холод —', a + .1, a + 1.2); say('особенно', a + 1.2, 7.98);

/* 4. 8–11 вода испаряется */
a = 8; const s4 = sc(a, { in: 'zoom' });
palmTop(s4, 190, 430);
const wd = make('<div class="ab" style="left:440px;top:800px;width:200px;height:120px;border-radius:50%;background:radial-gradient(rgba(190,225,255,.9),rgba(150,200,240,.5));"></div>', s4);
AM.A(wd,[{transform:'scale(.4)',opacity:1},{transform:'scale(2.2,1.8)',opacity:.8,offset:.45},{transform:'scale(2.6,2.1)',opacity:0}],a+.3,2.4,'ease-out','forwards');
for (let k=0;k<6;k++){ const v=make(`<div class="ab" style="left:${400+k*45}px;top:760px;font:800 46px Manrope;color:rgba(255,255,255,.8)">〰</div>`, s4); AM.A(v,[{opacity:0,transform:'translateY(0)'},{opacity:1,transform:'translateY(-80px)',offset:.4},{opacity:0,transform:'translateY(-200px)'}],a+1.2+k*.12,1.2,'ease-out','none'); }
onT(s4, 'Вода → <span style="color:#FF5A5A">испарилась</span>', 330, a + .2, 62);
plate(s4, 'Крупно рука: водянистый тоник растекается и испаряется', 140, a + .1);
say('Он просто', a + .1, a + 1.3); say('испаряется', a + 1.3, 10.98);

/* 5. 11–14 «но давай заменим» */
a = 11; const s5 = sc(a, { in: 'whip' });
const tk5 = make(`<div class="ab" style="left:120px;top:700px">${tonikSVG}</div>`, s5); AM.A(tk5,[{transform:'none',opacity:1},{transform:'translateX(-500px) rotate(-30deg)',opacity:0}],a+.4,.5,'ease-in','forwards'); AM.cue(a+.4,'whoosh');
make('<div class="glow" style="left:190px;top:470px;width:700px;height:700px"></div>', s5);
const p5 = prod(s5, 760, 258, 470); AM.rise(p5, a + .6); AM.sweep(p5, a + 1.4);
const nm5 = make('<div class="ab" style="left:0;right:0;top:300px;text-align:center"><span class="ylw" style="font-size:50px">Celimax Dual Barrier<br>Creamy Toner</span></div>', s5); AM.pop(nm5, a + 1.0);
say('Но давай', a + .1, a + 1.3); say('заменим', a + 1.3, 13.98);

/* 6. 14–18 молочная текстура */
a = 14; const s6 = sc(a, { in: 'zoom' });
palmTop(s6, 190, 430);
const cd = make('<div class="ab" style="left:430px;top:770px;width:220px;height:150px;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 38% 30%,#fff,#F3EEE6 60%,#E3DBCF);box-shadow:0 14px 26px rgba(0,0,0,.18)"></div>', s6);
AM.A(cd,[{transform:'scale(.2) translateY(-300px)',opacity:0},{transform:'scale(1.05)',opacity:1,offset:.7},{transform:'scale(1)',opacity:1}],a+.3,.7,E.back); AM.cue(a+.9,'drop');
const hl = make('<div class="ab" style="left:485px;top:790px;width:60px;height:26px;border-radius:50%;background:#fff;opacity:.9"></div>', s6); AM.fade(hl, a + 1);
onT(s6, 'Молочная текстура', 330, a + .2, 66, '#fff');
plate(s6, 'Макро сверху: наливает в ладонь — капля держит форму', 140, a + .1);
say('Смотри, он не водянистый —', a + .1, a + 2); say('он кремовый', a + 2, 17.98);

/* 7. 18–24 наносит, похлопывает */
a = 18; const s7 = sc(a, { in: 'zoom' });
const f7 = face(s7, 280, 430);
const hl7 = make('<div class="ab" style="left:250px;top:720px;width:130px;height:190px;border-radius:65px;background:#F6D3B5;border:5px solid #E2B796"></div>', s7);
const hr7 = make('<div class="ab" style="left:700px;top:720px;width:130px;height:190px;border-radius:65px;background:#F6D3B5;border:5px solid #E2B796"></div>', s7);
[hl7,hr7].forEach((h,k)=>{ AM.up(h, a + .2, .4, 100); for(let j=0;j<6;j++) AM.A(h,[{translate:'0 0'},{translate:`${k?-30:30}px 0`},{translate:'0 0'}],a+.8+j*.5,.3,'ease-in-out','none'); });
const gl7 = make('<div class="glow" style="left:240px;top:420px;width:600px;height:600px;opacity:0"></div>', s7); AM.A(gl7,[{opacity:0},{opacity:.7}],a+3.5,.8,'ease-out','forwards');
const c71 = make('<div class="chip" style="left:60px;top:300px;margin-top:60px"><span>⚡ Впитывается быстро</span></div>', s7); AM.pop(c71, a + 1.4);
const c72 = make('<div class="chip" style="right:60px;top:440px"><span>✋ Не липнет</span></div>', s7); AM.pop(c72, a + 3.2);
plate(s7, 'Наносит на лицо, похлопывает ладонями; крупно щека — мягкая, ровная', 140, a + .1);
say('Похлопываю —', a + .2, a + 1.6); say('и он впитывается,', a + 1.6, a + 3.4); say('без липкости', a + 3.4, 23.98);

/* 8. 24–28 состав */
a = 24; const s8 = sc(a, { in: 'zoom' });
const p8 = prod(s8, 940, 110, 440); AM.A(p8,[{opacity:0,transform:'scale(.85)'},{opacity:1,transform:'none'}],a,.5,E.out);
const fg = make('<div class="ab" style="left:420px;top:1000px;font:800 120px Manrope;transform:rotate(-30deg)">👆</div>', s8); AM.up(fg, a + .6, .5, 120);
const ing = make('<div class="ab" style="left:60px;right:60px;top:320px;text-align:center"><span class="ylw" style="font-size:44px">5 видов церамидов<br>+ гиалуронат натрия</span></div>', s8); AM.pop(ing, a + .4);
plate(s8, 'Крупно состав на флаконе, палец показывает на строку', 140, a + .1);
say('Внутри пять видов церамидов —', a + .1, a + 2); say('для защитного барьера', a + 2, a + 3.1); say('и увлажнения', a + 3.1, 27.98);

/* 9. 28–33 тест 1 минута */
a = 28; const s9 = sc(a, { in: 'wipe' });
const hb = make(`<svg class="ab" style="left:140px;top:520px" width="800" height="600" viewBox="0 0 800 600"><path d="M20 560 C 40 300, 140 120, 400 110 C 660 120, 760 300, 780 560 Z" fill="#F6D3B5" stroke="#E2B796" stroke-width="6"/><line x1="400" y1="130" x2="400" y2="560" stroke="#0E3B2C" stroke-width="8" stroke-dasharray="22 16"/>
<ellipse class="L" cx="250" cy="380" rx="110" ry="80" fill="rgba(170,215,250,.85)"/><ellipse class="R" cx="550" cy="380" rx="110" ry="80" fill="#FFFDF5"/></svg>`, s9);
AM.fade(hb, a + .05);
const lb = (t, x, bg) => make(`<div class="ab" style="left:${x}px;top:1130px;width:400px;text-align:center"><span class="ylw" style="font-size:38px;${bg}">${t}</span></div>`, s9);
AM.pop(lb('обычный', 140, 'background:#fff'), a + .3); AM.pop(lb('Dual', 540, ''), a + .5);
const timer = make(`<div class="ab" style="left:350px;top:330px;width:380px;height:150px;border-radius:30px;background:#000;border:6px solid #00FF41;display:flex;align-items:center;justify-content:center;font:800 92px Unbounded;color:#00FF41"><span style="margin-right:14px">⏱</span><span class="tm" style="position:relative;display:block;width:250px;height:110px"></span></div>`, s9);
AM.pop(timer, a + .6);
const tm = timer.querySelector('.tm');
for (let k = 0; k <= 12; k++) { const v = 60 - k * 5, sp = make(`<span style="position:absolute;left:0;top:0;opacity:0">${v === 60 ? '1:00' : '0:' + String(v).padStart(2,'0')}</span>`, tm); const t0 = a + .8 + k * .17; sp.animate([{opacity:1},{opacity:1}],{delay:t0*1000,duration:(k===12?99:.17)*1000,fill:'none'}); AM.cue(t0,'tick'); }
const tEnd = a + .8 + 12 * .17;
const L = hb.querySelector('.L'), Rr = hb.querySelector('.R');
AM.A(L,[{opacity:1},{opacity:.15}],a+.8,2.0,'ease-in','forwards'); AM.A(Rr,[{opacity:1},{opacity:0}],a+.8,2.0,'ease-in','forwards');
const nap = make('<div class="ab" style="left:600px;top:700px;width:180px;height:180px;background:#fff;border-radius:10px;box-shadow:0 10px 24px rgba(0,0,0,.3);transform:rotate(8deg);opacity:0"></div>', s9);
AM.A(nap,[{opacity:0,transform:'translateY(-200px) rotate(8deg)'},{opacity:1,transform:'translateY(0) rotate(8deg)',offset:.5},{opacity:1,transform:'translateY(-220px) rotate(8deg)'}],tEnd+.3,1.1,'ease-in-out','forwards');
const dry = make('<div class="ab" style="left:200px;top:640px"><span class="ylw" style="background:#FF2D2D;color:#fff;font-size:36px">сухо</span></div>', s9); AM.pop(dry, tEnd + .1);
const soft = make('<div class="ab" style="left:560px;top:640px"><span class="ylw" style="background:#00FF41;color:#0E3B2C;font-size:36px">мягко, не липнет ✓</span></div>', s9); AM.pop(soft, tEnd + 1.3);
plate(s9, 'Сверху тыльная сторона ладони: слева обычный тоник, справа Dual. Таймер 1 мин, потом салфетка', 140, a + .1);
say('Через минуту:', a + .2, a + 2); say('тут сухо —', tEnd + .05, tEnd + 1.2); say('а тут мягко и не липнет', tEnd + 1.2, 32.98);

/* 10. 33–37 «А мне подойдёт?» */
a = 33; const s10 = sc(a, { in: 'whip' });
const q = make('<div class="ab" style="left:80px;top:300px;max-width:700px;background:#fff;color:#111;border-radius:40px 40px 40px 8px;padding:28px 40px;font:800 60px Manrope;box-shadow:0 14px 30px rgba(0,0,0,.35)">А мне подойдёт?</div>', s10); AM.pop(q, a + .1);
const p10 = prod(s10, 560, 560, 540); AM.rise(p10, a + .3);
[['сухая',540],['чувствительная',650],['обезвоженная',760],['отдельно или под крем',900]].forEach(([t,y],k)=>{ const n=make(`<div class="chip" style="left:60px;top:${y}px"><span${k===3?' style="background:#FFE600;color:#111"':''}>${t}</span></div>`, s10); AM.slide(n, a + 1 + k*.55, -1); });
plate(s10, 'Коллега за кадром спрашивает, ведущая отвечает в камеру', 140, a + .1);
say('Для сухой, чувствительной', a + .5, a + 1.9); say('и обезвоженной кожи', a + 1.9, a + 2.9); say('Можно отдельно или под крем', a + 2.9, 36.98);

/* 11. 37–40 призыв */
a = 37; const s11 = sc(a, { in: 'zoom' });
const p11 = prod(s11, 520, 60, 360); AM.rise(p11, a); AM.float(p11, a + .7, END, 10);
const bag = make(`<svg class="ab" style="left:700px;top:520px" width="300" height="360" viewBox="0 0 300 360"><path d="M100 80 Q100 20 150 20 Q200 20 200 80" fill="none" stroke="#0E3B2C" stroke-width="12"/><rect x="20" y="80" width="260" height="270" rx="16" fill="#F4EFE6"/><text x="150" y="230" font-family="Unbounded" font-weight="800" font-size="46" text-anchor="middle" fill="#0E3B2C">AMURA</text></svg>`, s11); AM.pop(bag, a + .4);
const u = make('<div class="ab" style="left:60px;right:60px;top:250px;text-align:center"><div style="font:800 40px Manrope;color:#00FF41;letter-spacing:.14em">ЗАКАЖИ НА</div><div style="font:800 110px/1.05 Unbounded">amura.kz</div></div>', s11); AM.up(u, a + .2, .45, 40);
const art = make('<div class="ab" style="left:700px;top:910px"><span class="ylw" style="font-size:36px">арт. 00148</span></div>', s11); AM.pop(art, a + .9);
