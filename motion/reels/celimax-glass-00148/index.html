<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../../glass/glass.css">
<!-- Celimax Dual Barrier Creamy Toner, арт. 00148 — стиль AMURA Glass. Факты — из описания catalog.json. Цену не показываем.
     Фото: python3 motion/reels/celimax-glass-00148/prep.py → product.png. Рендер: node motion/glass/render.js motion/reels/celimax-glass-00148 -->
</head><body>
<script src="../../glass/glass.js"></script>
<script>
(function(){
const { A, make, show, type, caret, cue, E } = G;
const END = 13.2, PR = 1134 / 1400;
G.bg(END);

/* 0–3.2: печать хука по центру */
const hook = make('<div class="g-type" style="top:800px"></div>');
const tEnd = type(hook, 'Кожу стягивает<br>после умывания?', .35, .065);
const cr = make('<span class="g-caret"></span>', hook); cr.style.opacity = 0; caret(cr, tEnd, 3.2); A(cr, [{ visibility: 'visible' }, { visibility: 'hidden' }], 3.2, .01, 'linear', 'forwards');
A(hook, [{ transform: 'none', top: '800px' }, { transform: 'scale(.62)', top: '250px' }], 3.2, .6, E.io, 'forwards');
A(hook, [{ opacity: 1 }, { opacity: 0 }], 9.6, .4, E.out, 'forwards');

/* стеклянная карточка: появляется (динь) → вытягивается в список → сжимается в таблетку */
const card = make('<div class="glass" style="left:160px;top:520px;width:760px;height:980px;opacity:0"></div>');
A(card, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], 3.3, .6, E.back); cue(3.3, 'ding');
A(card, [{ left: '160px', top: '520px', width: '760px', height: '980px', borderRadius: '56px' }, { left: '80px', top: '620px', width: '920px', height: '700px', borderRadius: '56px' }], 6.0, .55, E.io, 'forwards'); cue(6.0, 'whoosh');
A(card, [{ left: '80px', top: '620px', width: '920px', height: '700px', borderRadius: '56px' }, { left: '170px', top: '880px', width: '740px', height: '160px', borderRadius: '80px' }], 9.7, .55, E.io, 'forwards'); cue(9.7, 'whoosh');

/* 1) товар */
const s1 = make('<div class="ab" style="left:160px;top:520px;width:760px;height:980px;opacity:0"></div>');
const H = 600, ph = make(`<div class="ab" style="left:${380 - H * PR / 2}px;top:70px;width:${Math.round(H * PR)}px;height:${H}px;background:url(product.png) 0 0/100% 100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))"></div>`, s1);
make('<div class="ab" style="left:40px;right:40px;top:705px;text-align:center;font:700 50px/1.12 Inter,sans-serif;letter-spacing:-.01em">Celimax Dual Barrier<br>Creamy Toner</div>', s1);
make('<div class="ab g-small" style="left:40px;right:40px;top:845px;text-align:center">кремовый тонер · 150 мл</div>', s1);
show(s1, 3.45, 6.05, .25);
A(ph, [{ transform: 'translateY(40px) scale(.92)' }, { transform: 'none' }], 3.4, .8, E.out);

/* 2) список 1–2–3 */
const s2 = make('<div class="ab" style="left:80px;top:620px;width:920px;height:700px;padding:70px 70px;opacity:0"></div>');
make(`<div style="display:flex;align-items:center;gap:30px;margin-bottom:56px"><div style="width:120px;height:150px;background:url(product.png) 0 0/100% 100%;flex:none"></div>
  <div><div style="font:700 44px/1.1 Inter,sans-serif">Celimax Dual Barrier</div><div class="g-small" style="margin-top:8px">Creamy Toner · 150 мл</div></div></div>`, s2);
const items = ['5 видов церамидов', 'Молочная текстура', 'Без липкости'];
items.forEach((txt, i) => { const r = make(`<div class="g-item" style="margin-top:${i ? 44 : 0}px;opacity:0"><div class="g-num">${i + 1}</div><div>${txt}</div></div>`, s2);
  const t = 6.7 + i * .8; A(r, [{ opacity: 0, transform: 'translateY(26px)' }, { opacity: 1, transform: 'none' }], t, .45, E.back, 'forwards'); cue(t, 'ping'); });
show(s2, 6.35, 9.75, .25);

/* 3) таблетка: AMURA + amura.kz · арт. 00148 */
const s3 = make('<div class="ab" style="left:170px;top:880px;width:740px;height:160px;display:flex;align-items:center;gap:28px;padding:0 30px;opacity:0"></div>');
make('<div style="flex:none;width:108px;height:108px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:800 48px Inter,sans-serif;background:linear-gradient(160deg,#f2f4f6,#9aa0a8);color:#15171a;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6)">A</div>', s3);
make('<div><div style="font:700 46px/1.1 Inter,sans-serif">AMURA</div><div class="g-small" style="margin-top:6px">amura.kz · арт. 00148</div></div>', s3);
A(s3, [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'none' }], 10.15, .4, E.back, 'forwards'); cue(10.15, 'pop');
const lk = make('<div class="ab g-small" style="left:0;right:0;top:1080px;text-align:center;opacity:0">ссылка на магазин — в шапке профиля</div>');
A(lk, [{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }], 10.8, .5, E.out, 'forwards');

window.REEL_END = END;
})();
</script></body></html>
