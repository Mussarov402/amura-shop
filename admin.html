<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="theme-color" content="#0E3B2C"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AMURA"><title>Панель AMURA</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0E3B2C;--bg:#F4F5F3;--line:#E1E6E2;--mut:#5C6B63;--ok:#0E5A3A;--okbg:#DDF1E6;--warn:#7A4B00;--warnbg:#FCEBC8;--bad:#8A1C1C;--badbg:#F9DADA}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color:#16201B;background:var(--bg);-webkit-font-smoothing:antialiased}
.logo,.mtop span,h1{font-family:"Unbounded","Manrope",system-ui,sans-serif}h1{font-weight:500;font-size:clamp(21px,3.4vw,26px)}.logo small{font-family:"Manrope",system-ui,sans-serif}
.app{display:flex;min-height:100vh}aside{width:230px;flex:none;background:var(--g);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px}
.logo{font-size:22px;font-weight:700;letter-spacing:.04em;padding:0 14px 18px}.logo small{display:block;font-size:11px;font-weight:500;letter-spacing:0;color:#A9C3B7}
aside button.nav{all:unset;cursor:pointer;display:block;padding:11px 14px;border-radius:10px;color:#B7CCC2;font-size:15px}
aside button.nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
aside .soon{padding:11px 14px;color:#6F8C7F;font-size:14px}aside .note{margin-top:auto;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.08);font-size:12.5px;line-height:1.4;color:#B7CCC2}
main{flex:1;min-width:0;padding:28px 34px}h1{margin:0}.sub{color:var(--mut);font-size:14px;margin:4px 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}.card .l{font-size:13px;color:var(--mut)}.card .v{font-size:30px;font-weight:700;margin-top:6px}.card .s{font-size:12.5px;color:var(--mut);margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EEF1EE}.row:first-child{border-top:0}.grow{flex:1;min-width:0}
.b{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}.b.ok{color:var(--ok);background:var(--okbg)}.b.w{color:var(--warn);background:var(--warnbg)}.b.x{color:var(--bad);background:var(--badbg)}.b.n{color:#4A4F4C;background:#E7EAE8}
.btn{border:0;border-radius:10px;padding:11px 20px;font:700 14.5px inherit;font-family:inherit;background:var(--g);color:#fff;cursor:pointer}.btn.sm{padding:8px 12px;font-size:13px}.btn.ghost{background:#fff;color:#16201B;border:1px solid #D5DCD7}
input,textarea,select{font-family:inherit}input,textarea{font:15px inherit;font-family:inherit;padding:12px 14px;border:1px solid #CBD4CE;border-radius:10px;width:100%}textarea{min-height:240px;resize:vertical}
.sw{width:44px;height:24px;border-radius:99px;background:#C9D1CC;position:relative;border:0;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--g)}.sw.on::after{left:22px}
.ord{padding:12px 0;border-top:1px solid #EEF1EE}.ord:first-child{border-top:0}.o1,.o2,.o3{display:flex;align-items:center;gap:10px}.o2,.o3{margin-top:4px}.o2 .cl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.o3{font-size:13px;justify-content:space-between}.o3 a{color:var(--g);font-weight:700}
.seg{display:inline-flex;background:#E7EAE8;border-radius:12px;padding:4px;margin-bottom:16px;gap:4px}.seg button{border:0;background:transparent;padding:9px 16px;border-radius:9px;font:700 14px inherit;font-family:inherit;color:#4A4F4C;cursor:pointer}.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ibx{display:grid;grid-template-columns:320px 1fr;gap:14px}.cv{padding:12px 14px;border-top:1px solid #EEF1EE;cursor:pointer}.cv:first-child{border-top:0}.cv.on{background:#F1F6F3}
.bub{max-width:80%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}.bub .who{font-size:11.5px;font-weight:700;opacity:.7;margin-bottom:2px}
.bub.client{align-self:flex-start;background:#EEF1EE}.bub.ai{align-self:flex-end;background:#E1EEE7}.bub.manager{align-self:flex-end;background:#0E3B2C;color:#fff}.back{display:none}
@media(max-width:800px){.ibx{grid-template-columns:1fr}.ibx.chat #il{display:none}.ibx:not(.chat) #ic{display:none}.back{display:inline-block}.bub{max-width:90%}}
.mut{color:var(--mut);font-size:13px}.num{text-align:right;width:84px;flex:none;font-size:14px}.hid{opacity:.55}
#login{max-width:420px;margin:15vh auto;font-size:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
.tabbar,.mtop{display:none}.mtop{order:-1}
@media(max-width:800px){.app{flex-direction:column}aside{display:none}main{padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}.num.h{display:none}
.mtop{position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;background:var(--g);color:#fff;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;font-weight:700;letter-spacing:.04em}.mtop a{color:#B7CCC2;font-size:13px;font-weight:500;letter-spacing:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:#173A2A;border-radius:22px 22px 0 0;padding:10px 4px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(8,25,18,.22)}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:4px;color:rgba(233,241,236,.55);font:700 11.5px inherit;font-family:inherit;padding:4px 0;cursor:pointer}.tabbar button.on{color:#fff}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}}
@media(max-width:800px){html,body{background:#0E3B2C}.app{background:var(--bg)}}
</style></head><body>
<div id="login" hidden><div class="logo" style="color:var(--g)">AMURA<small style="color:var(--mut)">панель управления</small></div>
<p class="mut">Вход только для владельца: подтвердите его в Telegram.</p><button class="btn" id="go">Войти через Telegram</button><p class="mut" id="lmsg"></p></div>
<div class="app" id="app" hidden><aside><div class="logo">AMURA<small>панель сайта</small></div>
<button class="nav on" data-p="overview">Обзор</button><button class="nav" data-p="products">Товары на сайте</button><button class="nav" data-p="orders">Заказы</button><button class="nav" data-p="inbox">Сообщения</button><button class="nav" data-p="ai">ИИ-продажник</button>
<div class="soon">Каналы — скоро</div>
<div class="note">Склад и цены ведутся в МойСклад. Панель показывает, что видит сайт, и управляет настройками.<br><br><a href="#" id="out" style="color:#fff">Выйти</a></div></aside>
<div class="mtop"><span>AMURA · панель</span><a href="#" id="out2">Выйти</a></div><main id="main"></main><nav class="tabbar" aria-label="Разделы"><button data-p="overview" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Обзор</button><button data-p="products"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Товары</button><button data-p="orders"><svg viewBox="0 0 24 24"><path d="M6 3h12l2 4v13a1 1 0 01-1 1H5a1 1 0 01-1-1V7z"/><path d="M4 7h16M9 11a3 3 0 006 0"/></svg>Заказы</button><button data-p="inbox"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>Сообщения</button><button data-p="ai"><svg viewBox="0 0 24 24"><rect x="4" y="7" width="16" height="12" rx="3"/><path d="M12 7V4M9 12v1.5M15 12v1.5"/></svg>ИИ</button></nav></div>
<script>
if(/github\.io$/.test(location.hostname)){location.replace("https://amura-shop-api.onrender.com/admin");}   // панель живёт на сервере, а не на GitHub Pages
const $=s=>document.querySelector(s),T="amura_admin";let tok=localStorage.getItem(T)||"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("ru-RU").replace(/ /g," ");
async function api(p,o={}){const r=await fetch("/admin/api/"+p,{...o,headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok}});
 if(r.status===401){localStorage.removeItem(T);tok="";boot();throw Error("401")}const j=await r.json();if(!j.ok)throw Error(j.error||"Ошибка");return j}
function boot(){const a=!!tok;$("#login").hidden=a;$("#app").hidden=!a;if(a)show(cur)}
$("#go").onclick=async()=>{const b=$("#go");b.disabled=true;$("#lmsg").textContent="Открываю Telegram…";
 try{const r=await fetch("/admin/api/login",{method:"POST"}).then(r=>r.json());if(!r.ok)throw Error(r.error);window.open(r.link,"_blank");
  $("#lmsg").textContent="Нажмите Start в боте — вход откроется сам.";
  for(let i=0;i<150;i++){await new Promise(r=>setTimeout(r,2000));const p=await fetch("/admin/api/login/poll?nonce="+r.nonce).then(r=>r.json());
   if(p.token){tok=p.token;localStorage.setItem(T,tok);return boot()}if(!p.ok)break}$("#lmsg").textContent="Время вышло, попробуйте ещё раз."}
 catch(e){$("#lmsg").textContent=e.message}b.disabled=false};
$("#out").onclick=$("#out2").onclick=e=>{e.preventDefault();localStorage.removeItem(T);tok="";boot()};
let cur="overview";document.querySelectorAll(".nav,.tabbar button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav,.tabbar button").forEach(x=>x.classList.toggle("on",x.dataset.p===b.dataset.p));scrollTo(0,0);show(b.dataset.p)});
const SEG={products:[["products","Товары"],["banners","Баннеры на главной"]],overview:[["overview","Состояние"],["pay","Оплата и реквизиты"]]};
const seg=a=>{const g=SEG[a==="banners"?"products":a==="pay"?"overview":a];return `<div class="seg">${g.map(([k,t])=>`<button class="${k===a?"on":""}" data-go="${k}">${t}</button>`).join("")}</div>`};
const bindSeg=()=>document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>show(b.dataset.go));
const head=(t,s)=>`<h1>${t}</h1><div class="sub">${s}</div>`;
let timer=null;
async function show(p){clearInterval(timer);cur=p;$("#main").innerHTML='<div class="mut">Загрузка…</div>';try{await views[p]()}catch(e){if(e.message!=="401")$("#main").innerHTML=`<div class="b x">${esc(e.message)}</div>`}}
const badge=(ok,a="Работает",b="Сбой")=>`<span class="b ${ok?"ok":"x"}">${ok?a:b}</span>`;
const views={
async overview(){const o=await api("overview");$("#main").innerHTML=head("Обзор","Данные с живого сайта")+seg("overview")+`
<div class="cards"><div class="card"><div class="l">Товаров на сайте</div><div class="v">${o.products}</div><div class="s">скрыто вручную: ${o.hidden}</div></div>
<div class="card"><div class="l">Заказов сегодня</div><div class="v">${o.ordersToday}</div><div class="s">на ${fmt(o.sumToday)} ₸</div></div>
<div class="card"><div class="l">Каталог обновлён</div><div class="v" style="font-size:20px">${esc(o.catalogUpdated)||"—"}</div><div class="s">выгрузка: ${esc(o.siteUpdated)||"—"}</div></div></div>
<div class="card"><div style="font-size:17px;font-weight:700;margin-bottom:6px">Связь</div>
<div class="row"><div class="grow"><b>МойСклад</b><div class="mut">ответ за ${o.msSec} с</div></div>${badge(o.msOk)}</div>
<div class="row"><div class="grow"><b>Оповещения в Telegram</b></div>${badge(o.tgOk,"Настроено","Не настроено")}</div>
<div class="row"><div class="grow"><b>Вход по SMS</b></div>${badge(o.sms,"Подключён","Не подключён")}</div></div>`;bindSeg()},
async orders(){const o=await api("orders");const st=s=>/оплач/i.test(s)&&!/ждё|не /i.test(s)?"ok":/нов|ждё/i.test(s)?"w":"n";
 $("#main").innerHTML=head("Заказы с сайта","Заказы создаются в МойСклад; последние 30")+`<div class="card">`+o.orders.map(x=>`<div class="ord"><div class="o1"><b>№${esc(x.number)}</b><span class="mut">${esc(x.moment.replace("T"," ").slice(5))}</span><span class="b ${st(x.state)}" style="margin-left:auto">${esc(x.state)}</span></div><div class="o2"><span class="cl">${esc(x.client)}</span><b>${fmt(x.sum)} ₸</b></div><div class="o3"><span class="mut">${esc(x.ship)||"&nbsp;"}</span><a href="${esc(x.pdf)}" target="_blank">PDF</a></div></div>`).join("")+`</div>`},
async products(q="",brand="",page=0){const size=+(localStorage.getItem("amura_psize")||100);const [o,bs]=await Promise.all([api("products?q="+encodeURIComponent(q)+"&brand="+encodeURIComponent(brand)+"&size="+size+"&offset="+page*size),api("brands")]);const pages=Math.max(1,Math.ceil(o.total/size));
 const cb=brand?bs.brands.find(b=>b.brand===brand):null;
 $("#main").innerHTML=head("Товары на сайте","Цены и остатки идут из МойСклад. Здесь только видимость.")+seg("products")+`<div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap"><select id="br" style="padding:12px;border:1px solid #CBD4CE;border-radius:10px;font:15px inherit;background:#fff"><option value="">Все бренды (${bs.brands.length})</option>${bs.brands.map(b=>`<option value="${esc(b.brand)}" ${b.brand===brand?"selected":""}>${esc(b.brand)} — ${b.total}${b.hidden?`, скрыто ${b.hidden}`:""}</option>`).join("")}</select><input id="q" placeholder="Поиск по названию, бренду, коду" value="${esc(q)}" style="flex:1;min-width:200px"></div>
 ${cb?`<div class="card" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b style="flex:1">${esc(cb.brand)}: ${cb.total} тов., скрыто ${cb.hidden}</b><button class="btn ghost" id="bh">Скрыть весь бренд</button><button class="btn" id="bs">Показать весь бренд</button></div>`:""}
 <div class="card"><div class="mut" style="margin-bottom:6px">Найдено: ${o.total} · скрыто всего: ${o.hiddenTotal}</div>`+
 o.items.map(i=>`<div class="row ${i.hidden?"hid":""}"><span class="mut" style="width:56px">${esc(i.code)}</span><div class="grow"><b>${esc(i.name)}</b><div class="mut">${esc(i.brand)}</div></div><span class="num h">${i.qty} шт</span><span class="num h">${fmt(i.rtl)}</span><span class="num h">${fmt(i.opt)}</span><button class="sw ${i.hidden?"":"on"}" data-id="${i.id}" title="Показывать на сайте"></button></div>`).join("")+`</div>
 <div style="display:flex;gap:10px;align-items:center;margin:14px 0;flex-wrap:wrap"><button class="btn ghost" id="pp" ${page<1?"disabled":""}>← Назад</button><span>Страница ${page+1} из ${pages}</span><button class="btn ghost" id="pn" ${page+1>=pages?"disabled":""}>Вперёд →</button><span style="flex:1"></span><span class="mut">На странице:</span><select id="ps" style="padding:10px;border:1px solid #CBD4CE;border-radius:10px;background:#fff"><option ${size==100?"selected":""}>100</option><option ${size==200?"selected":""}>200</option></select></div>
 <div class="mut" style="margin-top:10px">Колонки: остаток, розница, опт. Выключенный переключатель скрывает товар с сайта (до 1–2 минут).</div>`;
 bindSeg();
 const re=()=>views.products($("#q").value,$("#br").value);
 $("#br").onchange=()=>views.products("",$("#br").value);
 $("#pp").onclick=()=>{views.products(q,brand,page-1);scrollTo(0,0)};$("#pn").onclick=()=>{views.products(q,brand,page+1);scrollTo(0,0)};
 $("#ps").onchange=e=>{localStorage.setItem("amura_psize",e.target.value);views.products(q,brand,0)};
 let t;$("#q").oninput=()=>{clearTimeout(t);t=setTimeout(()=>re().then(()=>{const i=$("#q");i.focus();i.setSelectionRange(99,99)}),400)};
 const bulk=async h=>{if(!confirm((h?"Скрыть":"Показать")+" все товары бренда «"+brand+"» на сайте?"))return;$("#main").innerHTML='<div class="mut">Применяю…</div>';try{await api("brands/hidden",{method:"POST",body:JSON.stringify({brand,hidden:h})})}catch(e){alert(e.message)}views.products("",brand)};
 if(cb){$("#bh").onclick=()=>bulk(true);$("#bs").onclick=()=>bulk(false)}
 document.querySelectorAll(".sw").forEach(b=>b.onclick=async()=>{const on=b.classList.contains("on");b.disabled=true;try{await api(`products/${b.dataset.id}/hidden`,{method:"POST",body:JSON.stringify({hidden:on})});b.classList.toggle("on");b.closest(".row").classList.toggle("hid",on)}catch(e){alert(e.message)}b.disabled=false})},
async banners(){const d=await api("banners");let S=d.slides,sec=d.autoplaySec;
 const draw=()=>{$("#main").innerHTML=head("Баннеры на главной","Карусель вверху сайта. Изменения видны на сайте в течение минуты.")+seg("banners")+`<div style="display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap"><button class="btn" id="add" ${S.length>=8?"disabled":""}>+ Добавить баннер</button><span class="mut">Листать каждые</span><input id="sec" type="number" min="3" max="20" value="${sec}" style="width:80px"><span class="mut">сек · до 8 баннеров</span><span style="flex:1"></span><button class="btn" id="save">Сохранить и опубликовать</button><span class="mut" id="m"></span></div>`+
 S.map((s,i)=>`<div class="card" style="margin-bottom:14px;${s.off?"opacity:.6":""}" data-i="${i}"><div style="display:flex;gap:16px;flex-wrap:wrap"><div style="flex:1;min-width:280px;display:grid;gap:10px">
 <input data-k="title" placeholder="Заголовок" maxlength="80" value="${esc(s.title)}"><input data-k="text" placeholder="Текст под заголовком" maxlength="200" value="${esc(s.text)}">
 <input data-k="tags" placeholder="Метки через запятую (до 4)" value="${esc((s.tags||[]).join(", "))}">
 <div style="display:flex;gap:10px"><select data-k="ltype" style="flex:1;padding:12px;border:1px solid #CBD4CE;border-radius:10px;background:#fff">${[["","Без ссылки"],["brand","Бренд"],["q","Поиск по слову"],["sort","Новинки"],["url","Своя ссылка"]].map(([v,t])=>`<option value="${v}" ${(s.link?Object.keys(s.link)[0]:"")===v?"selected":""}>${t}</option>`).join("")}</select><input data-k="lval" placeholder="Какой бренд / слово / адрес" value="${esc(s.link?(s.link.sort?"":Object.values(s.link)[0]):"")}" style="flex:2"></div>
 <div style="display:flex;gap:10px;align-items:center"><input data-k="button" placeholder="Текст кнопки (если есть ссылка)" maxlength="30" value="${esc(s.button||"")}" style="flex:1"><label class="mut">Цвет <input data-k="bg" type="color" value="${esc(s.bg||"#14503C")}" style="width:56px;padding:2px;height:44px"></label></div>
 <input data-k="img" placeholder="Картинка вместо текста: адрес https://… (необязательно)" value="${esc(s.img||"")}"></div>
 <div style="width:260px"><div style="border-radius:12px;padding:18px;min-height:130px;color:#fff;background:${esc(s.bg||"#14503C")}"><div style="font-size:18px;font-weight:700">${esc(s.title)||"Заголовок"}</div><div style="font-size:13px;margin-top:6px;opacity:.9">${esc(s.text)}</div></div>
 <div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button class="btn ghost" data-a="up">↑</button><button class="btn ghost" data-a="dn">↓</button><button class="btn ghost" data-a="off">${s.off?"Показать":"Скрыть"}</button><button class="btn ghost" data-a="del">Удалить</button></div></div></div></div>`).join("")+(S.length?"":'<div class="card mut">Баннеров нет — на сайте карусель скрыта.</div>');
 const read=()=>{sec=+$("#sec").value||6;document.querySelectorAll("[data-i]").forEach(c=>{const s=S[+c.dataset.i],g=k=>c.querySelector(`[data-k=${k}]`).value.trim(),t=g("ltype"),v=g("lval");
  Object.assign(s,{title:g("title"),text:g("text"),bg:g("bg"),button:g("button"),img:g("img"),tags:g("tags").split(",").map(x=>x.trim()).filter(Boolean),link:t==="sort"?{sort:"new"}:(t&&v?{[t]:v}:undefined)})})};
 bindSeg();$("#add").onclick=()=>{read();S.push({title:"Новый баннер",text:"",bg:"#14503C"});draw()};
 document.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{read();const i=+b.closest("[data-i]").dataset.i,a=b.dataset.a;
  if(a==="del"&&!confirm("Удалить баннер?"))return;if(a==="del")S.splice(i,1);if(a==="off")S[i].off=!S[i].off;
  if(a==="up"&&i>0)[S[i-1],S[i]]=[S[i],S[i-1]];if(a==="dn"&&i<S.length-1)[S[i+1],S[i]]=[S[i],S[i+1]];draw()});
 $("#save").onclick=async()=>{read();try{const r=await api("banners",{method:"PUT",body:JSON.stringify({autoplaySec:sec,slides:S})});S=r.slides;sec=r.autoplaySec;draw();$("#m").textContent="Сохранено ✅"}catch(e){$("#m").textContent=e.message}}};
 draw()},
async inbox(openId){const st=await api("inbox/status");let cur=openId||null;
 const when=t=>{const d=new Date(t*1000),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"}):d.toLocaleDateString("ru-RU",{day:"2-digit",month:"2-digit"})};
 const stb=s=>s==="manager"?'<span class="b w">Менеджер</span>':s==="closed"?'<span class="b n">Закрыт</span>':'<span class="b ok">ИИ</span>';
 $("#main").innerHTML=head("Сообщения","Диалоги клиентов из Telegram-бота. ИИ отвечает первым")+(st.persistent?"":'<div class="b x" style="display:block;margin-bottom:12px;border-radius:10px;padding:10px 14px;white-space:normal">База данных не подключена: диалоги пропадут при перезапуске сервера.</div>')+'<div class="ibx"><div class="card" id="il" style="padding:0;overflow:hidden"></div><div class="card" id="ic" style="padding:0;display:flex;flex-direction:column;min-height:420px"></div></div>';
 const box=$(".ibx");
 const list=async()=>{const r=await api("inbox/convs");$("#il").innerHTML=r.convs.length?r.convs.map(c=>`<div class="cv ${c.id===cur?"on":""}" data-id="${c.id}"><div style="display:flex;gap:8px;align-items:center"><b class="grow">${esc(c.name)}${c.username?` <span class="mut">@${esc(c.username)}</span>`:""}</b><span class="mut">${when(c.at)}</span></div><div style="display:flex;gap:8px;align-items:center;margin-top:4px"><span class="mut grow" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.text)}</span>${c.unread?`<span class="b x">${c.unread}</span>`:stb(c.status)}</div></div>`).join(""):'<div class="mut" style="padding:18px">Пока нет диалогов. Они появятся, когда клиент напишет боту.</div>';
  document.querySelectorAll(".cv").forEach(e=>e.onclick=()=>{cur=+e.dataset.id;open_()})};
 const open_=async()=>{box.classList.toggle("chat",!!cur);if(!cur){$("#ic").innerHTML='<div class="mut" style="padding:24px">Выберите диалог слева</div>';return}
  const r=await api("inbox/conv/"+cur);const c=r.conv;
  $("#ic").innerHTML=`<div style="padding:12px 16px;border-bottom:1px solid #EEF1EE;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn ghost sm back" id="bk">←</button><b class="grow" style="min-width:110px">${esc(c.name)}</b>${stb(c.status)}${c.status==="ai"?'<button class="btn ghost sm" data-s="manager">Взять себе</button>':'<button class="btn ghost sm" data-s="ai">Вернуть ИИ</button>'}<button class="btn ghost sm" data-s="closed">Закрыть</button></div>
  <div id="msgs" style="flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;max-height:56vh;background:#FAFBFA">${r.messages.map(m=>`<div class="bub ${m.role}"><div class="who">${m.role==="client"?esc(c.name):m.role==="ai"?"ИИ-продажник":"Менеджер"} · ${when(m.at)}</div>${m.photo?`<img src="${esc(m.photo)}" style="max-width:220px;border-radius:10px;display:block;margin:4px 0">`:""}${esc(m.text)}</div>`).join("")}</div>
  <div style="padding:12px;border-top:1px solid #EEF1EE;display:flex;gap:8px"><textarea id="tx" placeholder="Написать клиенту…" style="min-height:48px;height:48px"></textarea><button class="btn" id="sd">Отправить</button></div>`;
  const ms=$("#msgs");ms.scrollTop=ms.scrollHeight;$("#bk").onclick=()=>{cur=null;open_();list()};
  document.querySelectorAll("[data-s]").forEach(b=>b.onclick=async()=>{await api(`inbox/conv/${cur}/status`,{method:"POST",body:JSON.stringify({status:b.dataset.s})});open_();list()});
  $("#sd").onclick=async()=>{const t=$("#tx").value.trim();if(!t)return;$("#sd").disabled=true;try{await api(`inbox/conv/${cur}/send`,{method:"POST",body:JSON.stringify({text:t})})}catch(e){alert(e.message)}open_();list()}};
 await list();await open_();
 timer=setInterval(async()=>{try{await list();if(cur&&!document.activeElement?.matches("textarea")){const sc=$("#msgs"),keep=sc?sc.scrollTop:0;await open_();const s2=$("#msgs");if(s2)s2.scrollTop=keep}}catch(e){}},8000)},
async ai(){const a=await api("ai");
 $("#main").innerHTML=head("ИИ-продажник","Отвечает клиентам в Telegram по базе знаний и каталогу, сложное передаёт менеджеру")+`
 <div class="card" style="margin-bottom:14px"><div class="row"><div class="grow"><b>Ответы ИИ</b><div class="mut">Модель: ${esc(a.model)}</div></div>${a.key?`<button class="sw ${a.enabled?"on":""}" id="en"></button>`:'<span class="b x">Нет ключа OPENAI_API_KEY</span>'}</div>
 ${a.key?"":'<div class="mut" style="margin-top:8px">Добавьте ключ OpenAI в переменные сервера amura-shop-api на Render (Environment → OPENAI_API_KEY). Пока его нет, диалоги получает менеджер.</div>'}${a.persistent?"":'<div class="mut" style="margin-top:8px;color:#8A1C1C">База данных не подключена: база знаний и диалоги пропадут при перезапуске сервера.</div>'}</div>
 <div class="card" style="margin-bottom:14px"><div style="font-size:17px;font-weight:700;margin-bottom:8px">Правила и тон</div><textarea id="rl" style="min-height:200px">${esc(a.rules)}</textarea><div style="margin-top:10px;display:flex;gap:10px;align-items:center"><button class="btn" id="sr">Сохранить</button><span class="mut" id="rm"></span></div></div>
 <div class="card" style="margin-bottom:14px"><div style="display:flex;align-items:center;margin-bottom:10px"><div class="grow" style="font-size:17px;font-weight:700">База знаний · ${a.kb.length}</div><button class="btn" id="ak">+ Статья</button></div><div class="mut" style="margin-bottom:10px">Пишите как для нового продавца: условия опта, доставка, оплата, возвраты. Цены не пишите — ИИ берёт их из каталога.</div><div id="kb"></div></div>
 <div class="card"><div style="font-size:17px;font-weight:700;margin-bottom:8px">Проверить ИИ</div><div style="display:flex;gap:8px"><input id="tq" placeholder="Вопрос клиента, например: сколько стоит короб Celimax?"><button class="btn" id="tb">Спросить</button></div><div id="tr" style="margin-top:10px;white-space:pre-wrap"></div></div>`;
 const kbDraw=()=>{$("#kb").innerHTML=a.kb.map((k,i)=>`<div style="border:1px solid #E1E6E2;border-radius:12px;padding:12px;margin-bottom:10px" data-i="${i}"><input data-f="title" placeholder="Заголовок" value="${esc(k.title)}" style="margin-bottom:8px"><textarea data-f="body" style="min-height:110px" placeholder="Текст">${esc(k.body)}</textarea><div style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-a="save">Сохранить</button>${k.id?'<button class="btn ghost" data-a="del">Удалить</button>':""}<span class="mut" data-m></span></div></div>`).join("")||'<div class="mut">Статей пока нет.</div>';
  document.querySelectorAll("#kb [data-a]").forEach(b=>b.onclick=async()=>{const c=b.closest("[data-i]"),k=a.kb[+c.dataset.i];
   if(b.dataset.a==="del"){if(!confirm("Удалить статью?"))return;await api("ai/kb/"+k.id,{method:"DELETE"});return views.ai()}
   try{await api("ai/kb",{method:"POST",body:JSON.stringify({id:k.id,title:c.querySelector("[data-f=title]").value,body:c.querySelector("[data-f=body]").value})});views.ai()}catch(e){c.querySelector("[data-m]").textContent=e.message}})};
 kbDraw();$("#ak").onclick=()=>{a.kb.push({id:0,title:"",body:""});kbDraw()};
 if(a.key)$("#en").onclick=async e=>{const on=!e.target.classList.contains("on");await api("ai",{method:"PUT",body:JSON.stringify({enabled:on})});e.target.classList.toggle("on",on)};
 $("#sr").onclick=async()=>{try{await api("ai",{method:"PUT",body:JSON.stringify({rules:$("#rl").value})});$("#rm").textContent="Сохранено ✅"}catch(e){$("#rm").textContent=e.message}};
 $("#tb").onclick=async()=>{$("#tr").textContent="Думаю…";try{const r=await api("ai/test",{method:"POST",body:JSON.stringify({text:$("#tq").value})});$("#tr").textContent=r.reply+(r.handoff?"\n\n(ИИ передал бы диалог менеджеру)":"")}catch(e){$("#tr").textContent=e.message}}},
async pay(){const p=await api("pay");$("#main").innerHTML=head("Оплата и реквизиты","Это сообщение бот отправляет клиенту сразу после накладной")+seg("pay")+`<div class="card" style="max-width:640px"><textarea id="t">${esc(p.text)}</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:14px"><button class="btn" id="s">Сохранить и опубликовать</button><span class="mut" id="m">${p.at?"Изменено "+esc(p.at):""}</span></div></div>`;
