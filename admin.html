<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Панель AMURA</title>
<style>
:root{--g:#0E3B2C;--bg:#F4F5F3;--line:#E1E6E2;--mut:#5C6B63;--ok:#0E5A3A;--okbg:#DDF1E6;--warn:#7A4B00;--warnbg:#FCEBC8;--bad:#8A1C1C;--badbg:#F9DADA}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#16201B;background:var(--bg)}
.app{display:flex;min-height:100vh}aside{width:230px;flex:none;background:var(--g);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:6px}
.logo{font-size:22px;font-weight:700;letter-spacing:.04em;padding:0 14px 18px}.logo small{display:block;font-size:11px;font-weight:500;letter-spacing:0;color:#A9C3B7}
aside button.nav{all:unset;cursor:pointer;display:block;padding:11px 14px;border-radius:10px;color:#B7CCC2;font-size:15px}
aside button.nav.on{background:rgba(255,255,255,.12);color:#fff;font-weight:700}
aside .soon{padding:11px 14px;color:#6F8C7F;font-size:14px}aside .note{margin-top:auto;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.08);font-size:12.5px;line-height:1.4;color:#B7CCC2}
main{flex:1;min-width:0;padding:28px 34px}h1{margin:0;font-size:28px}.sub{color:var(--mut);font-size:14px;margin:4px 0 20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px}.card .l{font-size:13px;color:var(--mut)}.card .v{font-size:30px;font-weight:700;margin-top:6px}.card .s{font-size:12.5px;color:var(--mut);margin-top:4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #EEF1EE}.row:first-child{border-top:0}.grow{flex:1;min-width:0}
.b{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}.b.ok{color:var(--ok);background:var(--okbg)}.b.w{color:var(--warn);background:var(--warnbg)}.b.x{color:var(--bad);background:var(--badbg)}.b.n{color:#4A4F4C;background:#E7EAE8}
.btn{border:0;border-radius:10px;padding:11px 20px;font:700 14.5px inherit;font-family:inherit;background:var(--g);color:#fff;cursor:pointer}.btn.ghost{background:#fff;color:#16201B;border:1px solid #D5DCD7}
input,textarea{font:15px inherit;font-family:inherit;padding:12px 14px;border:1px solid #CBD4CE;border-radius:10px;width:100%}textarea{min-height:240px;resize:vertical}
.sw{width:44px;height:24px;border-radius:99px;background:#C9D1CC;position:relative;border:0;cursor:pointer;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--g)}.sw.on::after{left:22px}
.mut{color:var(--mut);font-size:13px}.num{text-align:right;width:84px;flex:none;font-size:14px}.hid{opacity:.55}
#login{max-width:420px;margin:15vh auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;text-align:center}
.menu{display:none}@media(max-width:800px){.app{flex-direction:column}aside{width:auto;flex-direction:row;flex-wrap:wrap;padding:12px}.logo{padding:0 8px 0 0;width:100%}aside .soon,aside .note{display:none}main{padding:18px}.num.h{display:none}}
</style></head><body>
<div id="login" hidden><div class="logo" style="color:var(--g)">AMURA<small style="color:var(--mut)">панель управления</small></div>
<p class="mut">Вход только для владельца: подтвердите его в Telegram.</p><button class="btn" id="go">Войти через Telegram</button><p class="mut" id="lmsg"></p></div>
<div class="app" id="app" hidden><aside><div class="logo">AMURA<small>панель сайта</small></div>
<button class="nav on" data-p="overview">Обзор</button><button class="nav" data-p="products">Товары на сайте</button><button class="nav" data-p="orders">Заказы</button><button class="nav" data-p="pay">Оплата и реквизиты</button>
<div class="soon">Сообщения · ИИ · Каналы — скоро</div>
<div class="note">Склад и цены ведутся в МойСклад. Панель показывает, что видит сайт, и управляет настройками.<br><br><a href="#" id="out" style="color:#fff">Выйти</a></div></aside>
<main id="main"></main></div>
<script>
const $=s=>document.querySelector(s),T="amura_admin";let tok=localStorage.getItem(T)||"";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("ru-RU").replace(/ /g," ");
async function api(p,o={}){const r=await fetch("/admin/api/"+p,{...o,headers:{"Content-Type":"application/json",Authorization:"Bearer "+tok}});
 if(r.status===401){localStorage.removeItem(T);tok="";boot();throw Error("401")}const j=await r.json();if(!j.ok)throw Error(j.error||"Ошибка");return j}
function boot(){const a=!!tok;$("#login").hidden=a;$("#app").hidden=!a;if(a)show(cur)}
$("#go").onclick=async()=>{const b=$("#go");b.disabled=true;$("#lmsg").textContent="Открываю Telegram…";
 try{const r=await fetch("/admin/api/login",{method:"POST"}).then(r=>r.json());if(!r.ok)throw Error(r.error);window.open(r.link,"_blank");
  $("#lmsg").textContent="Нажмите Start в боте — вход откроется сам.";
  for(let i=0;i<150;i++){await new Promise(r=>setTimeout(r,2000));const p=await fetch("/admin/api/login/poll?nonce="+r.nonce).then(r=>r.json());
   if(p.token){tok=p.token;localStorage.setItem(T,tok);return boot()}if(!p.ok)break}$("#lmsg").textContent="Время вышло, попробуйте ещё раз."}
 catch(e){$("#lmsg").textContent=e.message}b.disabled=false};
$("#out").onclick=e=>{e.preventDefault();localStorage.removeItem(T);tok="";boot()};
let cur="overview";document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>{document.querySelectorAll(".nav").forEach(x=>x.classList.toggle("on",x===b));show(b.dataset.p)});
const head=(t,s)=>`<h1>${t}</h1><div class="sub">${s}</div>`;
async function show(p){cur=p;$("#main").innerHTML='<div class="mut">Загрузка…</div>';try{await views[p]()}catch(e){if(e.message!=="401")$("#main").innerHTML=`<div class="b x">${esc(e.message)}</div>`}}
const badge=(ok,a="Работает",b="Сбой")=>`<span class="b ${ok?"ok":"x"}">${ok?a:b}</span>`;
const views={
async overview(){const o=await api("overview");$("#main").innerHTML=head("Обзор","Данные с живого сайта")+`
<div class="cards"><div class="card"><div class="l">Товаров на сайте</div><div class="v">${o.products}</div><div class="s">скрыто вручную: ${o.hidden}</div></div>
<div class="card"><div class="l">Заказов сегодня</div><div class="v">${o.ordersToday}</div><div class="s">на ${fmt(o.sumToday)} ₸</div></div>
<div class="card"><div class="l">Каталог обновлён</div><div class="v" style="font-size:20px">${esc(o.catalogUpdated)||"—"}</div><div class="s">выгрузка: ${esc(o.siteUpdated)||"—"}</div></div></div>
<div class="card"><div style="font-size:17px;font-weight:700;margin-bottom:6px">Связь</div>
<div class="row"><div class="grow"><b>МойСклад</b><div class="mut">ответ за ${o.msSec} с</div></div>${badge(o.msOk)}</div>
<div class="row"><div class="grow"><b>Оповещения в Telegram</b></div>${badge(o.tgOk,"Настроено","Не настроено")}</div>
<div class="row"><div class="grow"><b>Вход по SMS</b></div>${badge(o.sms,"Подключён","Не подключён")}</div></div>`},
async orders(){const o=await api("orders");const st=s=>/оплач/i.test(s)&&!/ждё|не /i.test(s)?"ok":/нов|ждё/i.test(s)?"w":"n";
 $("#main").innerHTML=head("Заказы с сайта","Заказы создаются в МойСклад; последние 50")+`<div class="card">`+o.orders.map(x=>`<div class="row"><b style="width:64px">№${esc(x.number)}</b><span class="mut" style="width:110px">${esc(x.moment.replace("T"," ").slice(5))}</span><div class="grow">${esc(x.client)}<div class="mut">${esc(x.ship)}</div></div><b>${fmt(x.sum)} ₸</b><span class="b ${st(x.state)}">${esc(x.state)}</span><a href="${esc(x.pdf)}" target="_blank">PDF</a></div>`).join("")+`</div>`},
async products(q=""){const o=await api("products?q="+encodeURIComponent(q));
 $("#main").innerHTML=head("Товары на сайте","Цены и остатки идут из МойСклад. Здесь только видимость.")+`<div class="card"><input id="q" placeholder="Поиск по названию, бренду, коду" value="${esc(q)}" style="margin-bottom:10px"><div class="mut" style="margin-bottom:6px">Найдено: ${o.total} · скрыто всего: ${o.hiddenTotal}${o.total>200?" · показаны первые 200":""}</div>`+
 o.items.map(i=>`<div class="row ${i.hidden?"hid":""}"><span class="mut" style="width:56px">${esc(i.code)}</span><div class="grow"><b>${esc(i.name)}</b><div class="mut">${esc(i.brand)}</div></div><span class="num h">${i.qty} шт</span><span class="num h">${fmt(i.rtl)}</span><span class="num h">${fmt(i.opt)}</span><button class="sw ${i.hidden?"":"on"}" data-id="${i.id}" title="Показывать на сайте"></button></div>`).join("")+`</div>
 <div class="mut" style="margin-top:10px">Колонки: остаток, розница, опт. Выключенный переключатель скрывает товар с сайта (до 1–2 минут).</div>`;
 let t;$("#q").oninput=e=>{clearTimeout(t);t=setTimeout(()=>views.products(e.target.value).then(()=>{const i=$("#q");i.focus();i.setSelectionRange(99,99)}),400)};
 document.querySelectorAll(".sw").forEach(b=>b.onclick=async()=>{const on=b.classList.contains("on");b.disabled=true;try{await api(`products/${b.dataset.id}/hidden`,{method:"POST",body:JSON.stringify({hidden:on})});b.classList.toggle("on");b.closest(".row").classList.toggle("hid",on)}catch(e){alert(e.message)}b.disabled=false})},
async pay(){const p=await api("pay");$("#main").innerHTML=head("Оплата и реквизиты","Это сообщение бот отправляет клиенту сразу после накладной")+`<div class="card" style="max-width:640px"><textarea id="t">${esc(p.text)}</textarea><div style="display:flex;gap:10px;align-items:center;margin-top:14px"><button class="btn" id="s">Сохранить и опубликовать</button><span class="mut" id="m">${p.at?"Изменено "+esc(p.at):""}</span></div></div>`;
 $("#s").onclick=async()=>{try{await api("pay",{method:"PUT",body:JSON.stringify({text:$("#t").value})});$("#m").textContent="Сохранено ✅"}catch(e){$("#m").textContent=e.message}}}};
boot();
</script></body></html>
