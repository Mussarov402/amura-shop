 $("#clb").onclick=()=>back?back():views.clients();scrollTo(0,0);
 document.querySelectorAll("[data-chat]").forEach(b=>b.onclick=()=>openLink("#inbox/"+b.dataset.chat));
 $("#cns").onclick=async()=>{$("#cnm").textContent="Сохраняю…";try{await api("clients/note",{method:"POST",body:JSON.stringify({key:r.note.key,text:$("#cnt").value})});$("#cnm").textContent="Сохранено ✓"}catch(e){$("#cnm").textContent=e.message}};
}
</script>
<script>
/* Шапка панели закреплена (fixed): отступ контента = её реальная высота */
(function(){const fix=()=>{const m=document.querySelector(".mtop");if(m&&m.offsetHeight)document.documentElement.style.setProperty("--mth",m.offsetHeight+"px")};
 addEventListener("resize",fix);addEventListener("load",fix);new MutationObserver(fix).observe(document.getElementById("app"),{attributes:true,attributeFilter:["hidden"]});if(window.ResizeObserver)new ResizeObserver(fix).observe(document.querySelector(".mtop"));setTimeout(fix,0)})();
</script>
</body></html>
