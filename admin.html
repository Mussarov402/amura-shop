   открывалась поверх панели без кнопки «Назад». Теперь — своё окно: ✕, тап по фону, свайп вниз, Esc, «Назад». */
(function(){let box=null,img=null,sy=null,dy=0,hist=false;
 const close=(fromPop)=>{if(!box||box.hidden)return;box.hidden=true;img.src="";document.documentElement.style.overflow="";
  if(hist&&!fromPop){hist=false;history.back()}hist=false};
 const open=src=>{if(!box){box=document.createElement("div");box.id="pv";
   box.innerHTML='<button class="pvx" aria-label="Закрыть">✕</button><div class="pvw"><img alt=""></div>';
   document.body.appendChild(box);img=box.querySelector("img");
   box.querySelector(".pvx").onclick=e=>{e.stopPropagation();close()};
   box.onclick=e=>{if(e.target!==img)close()};
   img.onclick=e=>{e.stopPropagation();box.classList.toggle("zm")};
   box.addEventListener("touchstart",e=>{sy=(e.touches.length===1&&!box.classList.contains("zm"))?e.touches[0].clientY:null;dy=0},{passive:true});
   box.addEventListener("touchmove",e=>{if(sy===null)return;dy=e.touches[0].clientY-sy;if(dy>0){img.style.transform=`translateY(${dy}px)`;box.style.background=`rgba(0,0,0,${Math.max(.3,.94-dy/400)})`}},{passive:true});
   box.addEventListener("touchend",()=>{if(sy===null)return;sy=null;img.style.transform="";box.style.background="";if(dy>90)close()});}
  box.classList.remove("zm");img.src=src;
  box.hidden=false;document.documentElement.style.overflow="hidden";
  try{history.pushState({pv:1},"",location.href);hist=true}catch(_){}};
 addEventListener("popstate",()=>{if(box&&!box.hidden){hist=false;close(true)}});
 addEventListener("keydown",e=>{if(e.key==="Escape")close()});
 document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a.phl");if(!a)return;e.preventDefault();open(a.getAttribute("href"))});
 const st=document.createElement("style");st.textContent=`#pv{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.94);display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}
#pv[hidden]{display:none}#pv .pvw{width:100%;height:100%;overflow:auto;display:flex;align-items:center;justify-content:center;-webkit-overflow-scrolling:touch}
#pv img{max-width:100vw;max-height:100vh;object-fit:contain;transition:transform .15s;cursor:zoom-in}
#pv.zm .pvw{display:block}#pv.zm img{max-width:none;max-height:none;cursor:zoom-out}
#pv .pvx{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:22px;line-height:44px;text-align:center;text-decoration:none;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
#pv .pvx{right:14px}`;document.head.appendChild(st);
})();
</script>
<script>
/* Просмотр PDF внутри панели: ✕ сверху, «Поделиться», свайп от края / «Назад». Страницы рисует pdf.js (на iPhone
   встроенный просмотр в окне показывает только первую страницу). */
(function(){let box,pages,ttl,cur=null,hist=false,lib=null,seq=0;
 const PJ="/admin/vendor/";
 const loadLib=()=>lib||(lib=new Promise((ok,no)=>{const sc=document.createElement("script");sc.src=PJ+"pdf.min.js";
  sc.onload=()=>{try{pdfjsLib.GlobalWorkerOptions.workerSrc=PJ+"pdf.worker.min.js";ok(pdfjsLib)}catch(e){no(e)}};sc.onerror=()=>{lib=null;no(Error("pdf.js"))};document.head.appendChild(sc)}));
 const close=fromPop=>{if(!box||box.hidden)return;box.hidden=true;seq++;pages.innerHTML="";cur=null;document.documentElement.style.overflow="";
  if(hist&&!fromPop){hist=false;history.back()}hist=false};
 const build=()=>{box=document.createElement("div");box.id="dv";
  box.innerHTML='<div class="dvb"><button class="dvx" aria-label="Закрыть">✕</button><div class="dvt"></div><button class="dvs">Поделиться</button></div><div class="dvp"></div>';
  document.body.appendChild(box);pages=box.querySelector(".dvp");ttl=box.querySelector(".dvt");
  box.querySelector(".dvx").onclick=()=>close();
  box.querySelector(".dvs").onclick=e=>{if(cur)fileAct(e.currentTarget,cur.url,cur.name,"application/pdf",true)};
  const st=document.createElement("style");st.textContent=`#dv{position:fixed;inset:0;z-index:10000;background:#2B302D;display:flex;flex-direction:column}#dv[hidden]{display:none}
#dv .dvb{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;background:#0E3B2C;color:#fff;flex:none}
#dv .dvx{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:20px;flex:none;cursor:pointer}
#dv .dvt{flex:1;min-width:0;font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#dv .dvs{border:0;border-radius:20px;background:#C9A24A;color:#fff;font:inherit;font-weight:700;font-size:13px;padding:9px 14px;flex:none;cursor:pointer}
#dv .dvp{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 8px calc(16px + env(safe-area-inset-bottom,0px));touch-action:pan-x pan-y pinch-zoom}
#dv canvas{display:block;width:100%;max-width:900px;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#dv iframe{width:100%;height:100%;border:0;background:#fff}#dv .dvm{color:#fff;text-align:center;padding:30px 10px;opacity:.85}`;document.head.appendChild(st)};
 window.openDoc=async(url,name)=>{if(!box)build();const my=++seq;cur={url,name};ttl.textContent=name||"Документ";
  pages.innerHTML='<div class="dvm">Открываю документ…</div>';box.hidden=false;document.documentElement.style.overflow="hidden";
  try{history.pushState({dv:1},"",location.href);hist=true}catch(_){}
  let f;try{f=await getFile(url,name||"doc.pdf","application/pdf")}catch(e){if(my===seq)pages.innerHTML='<div class="dvm">'+esc(e.message||"Не удалось открыть")+'</div>';return}
  try{const L=await loadLib();const doc=await L.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;if(my!==seq)return;pages.innerHTML="";
   const w=Math.min(pages.clientWidth-16,900),dpr=Math.min(window.devicePixelRatio||1,3);
   for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);if(my!==seq)return;const v0=pg.getViewport({scale:1}),v=pg.getViewport({scale:w/v0.width*dpr});
    const c=document.createElement("canvas");c.width=v.width;c.height=v.height;pages.appendChild(c);await pg.render({canvasContext:c.getContext("2d"),viewport:v}).promise}}
  catch(e){if(my!==seq)return;const fr=document.createElement("iframe");fr.src=URL.createObjectURL(f);pages.innerHTML="";pages.style.padding="0";pages.appendChild(fr)}};
 window.docOpen=()=>!!(box&&!box.hidden);
 addEventListener("popstate",()=>{if(box&&!box.hidden){hist=false;close(true)}});
 addEventListener("keydown",e=>{if(e.key==="Escape")close()});
})();
</script>
<script>
/* Свайп назад от левого края, как на iPhone: экран уезжает за пальцем. Работает только внутри раздела:
   фото / PDF → окно → чат → карточка клиента → подвкладка того же раздела. В другой раздел свайп не уводит. */
(function(){const stack=[];let back=false;
 const _show=show;show=async(p,a)=>{if(!back&&cur&&cur!==p){if(grp(cur)===grp(p)){stack.push(cur);if(stack.length>20)stack.shift()}else stack.length=0}
  else if(!back&&cur!==p)stack.length=0;back=false;return _show(p,a)};
 const vis=id=>{const e=document.getElementById(id);return e&&!e.hidden?e:null};
 const canBack=()=>!!(vis("pv")||vis("dv")||document.querySelector(".ovx")||document.body.classList.contains("inchat")||document.querySelector("#main #clb")||(stack.length&&grp(stack[stack.length-1])===grp(cur)));
 const goBack=()=>{if(vis("pv")||vis("dv")){history.back();return true}
  const ov=[...document.querySelectorAll(".ovx")].pop();if(ov){ov.remove();return true}
  if(document.body.classList.contains("inchat")){history.back();return true}
  const cb=document.querySelector("#main #clb");if(cb){cb.click();return true}
  const p=stack.pop();if(!p||grp(p)!==grp(cur)){stack.length=0;return false}back=true;show(p);return true};
 window.goBack=goBack;
 addEventListener("keydown",e=>{if(e.key!=="Escape"||vis("pv")||vis("dv"))return;const ov=[...document.querySelectorAll(".ovx")].pop();if(ov){e.preventDefault();ov.remove()}});
 const layer=()=>vis("pv")||vis("dv")||[...document.querySelectorAll(".ovx")].pop()||(document.body.classList.contains("inchat")&&document.querySelector(".ibx2.chat .ic2"))||document.getElementById("main");
 /* чат: под уезжающим чатом сразу виден список диалогов с шапкой и нижней панелью (как на iPhone), без белого экрана */
 let peek=null;const peekOn=z=>{if(!z.classList.contains("ic2"))return;peek=z.closest(".ibx2");peek.classList.add("peek");document.body.classList.remove("inchat")};
 const peekOff=keep=>{if(!peek)return;if(keep)document.body.classList.add("inchat");peek.classList.remove("peek");peek=null};
 const pst=document.createElement("style");pst.textContent=".ibx2.chat.peek .il2{display:block}";document.head.appendChild(pst);
 let sx=null,sy=0,st=0,dx=0,lock=0,el=null;const EDGE=24;
 const reset=z=>{z.style.transition="";z.style.transform="";z.style.boxShadow="";z.style.willChange=""};
 addEventListener("touchstart",e=>{sx=null;if(e.touches.length!==1)return;const t=e.touches[0];if(t.clientX>EDGE||!canBack())return;
  sx=t.clientX;sy=t.clientY;st=Date.now();dx=0;lock=0;el=layer()},{passive:true});
 addEventListener("touchmove",e=>{if(sx===null)return;const t=e.touches[0],x=t.clientX-sx,y=t.clientY-sy;
  if(!lock){if(Math.abs(y)>10&&Math.abs(y)>Math.abs(x)){sx=null;return}if(x>8){lock=1;if(el)peekOn(el)}else return}
  if(e.cancelable)e.preventDefault();dx=Math.max(0,x);
  if(el){el.style.transition="none";el.style.willChange="transform";el.style.transform=`translateX(${dx}px)`;el.style.boxShadow="-10px 0 28px rgba(0,0,0,.18)"}},{passive:false});
 const end=()=>{if(sx===null)return;sx=null;const z=el;el=null;if(!z||!lock)return;
  const W=innerWidth,v=dx/Math.max(1,Date.now()-st),ok=dx>W*.33||(v>.5&&dx>40);
  z.style.transition="transform .2s ease-out";z.style.transform=ok?`translateX(${W}px)`:"translateX(0)";
  setTimeout(()=>{if(!ok){peekOff(true);return reset(z)}if(peek){z.style.visibility="hidden";history.back();setTimeout(()=>{peekOff(false);reset(z);z.style.visibility=""},350);return}goBack();          // новый экран успевает отрисоваться, пока старый за краем
   setTimeout(()=>{if(z.id==="main"){z.style.transition="none";z.style.transform="translateX(0)";requestAnimationFrame(()=>reset(z))}else reset(z)},z.id==="main"?150:350)},ok?190:210)};
 addEventListener("touchend",end);addEventListener("touchcancel",end);
})();
</script>
<script>
/* Дашборд «Обзор»: Сегодня / Неделя / Месяц / свой период (кнопка-фильтр), стрелки ‹ › — прошлые периоды */
(function(){const LS=k=>{try{return localStorage.getItem(k)}catch(e){return null}},SS=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
 const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
 const almaty=()=>{const n=new Date(Date.now()+(5*60+new Date().getTimezoneOffset())*60000);return new Date(n.getFullYear(),n.getMonth(),n.getDate())};   // «сегодня» по Алматы
 const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
 const MON=["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"],MON1=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"],WD=["воскресенье","понедельник","вторник","среда","четверг","пятница","суббота"];
 const dm=d=>d.getDate()+" "+MON[d.getMonth()];
 let mode=LS("amura_dm")||"day",anchor=almaty(),cf=null,ct=null,seq=0,cache={};
 const range=()=>{const T=almaty();let f,t,pf,pt;
  if(mode==="day"){f=t=anchor;pf=pt=add(anchor,-1)}
  else if(mode==="week"){f=add(anchor,-((anchor.getDay()+6)%7));t=add(f,6);if(t>T)t=T;pf=add(f,-7);pt=add(t,-7)}
  else if(mode==="month"){f=new Date(anchor.getFullYear(),anchor.getMonth(),1);t=new Date(anchor.getFullYear(),anchor.getMonth()+1,0);if(t>T)t=T;
   pf=new Date(f.getFullYear(),f.getMonth()-1,1);const pl=new Date(f.getFullYear(),f.getMonth(),0);pt=add(pf,Math.round((t-f)/864e5));if(pt>pl)pt=pl}
  else{f=cf;t=ct;const n=Math.round((t-f)/864e5)+1;pt=add(f,-1);pf=add(f,-n)}
  return{f,t,pf,pt,live:t>=T}};
 const label=r=>{const cap=s=>s[0].toUpperCase()+s.slice(1);
  if(mode==="day"){const T=almaty(),y=add(T,-1),nm=+r.f===+T?"Сегодня, ":+r.f===+y?"Вчера, ":cap(WD[r.f.getDay()])+", ";return[nm+dm(r.f),"сравнение: "+WD[r.pf.getDay()]+", "+dm(r.pf)]}
  if(mode==="month")return[MON1[r.f.getMonth()]+" "+r.f.getFullYear()+(r.live?" (по "+r.t.getDate()+"-е)":""),"сравнение: "+dm(r.pf)+" – "+dm(r.pt)];
  return[dm(r.f)+" – "+dm(r.t),"сравнение: "+dm(r.pf)+" – "+dm(r.pt)]};
 const delta=(a,b,money)=>{if(!b)return a?'<span class="d up">новое</span>':"";const p=Math.round((a-b)/b*100);if(!p)return'<span class="d">0%</span>';return`<span class="d ${p>0?"up":"dn"}">${p>0?"▲":"▼"} ${Math.abs(p)}%</span>`};
 const prevWord=()=>mode==="day"?"вчера":mode==="week"?"прош. неделя":mode==="month"?"прош. месяц":"прош. период";
 window.dashDraw=async()=>{const box=document.getElementById("dash");if(!box)return;const r=range(),[l1,l2]=label(r);
  box.innerHTML=`<div class="dbbar"><div class="dbp"><div class="dbs">${[["day","Сегодня"],["week","Неделя"],["month","Месяц"]].map(([k,t])=>`<button data-m="${k}" class="${mode===k?"on":""}">${t}</button>`).join("")}</div>
   <button class="dbf ${mode==="custom"?"on":""}" aria-label="Свой период"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button></div>
   <div class="dbr"><button class="dba" data-s="-1" aria-label="Раньше">‹</button><div><b>${esc(l1)}</b><small>${esc(l2)}</small></div><button class="dba" data-s="1" aria-label="Позже" ${r.live?"disabled":""}>›</button></div></div>
   <div id="dbb"><div class="mut" style="padding:20px 0;text-align:center">Считаю…</div></div>`;
  box.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;SS("amura_dm",mode);anchor=almaty();dashDraw()});
  box.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const k=+b.dataset.s;
   if(mode==="day")anchor=add(anchor,k);else if(mode==="week")anchor=add(anchor,7*k);else if(mode==="month")anchor=new Date(anchor.getFullYear(),anchor.getMonth()+k,1);
   else{const n=Math.round((ct-cf)/864e5)+1;cf=add(cf,n*k);ct=add(ct,n*k);const T=almaty();if(ct>T){ct=T}}
   if(mode!=="custom"&&anchor>almaty())anchor=almaty();dashDraw()});
  box.querySelector(".dbf").onclick=pickRange;
  const my=++seq,key=iso(r.f)+iso(r.t)+(mode==="custom"?"":iso(r.pf)+iso(r.pt));
  try{const q="dash?from="+iso(r.f)+"&to="+iso(r.t)+(mode==="custom"?"":"&pfrom="+iso(r.pf)+"&pto="+iso(r.pt));
   const d=cache[key]&&Date.now()-cache[key].at<60000?cache[key].d:await api(q);cache[key]={d,at:Date.now()};if(my!==seq||!document.getElementById("dbb"))return;paint(d,r)}
  catch(e){if(my===seq&&e.message!=="stale"&&document.getElementById("dbb"))$("#dbb").innerHTML=`<div class="b x" style="white-space:normal">${esc(e.message)}</div>`}};
 function pickRange(){const r=range(),ov=document.createElement("div");ov.className="ovx";ov.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9998;display:flex;align-items:flex-end;justify-content:center";
  const T=almaty();ov.innerHTML=`<div class="eo vo dbm"><div class="voh"><div style="font-weight:800;font-size:18px">Свой период</div><button class="vox" aria-label="Закрыть">✕</button></div>
   <div class="dbq">${[["Вчера",-1,-1],["7 дней",-6,0],["30 дней",-29,0],["90 дней",-89,0],["С начала года","y",0]].map(([t,a,b])=>`<button data-a="${a}" data-b="${b}">${t}</button>`).join("")}</div>
   <div class="nog"><label>С<input type="date" id="dbf1" value="${iso(r.f)}" max="${iso(T)}"></label><label>По<input type="date" id="dbf2" value="${iso(r.t)}" max="${iso(T)}"></label></div>
   <div class="mut" id="dbmm" style="margin-top:6px"></div><button class="btn" id="dbgo" style="width:100%;margin-top:10px">Показать</button></div>`;
  document.body.appendChild(ov);ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector(".vox").onclick=()=>ov.remove();
  const go=(f,t)=>{if(t<f)[f,t]=[t,f];if((t-f)/864e5>400)return ov.querySelector("#dbmm").textContent="Не больше 400 дней";mode="custom";cf=f;ct=t;ov.remove();dashDraw()};
  ov.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{const a=b.dataset.a;go(a==="y"?new Date(T.getFullYear(),0,1):add(T,+a),add(T,+b.dataset.b))});
  ov.querySelector("#dbgo").onclick=()=>{const a=ov.querySelector("#dbf1").value,b=ov.querySelector("#dbf2").value;if(!a||!b)return ov.querySelector("#dbmm").textContent="Выберите обе даты";go(parse(a),parse(b))}}
 const fr=n=>fmt(Math.round(n||0));   // без копеек
 function paint(d,r){const el=$("#dbb"),pw=prevWord(),fmt=fr,O=d.orders||{};
  el.innerHTML=`<div class="dbk">
   <div class="card k hero"><div class="l">Выручка (продажи)</div><div class="v">${fmt(d.revenue)} ₸</div>${delta(d.revenue,d.prevRevenue)}<span class="p">${pw} ${fmt(d.prevRevenue)} ₸</span>
    <div class="p" style="margin:4px 0 0"><span class="nw">отгрузки ${fmt(d.shipped)} ₸</span> · <span class="nw">касса ${fmt(d.retail)} ₸</span>${d.returns?` · <span class="nw">возвраты −${fmt(d.returns)} ₸</span>`:""}</div></div>
   <div class="card k"><div class="l">Продажи</div><div class="v">${fmt(d.count)}</div>${delta(d.count,d.prevCount)}<span class="p">${pw} ${fmt(d.prevCount)}</span><div class="p" style="margin:3px 0 0">отгрузок ${d.shipCount} · чеков ${d.retailCount}</div></div>
   <div class="card k"><div class="l">Средний чек</div><div class="v">${fmt(d.avg)} ₸</div>${delta(d.avg,d.prevAvg)}<span class="p">${pw} ${fmt(d.prevAvg)} ₸</span></div>
   <div class="card k"><div class="l">Валовая прибыль</div>${d.gross?`<div class="v">${fmt(d.gross.profit)} ₸</div>${d.prevGross?delta(d.gross.profit,d.prevGross.profit):""}<span class="p">маржа ${Math.round(d.gross.margin)}%</span><div class="p" style="margin:3px 0 0">${pw} ${d.prevGross?fmt(d.prevGross.profit)+" ₸":"—"}</div>`:'<div class="v">—</div><span class="p" style="margin:0">МойСклад не ответил</span>'}</div>
   <div class="card k"><div class="l">Новые заказы</div><div class="v">${fmt(O.count)}</div><div class="p" style="margin:-2px 0 4px;font-size:13px;color:inherit">на ${fmt(O.sum)} ₸</div>${delta(O.sum,O.prevSum)}<span class="p">${pw} ${fmt(O.prevCount)} на ${fmt(O.prevSum)} ₸</span><div class="p" style="margin:3px 0 0">ждём оплату: ${fmt(O.unpaid)} ₸</div></div></div>
   <div class="card dbc"><h3>${d.hourly?"Выручка по часам":"Выручка по дням"}</h3><div class="leg"><span><i style="background:#1F6B4E"></i>${mode==="day"&&r.live?"Сегодня":"Период"}</span><span><i class="ln"></i>${mode==="day"?(r.live?"Вчера":"День до"):"Прошлый период"}</span></div>
    <div style="position:relative"><svg id="dbch" width="100%" height="200" style="display:block;touch-action:pan-y"></svg><div class="tip" id="dbtip" hidden></div></div></div>

     <div class="card dbc"><h3>Статусы заказов за период</h3>${d.states.length?`<div class="st">${d.states.map(x=>`<div><b>${fmt(x.count)}</b><span><i style="background:${esc(x.color)}"></i>${esc(x.name)}</span></div>`).join("")}</div>`:'<div class="mut">Заказов нет</div>'}</div></div></div>
   <div class="card dbc"><h3>Топ клиентов <small>за период</small></h3>${d.topClients.length?d.topClients.map(x=>`<div class="row"><div class="n">${esc(x.name)}</div><span class="s">${x.count} ${x.count%10===1&&x.count%100!==11?"заказ":x.count%10>=2&&x.count%10<=4&&(x.count%100<10||x.count%100>=20)?"заказа":"заказов"} · ${fmt(x.sum)} ₸</span></div>`).join(""):'<div class="mut">Заказов нет</div>'}</div>`;
  chart(d,r)}
 function chart(d,r){const sv=$("#dbch"),tip=$("#dbtip");if(!sv)return;const W=sv.clientWidth||340,H=200,L=40,B=22,T=10,n=d.series.length;sv.setAttribute("viewBox",`0 0 ${W} ${H}`);

  const cw=(W-L-4)/n,x=i=>L+(i+.5)*cw,bw=Math.max(2,Math.min(28,cw-3)),y=v=>H-B-(v/nice)*(H-B-T),kf=v=>v>=1e6?(v/1e6).toFixed(v%1e6?1:0)+"M":v>=1e3?Math.round(v/1e3)+"k":v;

  const step=d.hourly?3:Math.ceil(n/7);

   if(i%step===0)o+=`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="#5C6B63">${d.hourly?i:lbl(i)}</text>`});
  if(n>1)o+=`<polyline fill="none" stroke="#B8C2BC" stroke-width="2" stroke-linejoin="round" points="${d.prevSeries.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
  o+=`<line x1="${L}" x2="${W}" y1="${H-B}" y2="${H-B}" stroke="#C9D3CE"/><rect id="dbhl" x="0" y="${T}" width="${cw}" height="${H-B-T}" fill="#0E3B2C" opacity="0" />`;sv.innerHTML=o;
  const hl=sv.querySelector("#dbhl");
  const at=e=>{const b=sv.getBoundingClientRect(),px=(e.touches?e.touches[0].clientX:e.clientX)-b.left,i=Math.floor((px*W/b.width-L)/cw);if(i<0||i>=n){tip.hidden=true;hl.setAttribute("opacity",0);return}

   tip.innerHTML=`<b>${lbl(i)}</b> — ${fr(d.series[i])} ₸${c?` · ${c} ${c%10===1&&c%100!==11?"продажа":c%10>=2&&c%10<=4&&(c%100<10||c%100>=20)?"продажи":"продаж"}`:""}<br><span style="opacity:.7">прошлый: ${fr(d.prevSeries[i]||0)} ₸</span>`;tip.hidden=false;
   const tw=tip.offsetWidth,lx=Math.min(Math.max(0,(x(i)*b.width/W)-tw/2),b.width-tw);tip.style.left=lx+"px";tip.style.top="0px"};
  sv.onmousemove=at;sv.ontouchstart=at;sv.ontouchmove=at;sv.onmouseleave=()=>{tip.hidden=true;hl.setAttribute("opacity",0)}}
 const st=document.createElement("style");st.textContent=`#dash{margin-bottom:8px}.dbh{font-weight:800;font-size:17px;margin:22px 0 10px}

<script>
/* iPhone: после закрытия клавиатуры (поиск, новый заказ, даты) экран иногда остаётся сдвинутым — нижняя панель
   повисает посередине. Пока клавиатура открыта — панель прячем; после закрытия — возвращаем экран на место. */
(function(){const vv=window.visualViewport,typing=()=>{const a=document.activeElement;return!!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/^(checkbox|radio|button|submit|file|range|color)$/.test(a.type||"")};
 const kbd=()=>document.body.classList.toggle("kbd",typing()&&!!vv&&vv.height<innerHeight*.85);
 const settle=()=>{if(typing())return;document.body.classList.remove("kbd");
  requestAnimationFrame(()=>{window.scrollTo(window.scrollX,window.scrollY);const h=document.documentElement;h.style.minHeight="calc(100% + 1px)";
   requestAnimationFrame(()=>{h.style.minHeight="";window.scrollTo(window.scrollX,window.scrollY)})})};
 document.addEventListener("focusin",()=>setTimeout(kbd,300));
 document.addEventListener("focusout",()=>setTimeout(settle,120));
 if(vv){vv.addEventListener("resize",()=>{kbd();if(!typing()&&vv.height>innerHeight*.85)settle()});vv.addEventListener("scroll",()=>{if(!typing()&&vv.offsetTop>0)settle()})}
 const st=document.createElement("style");st.textContent="body.kbd .tabbar{display:none}";document.head.appendChild(st);
 /* панель всегда у нижнего края видимой области: если iPhone не вернул экран на место после клавиатуры,
    сдвигаем панель на разницу между видимой областью и «раскладкой» страницы */
 const app=navigator.standalone||matchMedia("(display-mode: standalone)").matches;
 const pin=()=>{const tb=document.querySelector(".tabbar");if(!tb)return;
  const off=!vv||typing()||vv.scale>1.01?0:Math.round(vv.offsetTop+vv.height-document.documentElement.clientHeight);
  tb.style.transform=Math.abs(off)>(app?1:120)?"translateY("+off+"px)":""};   /* в Safari не реагируем на адресную строку */
 const pinSoon=()=>{pin();requestAnimationFrame(pin);setTimeout(pin,150);setTimeout(pin,500)};
 if(vv){vv.addEventListener("resize",pinSoon);vv.addEventListener("scroll",pin)}
 addEventListener("scroll",pin,{passive:true});addEventListener("orientationchange",pinSoon);
 document.addEventListener("focusout",()=>setTimeout(pinSoon,150));
 document.addEventListener("visibilitychange",()=>{if(!document.hidden)pinSoon()});
})();
</script>
<script>
/* Свежие данные без ручного обновления: раздел показывается сразу (из кэша), а если данные были старыми —
   через пару секунд тихо перерисовывается свежими. При возврате в приложение текущий раздел тоже обновляется. */
(function(){const LIVE={overview:1,orders:1,retail:1};let busy=false,hiddenAt=0;
 const quiet=()=>!document.querySelector(".ovx")&&!(window.docOpen&&docOpen())&&!(document.getElementById("pv")&&!document.getElementById("pv").hidden)&&
  !(document.activeElement&&/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&document.getElementById("main").contains(document.activeElement));
 async function refresh(tries){if(busy||!LIVE[cur]||((cur==="orders"||cur==="retail")&&window.ordDeep))return;   // пролистали «Показать ещё» — не сбрасываем списокconst n=nav,p=cur,a=lastArg;busy=true;
  try{for(let i=0;i<tries;i++){await new Promise(r=>setTimeout(r,i?2500:0));if(n!==nav||p!==cur)return;
    if(!quiet()){i--;await new Promise(r=>setTimeout(r,1500));continue}
    gotStale=false;const y=scrollY;await views[p](a);if(n!==nav)return;scrollTo(0,y);if(!gotStale)return}}
  catch(e){}finally{busy=false}}
 const _show=show;show=async(p,a)=>{const r=await _show(p,a);const n=nav;if(gotStale&&LIVE[p])setTimeout(()=>{if(n===nav)refresh(4)},2500);return r};
 document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>20000&&typeof tok!=="undefined"&&tok)refresh(4);hiddenAt=0});
})();
</script>
